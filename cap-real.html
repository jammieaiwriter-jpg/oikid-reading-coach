, "partLabel": "言談理解", "optionsType": "text", "options": ["To go to the gym", "To clean their classroom", "To meet at the playground"], "answer": 0, "audioSrc": "audio/cap-real/115/17%20%E7%AC%AC12%E9%A1%8C.mp3", "picSrc": null}, {"year": 115, "qnum": 13, "part": 3, "partLabel": "言談理解", "optionsType": "text", "options": ["Today", "Next week", "When it plays on TV"], "answer": 0, "audioSrc": "audio/cap-real/115/18%20%E7%AC%AC13%E9%A1%8C.mp3", "picSrc": null}, {"year": 115, "qnum": 14, "part": 3, "partLabel": "言談理解", "optionsType": "text", "options": ["Use their time well", "Check their eye health", "Follow rules during a hospital visit"], "answer": 1, "audioSrc": "audio/cap-real/115/19%20%E7%AC%AC14%E9%A1%8C.mp3", "picSrc": null}, {"year": 115, "qnum": 15, "part": 3, "partLabel": "言談理解", "optionsType": "text", "options": ["They both did badly", "The boy did badly, but the girl did well", "The boy did well, but the girl did badly"], "answer": 0, "audioSrc": "audio/cap-real/115/20%20%E7%AC%AC15%E9%A1%8C.mp3", "picSrc": null}, {"year": 115, "qnum": 16, "part": 3, "partLabel": "言談理解", "optionsType": "text", "options": ["He misses it", "He feels excited about it", "He doesn’t really enjoy it"], "answer": 2, "audioSrc": "audio/cap-real/115/21%20%E7%AC%AC16%E9%A1%8C.mp3", "picSrc": null}, {"year": 115, "qnum": 17, "part": 3, "partLabel": "言談理解", "optionsType": "text", "options": ["It gave very little food", "Its food and service were bad", "It allowed people to bring their pets"], "answer": 1, "audioSrc": "audio/cap-real/115/22%20%E7%AC%AC17%E9%A1%8C.mp3", "picSrc": null}, {"year": 115, "qnum": 18, "part": 3, "partLabel": "言談理解", "optionsType": "text", "options": ["Nothing", "Start a fight with her", "Talk to her and ask her to stop"], "answer": 0, "audioSrc": "audio/cap-real/115/23%20%E7%AC%AC18%E9%A1%8C.mp3", "picSrc": null}, {"year": 115, "qnum": 19, "part": 3, "partLabel": "言談理解", "optionsType": "text", "options": ["He will not read them", "He is studying too hard", "He var LK='nanyi-eng-ledger-v1';
var PK='cap-real-progress-v1';

function ledger(){try{return JSON.parse(localStorage.getItem(LK)||'{}')}catch(e){return{}}}
function saveLedger(d){try{localStorage.setItem(LK,JSON.stringify(d))}catch(e){}}
function recordWrong(year, item){
  var d=ledger();
  d.capReal=d.capReal||[];
  d.capReal.push({type:'cap-real', year:parseInt(year,10), qnum:item.qnum, part:item.part, ts:Date.now()});
  saveLedger(d);
}

function loadProgress(){
  try{ var p=JSON.parse(localStorage.getItem(PK)||'null'); if(p && typeof p==='object') return p; }catch(e){}
  return {};
}
function saveProgress(p){try{localStorage.setItem(PK,JSON.stringify(p))}catch(e){}}
var PROGRESS=loadProgress();

function bestFor(year){ return (PROGRESS[year] && PROGRESS[year].best) || null; }
function recordResult(year, mode, answers){
  var okN=answers.filter(function(a){return a.correct}).length;
  var total=answers.length;
  PROGRESS[year]=PROGRESS[year]||{};
  PROGRESS[year].last={mode:mode, answers:answers, ts:Date.now()};
  var prevBest=PROGRESS[year].best;
  if(!prevBest || okN>prevBest.score){
    PROGRESS[year].best={score:okN, total:total, mode:mode, ts:Date.now()};
  }
  saveProgress(PROGRESS);
  return {okN:okN, total:total};
}

var APP={year:null, mode:null, idx:0, answers:[], playedOnce:false, autoTimer:null};

function partLabel(p){return {1:'辨識句意',2:'基本問答',3:'言談理解'}[p]||''}

function renderHome(){
  var host=document.getElementById('stage');
  var html='<div class="card"><h2 style="margin-top:0;color:#0b7285">選年份</h2><div class="yearrow">';
  YEARS.forEach(function(y){
    var b=bestFor(y);
    html+='<button class="yearbtn" data-y="'+y+'">'+y+' 年'
      +(b?('<span class="best">最佳 '+b.score+'/'+b.total+'</span>'):'<span class="best">尚未作答</span>')
      +'</button>';
  });
  html+='</div></div>';
  host.innerHTML=html;
  host.querySelectorAll('.yearbtn').forEach(function(b){
    b.onclick=function(){ APP.year=b.getAttribute('data-y'); renderModeSelect(); };
  });
}

function renderModeSelect(){
  var host=document.getElementById('stage');
  var html='<div class="card"><button class="btn ghost" id="backHome">← 換年份</button>'
    +'<h2 style="color:#0b7285">'+APP.year+' 年會考聽力</h2>'
    +'<div class="moderow">'
    +'<button class="modebtn" id="stepModeBtn"><b>🎧 逐題演練</b><span>一題一題來，播完馬上看對錯與正解，適合練習弱點。</span></button>'
    +'<button class="modebtn" id="fullModeBtn"><b>📝 整卷模式</b><span>21 題連續播放，不逐題公布答案，交卷後才看成績與檢討，貼近真實考感。</span></button>'
    +'</div></div>';
  host.innerHTML=html;
  document.getElementById('backHome').onclick=renderHome;
  document.getElementById('stepModeBtn').onclick=function(){ startStepMode(); };
  document.getElementById('fullModeBtn').onclick=function(){ startFullMode(); };
}

function startStepMode(){
  APP.mode='step'; APP.idx=0; APP.answers=[];
  renderStepQuestion();
}

function currentItems(){ return DATA[APP.year]; }

function optionsHtml(item, prefix){
  var host='';
  if(item.optionsType==='picture'){
    host+='<div class="picwrap"><span class="picbadge">第 '+item.qnum+' 題</span>'
      +'<img src="'+item.picSrc+'" alt="第'+item.qnum+'題圖片"></div>'
      +'<div class="pichint">請對照上圖找出對應圖片，再選 A / B / C</div>'
      +'<div class="opts abc-row" id="opts">'
      +['A','B','C'].map(function(L,i){return '<button class="opt dim" data-idx="'+i+'">'+L+'</button>'}).join('')
      +'</div>';
  } else {
    host+='<div class="opts" id="opts">'
      +item.options.map(function(t,i){return '<button class="opt dim" data-idx="'+i+'">'+t+'</button>'}).join('')
      +'</div>';
  }
  return host;
}

function renderStepQuestion(){
  var host=document.getElementById('stage');
  var items=currentItems();
  if(APP.idx>=items.length){ renderStepReport(); return; }
  var item=items[APP.idx];
  APP.playedOnce=false;
  var html='<div class="card"><div class="qhead"><span class="num">第 '+item.qnum+' 題</span>'
    +'<span class="part">'+item.partLabel+'</span>'
    +'<span class="prog">'+(APP.idx+1)+' / '+items.length+'</span></div>';
  html+='<div class="playbar"><button class="btn" id="playBtn">▶ 播放</button>'
    +'<button class="btn ghost" id="replayBtn" disabled>🔁 再聽一次</button></div>';
  html+='<audio id="qaudio" preload="none" src="'+(item.audioSrc||'')+'"></audio>';
  html+=optionsHtml(item);
  html+='<div id="afterQ"></div></div>';
  host.innerHTML=html;

  var opts=document.getElementById('opts');
  var audioEl=document.getElementById('qaudio');
  document.getElementById('playBtn').onclick=function(){
    opts.querySelectorAll('.opt').forEach(function(b){b.disabled=false;b.classList.remove('dim')});
    document.getElementById('replayBtn').disabled=false;
    var p=audioEl.play(); if(p&&p.catch)p.catch(function(){});
  };
  document.getElementById('replayBtn').onclick=function(){
    audioEl.currentTime=0; var p=audioEl.play(); if(p&&p.catch)p.catch(function(){});
  };
  opts.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){ stepAnswer(item, parseInt(b.getAttribute('data-idx'),10), opts); };
  });
}

function stepAnswer(item, chosenIdx, opts){
  opts.querySelectorAll('.opt').forEach(function(b){b.disabled=true});
  var right=chosenIdx===item.answer;
  opts.querySelectorAll('.opt').forEach(function(b){
    var i=parseInt(b.getAttribute('data-idx'),10);
    if(i===item.answer) b.classList.add('correct');
    else if(i===chosenIdx) b.classList.add('wrong');
  });
  if(!right) recordWrong(APP.year, item);
  APP.answers.push({qnum:item.qnum, part:item.part, chosen:chosenIdx, correct:right});

  var answerText = item.optionsType==='picture' ? ['A','B','C'][item.answer] : item.options[item.answer];
  var after=document.getElementById('afterQ');
  var html='<div class="result '+(right?'ok':'no')+'">'+(right?'✓ 答對了':'✗ 答錯了')+'</div>';
  html+='<div class="answer-line">正解：'+answerText+'</div>';
  html+='<button class="btn" id="nextBtn">下一題 →</button>';
  after.innerHTML=html;
  document.getElementById('nextBtn').onclick=function(){ APP.idx++; renderStepQuestion(); };
}

function renderStepReport(){
  var r=recordResult(APP.year, 'step', APP.answers);
  renderReportCommon(r, APP.answers, 'step');
}

function renderReportCommon(r, answers, mode){
  var host=document.getElementById('stage');
  var items=currentItems();
  var byPart={};
  answers.forEach(function(a){
    byPart[a.part]=byPart[a.part]||{ok:0,n:0}; byPart[a.part].n++; if(a.correct)byPart[a.part].ok++;
  });
  var html='<div class="card report"><h2>📋 '+APP.year+' 年成績單（'+(mode==='step'?'逐題演練':'整卷模式')+'）</h2>';
  html+='<div class="stat"><span>總分</span><b>'+r.okN+' / '+r.total+'</b></div>';
  Object.keys(byPart).sort().forEach(function(p){
    var s=byPart[p];
    html+='<div class="stat"><span>'+partLabel(parseInt(p,10))+'</span><b>'+s.ok+' / '+s.n+'</b></div>';
  });
  html+='<h2 style="margin-top:16px">逐題檢討</h2>';
  answers.forEach(function(a){
    var item=items.find(function(it){return it.qnum===a.qnum});
    var answerText = item.optionsType==='picture' ? ['A','B','C'][item.answer] : item.options[item.answer];
    html+='<div class="review-item"><div class="rh '+(a.correct?'ok':'no')+'"><span>第 '+a.qnum+' 題（'+item.partLabel+'）</span>'
      +'<span>'+(a.correct?'✓ 答對':'✗ 答錯')+'</span></div>'
      +'<div class="ra">正解：'+answerText+'</div></div>';
  });
  html+='<button class="btn" id="backHome2" style="margin-top:14px">← 回選單</button></div>';
  host.innerHTML=html;
  document.getElementById('backHome2').onclick=renderHome;
}

// ---------- 整卷模式：21 題音軌連續自動播放，不逐題回饋 ----------
function startFullMode(){
  APP.mode='full'; APP.idx=0;
  APP.answers=currentItems().map(function(it){return {qnum:it.qnum, part:it.part, chosen:null, correct:false}});
  renderFullIntro();
}

function renderFullIntro(){
  var host=document.getElementById('stage');
  var html='<div class="card"><h2 style="color:#0b7285;margin-top:0">'+APP.year+' 年整卷模式</h2>'
    +'<p style="color:#52606d;font-size:.9rem;line-height:1.7">21 題會依序自動連續播放（跟考場一樣），過程中可以隨時作答、也可以先不選之後回來改（限「目前正在播放或已播過」的題目），播完最後一題或按「交卷」才會看到成績。</p>'
    +'<button class="btn" id="startExamBtn">▶ 開始考試</button>'
    +'<button class="btn ghost" id="backHome3">← 回選單</button></div>';
  host.innerHTML=html;
  document.getElementById('backHome3').onclick=renderHome;
  document.getElementById('startExamBtn').onclick=function(){ APP.idx=0; renderFullQuestion(true); };
}

function renderFullQuestion(autoplay){
  var host=document.getElementById('stage');
  var items=currentItems();
  var item=items[APP.idx];
  var html='<div class="card"><div class="qhead"><span class="num">第 '+item.qnum+' 題</span>'
    +'<span class="part">'+item.partLabel+'</span>'
    +'<span class="prog">'+(APP.idx+1)+' / '+items.length+'</span></div>';
  html+='<audio id="qaudio" preload="none" src="'+(item.audioSrc||'')+'"></audio>';
  html+=optionsHtml(item);
  html+='<div class="examnav" id="examNav"></div>';
  html+='<button class="btn warn" id="submitBtn">交卷</button></div>';
  host.innerHTML=html;

  var nav=document.getElementById('examNav');
  items.forEach(function(it,i){
    var d=document.createElement('button'); d.className='navdot';
    if(i===APP.idx) d.classList.add('cur');
    if(APP.answers[i].chosen!==null) d.classList.add('answered');
    d.textContent=it.qnum;
    d.onclick=function(){ if(i<=APP.idx){ APP.idx=i; renderFullQuestion(false); } };
    nav.appendChild(d);
  });

  var opts=document.getElementById('opts');
  var picked=APP.answers[APP.idx].chosen;
  opts.querySelectorAll('.opt').forEach(function(b){
    b.disabled=false; b.classList.remove('dim');
    if(parseInt(b.getAttribute('data-idx'),10)===picked) b.classList.add('picked');
    b.onclick=function(){
      var idx=parseInt(b.getAttribute('data-idx'),10);
      APP.answers[APP.idx].chosen=idx;
      opts.querySelectorAll('.opt').forEach(function(x){x.classList.remove('picked')});
      b.classList.add('picked');
    };
  });

  var audioEl=document.getElementById('qaudio');
  audioEl.onended=function(){
    if(APP.idx<items.length-1){ APP.idx++; renderFullQuestion(true); }
    else { finishFullMode(); }
  };
  document.getElementById('submitBtn').onclick=finishFullMode;

  if(autoplay){
    var p=audioEl.play(); if(p&&p.catch)p.catch(function(){});
  }
}

function finishFullMode(){
  var items=currentItems();
  APP.answers.forEach(function(a,i){
    var item=items[i];
    a.correct = a.chosen===item.answer;
    if(!a.correct) recordWrong(APP.year, item);
  });
  var r=recordResult(APP.year, 'full', APP.answers);
  renderReportCommon(r, APP.answers, 'full');
}

document.addEventListener('DOMContentLoaded', renderHome);
</script></body></html>
