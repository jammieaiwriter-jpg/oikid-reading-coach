<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>英文錯題本</title><style>

</style></head><body><div class="wrap"><div class="hero"><h1>📒 英文錯題本</h1><p>練習時答錯的文法點都記在這裡。「追攻」會出<strong>同觀念、不同面孔</strong>的新題——3 題全對才銷帳，證明是真的懂了，不是背答案。<span id="summary"></span></p></div><div class="sect"><div class="head">⚔️ 文法待補</div><div id="gp-list"></div></div><div class="sect"><div class="head">📖 閱讀題型命中率</div><div class="card" id="read-stats"></div></div><div class="note">閱讀弱的題型不重考舊文章——處方是回聽讀頁和課次頁多讀幾篇再作答。</div></div><script>/*
 * grammar-gen.js
 * 英文文法無限出題引擎 —— 零依賴、純 JS，可直接內嵌到瀏覽器頁面，也可在 Node 測試中 require()。
 *
 * 使用方式：
 *   瀏覽器: 以 script 標籤內嵌本檔 -> window.GrammarGen.make(["GP-01","GP-10"], 20, seed)
 *   Node:   const GrammarGen = require("./grammar-gen.js"); GrammarGen.make(["GP-01"], 50, 42)
 *
 * 輸出題目格式（與現有練習頁一致）：
 *   { kind:"fill", q, answer, options:[3個, 已隨機排序], say, gp:"GP-01" }
 *
 * 設計重點（硬規則）：
 *   - 每個模板的 3 個選項中，只有 1 個在該題的上下文下文法正確；另外 2 個一定錯，
 *     且錯誤原因是「詞池與句型骨架搭配後恆錯」，不是碰運氣才錯。
 *   - say 一律用 q.replace("___", answer) 生成，保證包含正確答案原字串。
 *   - 支援 seed（整數）→ 可重現；不給 seed 用 Math.random()。
 */
(function (root) {
  "use strict";

  // ---------------------------------------------------------------------
  // 0. 隨機數工具（可種子化）
  // ---------------------------------------------------------------------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeRng(seed) {
    if (seed === undefined || seed === null) {
      return Math.random;
    }
    return mulberry32(Number(seed) || 0);
  }

  function pick(rng, arr) {
    return arr[Math.floor(rng() * arr.length)];
  }

  function pickIndex(rng, n) {
    return Math.floor(rng() * n);
  }

  // 從陣列中隨機挑 count 個「排除 excludeSet 內容」的相異元素
  function pickDistinctExcluding(rng, arr, excludeArr, count) {
    var pool = arr.filter(function (x) {
      return excludeArr.indexOf(x) === -1;
    });
    var out = [];
    var used = {};
    var guard = 0;
    while (out.length < count && guard < 500) {
      guard++;
      var cand = pick(rng, pool);
      if (!used[cand]) {
        used[cand] = true;
        out.push(cand);
      }
    }
    return out;
  }

  function shuffle(rng, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function cap(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // 刻意產生「看起來像單字但拼錯」的干擾項：重複最後一個字母。
  // 保證不等於詞池中任何真實單字（我們的詞池沒有雙寫尾字母的巧合詞）。
  function mangle(word) {
    return word + word.slice(-1);
  }

  // ---------------------------------------------------------------------
  // 1. 詞池（GEPT 初級基礎字）
  // ---------------------------------------------------------------------
  var NAMES = [
    { name: "Tom", g: "m" },
    { name: "Jack", g: "m" },
    { name: "Sam", g: "m" },
    { name: "Ben", g: "m" },
    { name: "Leo", g: "m" },
    { name: "Amy", g: "f" },
    { name: "Mary", g: "f" },
    { name: "Lily", g: "f" },
    { name: "Kate", g: "f" },
    { name: "Nina", g: "f" },
  ];

  // nouns: sg / pl / vowel(是否母音開頭，用於 a/an) / wrongPl(刻意錯誤複數)
  var NOUN_DEFS = [
    ["cat", "cats", false],
    ["dog", "dogs", false],
    ["book", "books", false],
    ["apple", "apples", true],
    ["ball", "balls", false],
    ["box", "boxes", false],
    ["pen", "pens", false],
    ["cup", "cups", false],
    ["bag", "bags", false],
    ["hat", "hats", false],
    ["car", "cars", false],
    ["bike", "bikes", false],
    ["egg", "eggs", true],
    ["banana", "bananas", false],
    ["chair", "chairs", false],
    ["orange", "oranges", true],
    ["umbrella", "umbrellas", true],
    ["watch", "watches", false],
    ["baby", "babies", false],
    ["kite", "kites", false],
  ];
  var NOUNS = NOUN_DEFS.map(function (d) {
    var sg = d[0],
      pl = d[1],
      vowel = d[2];
    // 規律變化 (sg+'s'===pl) 的錯誤複數用 sg+'es'；不規律變化(es/ies)的錯誤複數用 sg+'s'
    var wrongPl = pl === sg + "s" ? sg + "es" : sg + "s";
    return { sg: sg, pl: pl, vowel: vowel, wrongPl: wrongPl };
  });

  var ADJECTIVES = [
    "big", "small", "tall", "short", "happy", "sad", "hungry",
    "thirsty", "tired", "busy", "kind", "smart", "young", "nice",
  ];

  var PLACES = [
    "school", "park", "zoo", "library", "store", "classroom",
    "garden", "playground", "room", "home",
  ];

  // 動作動詞（用於現在進行式 & can & 祈使句）: base / s(第三人稱單數) / ing / wrongIng
  var ACTION_VERB_DEFS = [
    ["run", "runs", "running", "runing"],
    ["swim", "swims", "swimming", "swiming"],
    ["sit", "sits", "sitting", "siting"],
    ["write", "writes", "writing", "writeing"],
    ["make", "makes", "making", "makeing"],
    ["come", "comes", "coming", "comeing"],
    ["play", "plays", "playing", "playeing"],
    ["read", "reads", "reading", "readeing"],
    ["eat", "eats", "eating", "eateing"],
    ["jump", "jumps", "jumping", "jumpeing"],
    ["sing", "sings", "singing", "singeing"],
    ["dance", "dances", "dancing", "danceing"],
    ["ride", "rides", "riding", "rideing"],
    ["cook", "cooks", "cooking", "cookeing"],
    ["fly", "flies", "flying", "flyeing"],
    ["drive", "drives", "driving", "driveing"],
    ["open", "opens", "opening", "openning"],
    ["close", "closes", "closing", "closeing"],
    ["wash", "washes", "washing", "washeing"],
    ["clean", "cleans", "cleaning", "cleanning"],
    ["listen", "listens", "listening", "listenning"],
    ["look", "looks", "looking", "lookking"],
    ["stop", "stops", "stopping", "stoping"],
    ["wait", "waits", "waiting", "waitting"],
    ["stand", "stands", "standing", "standding"],
    ["help", "helps", "helping", "helpping"],
  ];
  var ACTION_VERBS = ACTION_VERB_DEFS.map(function (d) {
    return { base: d[0], s: d[1], ing: d[2], wrongIng: d[3] };
  });

  var MASS_NOUNS = [
    "water", "rice", "milk", "money", "juice", "bread", "cheese", "tea", "coffee", "soup",
  ];

  var WEEKDAYS = [
    "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday",
  ];
  var MONTHS = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December",
  ];

  var CARDINAL = [
    "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
    "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen",
    "eighteen", "nineteen", "twenty", "twenty-one", "twenty-two", "twenty-three",
    "twenty-four", "twenty-five", "twenty-six", "twenty-seven", "twenty-eight",
    "twenty-nine", "thirty", "thirty-one",
  ];
  var ORDINAL = [
    "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth",
    "ninth", "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth",
    "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth",
    "twenty-first", "twenty-second", "twenty-third", "twenty-fourth", "twenty-fifth",
    "twenty-sixth", "twenty-seventh", "twenty-eighth", "twenty-ninth", "thirtieth",
    "thirty-first",
  ];

  // 全部 be 動詞主詞（含姓名、人稱代名詞），每個都標好正確 be 型態
  function allBeSubjects() {
    var list = NAMES.map(function (n) {
      return { text: n.name, be: "is" };
    });
    list.push({ text: "He", be: "is" });
    list.push({ text: "She", be: "is" });
    list.push({ text: "It", be: "is" });
    list.push({ text: "I", be: "am" });
    list.push({ text: "You", be: "are" });
    list.push({ text: "We", be: "are" });
    list.push({ text: "They", be: "are" });
    return list;
  }
  var BE_SUBJECTS = allBeSubjects();
  var ALL_BE_FORMS = ["am", "is", "are"];

  function twoNameSubject(rng) {
    var n1 = pick(rng, NAMES);
    var n2 = pick(rng, NAMES.filter(function (n) { return n.name !== n1.name; }));
    return { text: n1.name + " and " + n2.name, be: "are" };
  }

  // ---------------------------------------------------------------------
  // 2. 每個 GP 的骨架 + 生成邏輯
  // ---------------------------------------------------------------------
  function buildItem(gp, q, answer, distractors, extra) {
    var options3 = [answer].concat(distractors);
    var say = q.replace("___", answer);
    // 若空格在句首，插入的答案要大寫成句首字母（例如 "open" -> "Open"）
    if (q.indexOf("___") === 0 && say.length > 0) {
      say = say.charAt(0).toUpperCase() + say.slice(1);
    }
    return {
      kind: "fill",
      q: q,
      answer: answer,
      options: options3,
      say: say,
      gp: gp,
    };
  }

  function finalizeOptions(rng, item) {
    item.options = shuffle(rng, item.options);
    return item;
  }

  // ---- GP-01 be動詞 -------------------------------------------------
  function genGP01(rng) {
    var subj = rng() < 0.15 ? twoNameSubject(rng) : pick(rng, BE_SUBJECTS);
    var wrongForms = ALL_BE_FORMS.filter(function (f) { return f !== subj.be; });
    var faces = [
      function () { return subj.text + " ___ " + pick(rng, ADJECTIVES) + "."; },
      function () { return subj.text + " ___ very " + pick(rng, ADJECTIVES) + "."; },
      function () { return subj.text + " ___ " + pick(rng, ADJECTIVES) + " today."; },
      function () { return subj.text + " ___ so " + pick(rng, ADJECTIVES) + "."; },
      function () { return subj.text + " ___ at the " + pick(rng, PLACES) + "."; },
      function () { return subj.text + " ___ in the " + pick(rng, PLACES) + "."; },
    ];
    var q = pick(rng, faces)();
    return buildItem("GP-01", q, subj.be, wrongForms);
  }

  // ---- GP-02 名詞複數 -------------------------------------------------
  function genGP02(rng) {
    var noun = pick(rng, NOUNS);
    var numWord = CARDINAL[1 + pickIndex(rng, 8)]; // two..nine
    var isPlural = rng() < 0.5;
    var faces;
    if (isPlural) {
      faces = [
        function () { return "I have " + numWord + " ___."; },
        function () { return "There are " + numWord + " ___ on the desk."; },
        function () { return "I see " + numWord + " ___ in the sky."; },
      ];
      var q = pick(rng, faces)();
      return buildItem("GP-02", q, noun.pl, [noun.sg, noun.wrongPl]);
    } else {
      faces = [
        function () { return "She has one ___."; },
        function () { return "He has one ___ in his bag."; },
        function () { return "We need one ___ for the party."; },
      ];
      var q2 = pick(rng, faces)();
      return buildItem("GP-02", q2, noun.sg, [noun.pl, noun.wrongPl]);
    }
  }

  // ---- GP-03 冠詞 a/an -------------------------------------------------
  function genGP03(rng) {
    var noun = pick(rng, NOUNS);
    var correct = noun.vowel ? "an" : "a";
    var wrongArticle = noun.vowel ? "a" : "an";
    var faces = [
      function () { return "I have ___ " + noun.sg + "."; },
      function () { return "She wants ___ " + noun.sg + "."; },
      function () { return "There is ___ " + noun.sg + " on the table."; },
      function () { return "Look! It's ___ " + noun.sg + "."; },
      function () { return "He needs ___ " + noun.sg + " today."; },
      function () { return "Can I have ___ " + noun.sg + "?"; },
    ];
    var q = pick(rng, faces)();
    return buildItem("GP-03", q, correct, [wrongArticle, "some"]);
  }

  // ---- GP-04 指示代名詞 -------------------------------------------------
  function genGP04(rng) {
    var sgNoun = pick(rng, NOUNS).sg;
    var plNoun = pick(rng, NOUNS).pl;
    var faces = [
      { ctx: "It's right here.", blankQ: "___ is my " + sgNoun + ".", answer: "This", wrong: ["That", "These"] },
      { ctx: "It's over there.", blankQ: "___ is my " + sgNoun + ".", answer: "That", wrong: ["This", "Those"] },
      { ctx: "They're right here.", blankQ: "___ are my " + plNoun + ".", answer: "These", wrong: ["Those", "This"] },
      { ctx: "They're over there.", blankQ: "___ are my " + plNoun + ".", answer: "Those", wrong: ["These", "That"] },
      { ctx: "Look, it's close to me.", blankQ: "___ is a nice " + sgNoun + ".", answer: "This", wrong: ["That", "These"] },
      { ctx: "Look, they're far away.", blankQ: "___ are cute " + plNoun + ".", answer: "Those", wrong: ["These", "That"] },
    ];
    var f = pick(rng, faces);
    var q = f.ctx + " " + f.blankQ;
    return buildItem("GP-04", q, f.answer, f.wrong);
  }

  // ---- GP-06 Wh 問句 -------------------------------------------------
  function genGP06(rng) {
    var noun = pick(rng, NOUNS).sg;
    var noun2 = pick(rng, NOUNS.filter(function (n) { return n.sg !== noun; })).sg;
    var place = pick(rng, PLACES);
    var name = pick(rng, NAMES).name;
    var name1 = pick(rng, NAMES).name;
    var name2 = pick(rng, NAMES.filter(function (n) { return n.name !== name1; })).name;
    var faces = [
      { q: "___ is that? It's a " + noun + ".", answer: "What" },
      { q: "___ is she? She is " + name + ".", answer: "Who" },
      { q: "___ is my " + noun + "? It's in the " + place + ".", answer: "Where" },
      { q: "___ are they? They are my friends, " + name1 + " and " + name2 + ".", answer: "Who" },
      { q: "___ is your favorite toy? It's a " + noun2 + ".", answer: "What" },
      { q: "___ is the cat? It's under the " + place + ".", answer: "Where" },
    ];
    var f = pick(rng, faces);
    var wrong = ["What", "Who", "Where"].filter(function (w) { return w !== f.answer; });
    return buildItem("GP-06", f.q, f.answer, wrong);
  }

  // ---- GP-07 How 問句 -------------------------------------------------
  function genGP07(rng) {
    var name = pick(rng, NAMES).name;
    var plNoun = pick(rng, NOUNS).pl;
    var mass = pick(rng, MASS_NOUNS);
    var faces = [
      { q: "How ___ are you, " + name + "?", answer: "old" },
      { q: "How ___ is your dog?", answer: "old" },
      { q: "How ___ " + plNoun + " are there?", answer: "many" },
      { q: "How ___ students are in your class?", answer: "many" },
      { q: "How ___ " + mass + " is there?", answer: "much" },
      { q: "How ___ " + mass + " do you need?", answer: "much" },
    ];
    var f = pick(rng, faces);
    var wrong = ["old", "many", "much"].filter(function (w) { return w !== f.answer; });
    return buildItem("GP-07", f.q, f.answer, wrong);
  }

  // ---- GP-10 現在進行式 -------------------------------------------------
  function genGP10(rng) {
    var v = pick(rng, ACTION_VERBS);
    var mode = pickIndex(rng, 6);
    var subj, q, answer, wrong;
    if (mode < 3) {
      // 測試 be 動詞主詞一致
      if (mode === 0) subj = { text: "I", be: "am" };
      else if (mode === 1) subj = pick(rng, [{ text: "He", be: "is" }, { text: "She", be: "is" }, { text: pick(rng, NAMES).name, be: "is" }]);
      else subj = pick(rng, [{ text: "We", be: "are" }, { text: "They", be: "are" }, twoNameSubject(rng)]);
      q = subj.text + " ___ " + v.ing + " now.";
      answer = subj.be;
      wrong = ALL_BE_FORMS.filter(function (f) { return f !== answer; });
    } else {
      // 測試 -ing 拼法
      var subjTexts = ["I am", "He is", "They are"];
      var chosen = subjTexts[mode - 3];
      q = chosen + " ___ now.";
      answer = v.ing;
      wrong = [v.wrongIng, v.base];
    }
    return buildItem("GP-10", q, answer, wrong);
  }

  // ---- GP-11 There be -------------------------------------------------
  function genGP11(rng) {
    var sgNoun = pick(rng, NOUNS);
    var plNoun = pick(rng, NOUNS).pl;
    var place = pick(rng, PLACES);
    var numWord = CARDINAL[1 + pickIndex(rng, 8)];
    var faces = [
      { q: "There ___ a " + sgNoun.sg + " on the " + place + ".", answer: "is" },
      { q: "There ___ " + numWord + " " + plNoun + " in the " + place + ".", answer: "are" },
      { q: "There ___ many " + plNoun + " on the " + place + ".", answer: "are" },
      { q: "There ___ " + (sgNoun.vowel ? "an " : "a ") + sgNoun.sg + " in the bag.", answer: "is" },
      { q: "There ___ some " + plNoun + " near the " + place + ".", answer: "are" },
      { q: "There ___ one " + sgNoun.sg + " under the " + place + ".", answer: "is" },
    ];
    var f = pick(rng, faces);
    var wrong = ["is", "are", "am"].filter(function (w) { return w !== f.answer; });
    return buildItem("GP-11", f.q, f.answer, wrong);
  }

  // ---- GP-12 祈使句 -------------------------------------------------
  function genGP12(rng) {
    var v = pick(rng, ACTION_VERBS);
    var faces = [
      { q: "___ the door, please.", answer: v.base, wrong: [v.s, v.ing] },
      { q: "Please ___ your hands.", answer: v.base, wrong: [v.s, v.ing] },
      { q: "Don't ___ in the classroom.", answer: v.base, wrong: [v.s, v.ing] },
      { q: "___ quiet, please!", answer: "Be", wrong: ["Is", "Are"] },
      { q: "___ your book, everyone.", answer: v.base, wrong: [v.s, v.ing] },
      { q: "Let's ___ now.", answer: v.base, wrong: [v.s, v.ing] },
    ];
    var f = pick(rng, faces);
    return buildItem("GP-12", f.q, f.answer, f.wrong);
  }

  // ---- GP-14 can -------------------------------------------------
  function genGP14(rng) {
    var v = pick(rng, ACTION_VERBS);
    var name = pick(rng, NAMES).name;
    var faces = [
      "" + name + " can ___ well.",
      "I can ___ every day.",
      "They can ___ now.",
      "We can ___ here.",
      "Can " + name + " ___ today?",
      "You can ___ after school.",
    ];
    var q = pick(rng, faces);
    return buildItem("GP-14", q, v.base, [v.s, "to " + v.base]);
  }

  // ---- GP-21 基數序數 -------------------------------------------------
  function genGP21(rng) {
    var mode = pickIndex(rng, 6);
    if (mode < 3) {
      var n = 2 + pickIndex(rng, 8); // 2..9 (plural noun 需要 >=2)
      var pl = pick(rng, NOUNS).pl;

  // ---------------------------------------------------------------------
  // 3. 對外主函式
  // ---------------------------------------------------------------------
