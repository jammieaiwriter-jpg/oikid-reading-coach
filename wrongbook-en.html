<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>英文錯題本</title><style>

</style></head><body><div class="wrap"><div class="hero"><h1>📒 英文錯題本</h1><p>練習時答錯的文法點、聽力題型都記在這裡。「追攻」會出<strong>同觀念、不同面孔</strong>的新題——連對才會先進「已補待確認」，週末再驗一次全對才正式銷帳，證明是真的懂了，不是背答案或矇對。<span id="summary"></span></p></div><div class="sect weekend" id="weekend-confirm"><div class="head">🗓️ 本週錯題確認</div><div id="weekend-body"></div></div><div class="sect"><div class="head">⚔️ 文法待補</div><div id="gp-list"></div></div><div class="sect"><div class="head">🎧 聽力待補</div><div id="listen-list"></div></div><div class="sect"><div class="head">📖 閱讀題型命中率</div><div class="card" id="read-stats"></div></div><div class="note">閱讀弱的題型不重考舊文章——處方是回聽讀頁和課次頁多讀幾篇再作答。週末（週五起到週日）錯題本頂端會出現「本週錯題確認」，把平日追攻補起來的項目驗一次再銷帳。</div></div><script>/*
 * grammar-gen.js
 * 英文文法無限出題引擎 —— 零依賴、純 JS，可直接內嵌到瀏覽器頁面，也可在 Node 測試中 require()。
 *
 * 使用方式：
 *   瀏覽器: 以 script 標籤內嵌本檔 -> window.GrammarGen.make(["GP-01","GP-10"], 20, seed)
 *   Node:   const GrammarGen = require("./grammar-gen.js"); GrammarGen.make(["GP-01"], 50, 42)
 *
 * 輸出題目格式（與現有練習頁一致）：
 *   { kind:"fill", q, answer, options:[3個, 已隨機排序], say, gp:"GP-01" }
 *
 * 設計重點（硬規則）：
 *   - 每個模板的 3 個選項中，只有 1 個在該題的上下文下文法正確；另外 2 個一定錯，
 *     且錯誤原因是「詞池與句型骨架搭配後恆錯」，不是碰運氣才錯。
 *   - say 一律用 q.replace("___", answer) 生成，保證包含正確答案原字串。
 *   - 支援 seed（整數）→ 可重現；不給 seed 用 Math.random()。
 */
(function (root) {
  "use strict";

  // ---------------------------------------------------------------------
  // 0. 隨機數工具（可種子化）
  // ---------------------------------------------------------------------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeRng(seed) {
    if (seed === undefined || seed === null) {
      return Math.random;
    }
    return mulberry32(Number(seed) || 0);
  }

  function pick(rng, arr) {
    return arr[Math.floor(rng() * arr.length)];
  }

  function pickIndex(rng, n) {
    return Math.floor(rng() * n);
  }

  // 從陣列中隨機挑 count 個「排除 excludeSet 內容」的相異元素
  function pickDistinctExcluding(rng, arr, excludeArr, count) {
    var pool = arr.filter(function (x) {
      return excludeArr.indexOf(x) === -1;
    });
    var out = [];
    var used = {};
    var guard = 0;
    while (out.length < count && guard < 500) {
      guard++;
      var cand = pick(rng, pool);
      if (!used[cand]) {
        used[cand] = true;
        out.push(cand);
      }
    }
    return out;
  }

  function shuffle(rng, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function cap(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // 刻意產生「看起來像單字但拼錯」的干擾項：重複最後一個字母。
  // 保證不等於詞池中任何真實單字（我們的詞池沒有雙寫尾字母的巧合詞）。
  function mangle(word) {
    return word + word.slice(-1);
  }

  // ---------------------------------------------------------------------
  // 1. 詞池（GEPT 初級基礎字）
  // ---------------------------------------------------------------------
  var NAMES = [
    { name: "Tom", g: "m" },
    { name: "Jack", g: "m" },
    { name: "Sam", g: "m" },
    { name: "Ben", g: "m" },
    { name: "Leo", g: "m" },
    { name: "Zoe", g: "f" },
    { name: "Mary", g: "f" },
    { name: "Lily", g: "f" },
    { name: "Kate", g: "f" },
    { name: "Nina", g: "f" },
  ];

  // nouns: sg / pl / vowel(是否母音開頭，用於 a/an) / wrongPl(刻意錯誤複數)
  var NOUN_DEFS = [
    ["cat", "cats", false],
    ["dog", "dogs", false],
    ["book", "books", false],
    ["apple", "apples", true],
    ["ball", "balls", false],
    ["box", "boxes", false],
    ["pen", "pens", false],
    ["cup", "cups", false],
    ["bag", "bags", false],
    ["hat", "hats", false],
    ["car", "cars", false],
    ["bike", "bikes", false],
    ["egg", "eggs", true],
    ["banana", "bananas", false],
    ["chair", "chairs", false],
    ["orange", "oranges", true],
    ["umbrella", "umbrellas", true],
    ["watch", "watches", false],
    ["baby", "babies", false],
    ["kite", "kites", false],
  ];
  var NOUNS = NOUN_DEFS.map(function (d) {
    var sg = d[0],
      pl = d[1],
      vowel = d[2];
    // 規律變化 (sg+'s'===pl) 的錯誤複數用 sg+'es'；不規律變化(es/ies)的錯誤複數用 sg+'s'
    var wrongPl = pl === sg + "s" ? sg + "es" : sg + "s";
    return { sg: sg, pl: pl, vowel: vowel, wrongPl: wrongPl };
  });

  var ADJECTIVES = [
    "big", "small", "tall", "short", "happy", "sad", "hungry",
    "thirsty", "tired", "busy", "kind", "smart", "young", "nice",
  ];

  var PLACES = [
    "school", "park", "zoo", "library", "store", "classroom",
    "garden", "playground", "room", "home",
  ];

  // 動作動詞（用於現在進行式 & can & 祈使句）: base / s(第三人稱單數) / ing / wrongIng
  var ACTION_VERB_DEFS = [
    ["run", "runs", "running", "runing"],
    ["swim", "swims", "swimming", "swiming"],
    ["sit", "sits", "sitting", "siting"],
    ["write", "writes", "writing", "writeing"],
    ["make", "makes", "making", "makeing"],
    ["come", "comes", "coming", "comeing"],
    ["play", "plays", "playing", "playeing"],
    ["read", "reads", "reading", "readeing"],
    ["eat", "eats", "eating", "eateing"],
    ["jump", "jumps", "jumping", "jumpeing"],
    ["sing", "sings", "singing", "singeing"],
    ["dance", "dances", "dancing", "danceing"],
    ["ride", "rides", "riding", "rideing"],
    ["cook", "cooks", "cooking", "cookeing"],
    ["fly", "flies", "flying", "flyeing"],
    ["drive", "drives", "driving", "driveing"],
    ["open", "opens", "opening", "openning"],
    ["close", "closes", "closing", "closeing"],
    ["wash", "washes", "washing", "washeing"],
    ["clean", "cleans", "cleaning", "cleanning"],
    ["listen", "listens", "listening", "listenning"],
    ["look", "looks", "looking", "lookking"],
    ["stop", "stops", "stopping", "stoping"],
    ["wait", "waits", "waiting", "waitting"],
    ["stand", "stands", "standing", "standding"],
    ["help", "helps", "helping", "helpping"],
  ];
  var ACTION_VERBS = ACTION_VERB_DEFS.map(function (d) {
    return { base: d[0], s: d[1], ing: d[2], wrongIng: d[3] };
  });

  var MASS_NOUNS = [
    "water", "rice", "milk", "money", "juice", "bread", "cheese", "tea", "coffee", "soup",
  ];

  var WEEKDAYS = [
    "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday",
  ];
  var MONTHS = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December",
  ];

  var CARDINAL = [
    "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
    "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen",
    "eighteen", "nineteen", "twenty", "twenty-one", "twenty-two", "twenty-three",
    "twenty-four", "twenty-five", "twenty-six", "twenty-seven", "twenty-eight",
    "twenty-nine", "thirty", "thirty-one",
  ];
  var ORDINAL = [
    "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth",
    "ninth", "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth",
    "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth",
    "twenty-first", "twenty-second", "twenty-third", "twenty-fourth", "twenty-fifth",
    "twenty-sixth", "twenty-seventh", "twenty-eighth", "twenty-ninth", "thirtieth",
    "thirty-first",
  ];

  // 全部 be 動詞主詞（含姓名、人稱代名詞），每個都標好正確 be 型態
  function allBeSubjects() {
    var list = NAMES.map(function (n) {
      return { text: n.name, be: "is" };
    });
    list.push({ text: "He", be: "is" });
    list.push({ text: "She", be: "is" });
    list.push({ text: "It", be: "is" });
    list.push({ text: "I", be: "am" });
    list.push({ text: "You", be: "are" });
    list.push({ text: "We", be: "are" });
    list.push({ text: "They", be: "are" });
    return list;
  }
  var BE_SUBJECTS = allBeSubjects();
  var ALL_BE_FORMS = ["am", "is", "are"];

  function twoNameSubject(rng) {
    var n1 = pick(rng, NAMES);
    var n2 = pick(rng, NAMES.filter(function (n) { return n.name !== n1.name; }));
    return { text: n1.name + " and " + n2.name, be: "are" };
  }

  // ---------------------------------------------------------------------
  // 2. 每個 GP 的骨架 + 生成邏輯
  // ---------------------------------------------------------------------
  function buildItem(gp, q, answer, distractors, extra) {
    var options3 = [answer].concat(distractors);
    var say = q.replace("___", answer);
    // 若空格在句首，插入的答案要大寫成句首字母（例如 "open" -> "Open"）
    if (q.indexOf("___") === 0 && say.length > 0) {
      say = say.charAt(0).toUpperCase() + say.slice(1);
    }
    return {
      kind: "fill",
      q: q,
      answer: answer,
      options: options3,
      say: say,
      gp: gp,
    };
  }

  function finalizeOptions(rng, item) {
    item.options = shuffle(rng, item.options);
    return item;
  }

  // ---- GP-01 be動詞 -------------------------------------------------
  function genGP01(rng) {
    var subj = rng() < 0.15 ? twoNameSubject(rng) : pick(rng, BE_SUBJECTS);
    var wrongForms = ALL_BE_FORMS.filter(function (f) { return f !== subj.be; });
    var faces = [
      function () { return subj.text + " ___ " + pick(rng, ADJECTIVES) + "."; },
      function () { return subj.text + " ___ very " + pick(rng, ADJECTIVES) + "."; },
      function () { return subj.text + " ___ " + pick(rng, ADJECTIVES) + " today."; },
      function () { return subj.text + " ___ so " + pick(rng, ADJECTIVES) + "."; },
      function () { return subj.text + " ___ at the " + pick(rng, PLACES) + "."; },
      function () { return subj.text + " ___ in the " + pick(rng, PLACES) + "."; },
    ];
    var q = pick(rng, faces)();
    return buildItem("GP-01", q, subj.be, wrongForms);
  }

  // ---- GP-02 名詞複數 -------------------------------------------------
  function genGP02(rng) {
    var noun = pick(rng, NOUNS);
    var numWord = CARDINAL[1 + pickIndex(rng, 8)]; // two..nine
    var isPlural = rng() < 0.5;
    var faces;
    if (isPlural) {
      faces = [
        function () { return "I have " + numWord + " ___."; },
        function () { return "There are " + numWord + " ___ on the desk."; },
        function () { return "I see " + numWord + " ___ in the sky."; },
      ];
      var q = pick(rng, faces)();
      return buildItem("GP-02", q, noun.pl, [noun.sg, noun.wrongPl]);
    } else {
      faces = [
        function () { return "She has one ___."; },
        function () { return "He has one ___ in his bag."; },
        function () { return "We need one ___ for the party."; },
      ];
      var q2 = pick(rng, faces)();
      return buildItem("GP-02", q2, noun.sg, [noun.pl, noun.wrongPl]);
    }
  }

  // ---- GP-03 冠詞 a/an -------------------------------------------------
  function genGP03(rng) {
    var noun = pick(rng, NOUNS);
    var correct = noun.vowel ? "an" : "a";
    var wrongArticle = noun.vowel ? "a" : "an";
    var faces = [
      function () { return "I have ___ " + noun.sg + "."; },
      function () { return "She wants ___ " + noun.sg + "."; },
      function () { return "There is ___ " + noun.sg + " on the table."; },
      function () { return "Look! It's ___ " + noun.sg + "."; },
      function () { return "He needs ___ " + noun.sg + " today."; },
      function () { return "Can I have ___ " + noun.sg + "?"; },
    ];
    var q = pick(rng, faces)();
    return buildItem("GP-03", q, correct, [wrongArticle, "some"]);
  }

  // ---- GP-04 指示代名詞 -------------------------------------------------
  function genGP04(rng) {
    var sgNoun = pick(rng, NOUNS).sg;
    var plNoun = pick(rng, NOUNS).pl;
    var faces = [
      { ctx: "It's right here.", blankQ: "___ is my " + sgNoun + ".", answer: "This", wrong: ["That", "These"] },
      { ctx: "It's over there.", blankQ: "___ is my " + sgNoun + ".", answer: "That", wrong: ["This", "Those"] },
      { ctx: "They're right here.", blankQ: "___ are my " + plNoun + ".", answer: "These", wrong: ["Those", "This"] },
      { ctx: "They're over there.", blankQ: "___ are my " + plNoun + ".", answer: "Those", wrong: ["These", "That"] },
      { ctx: "Look, it's close to me.", blankQ: "___ is a nice " + sgNoun + ".", answer: "This", wrong: ["That", "These"] },
      { ctx: "Look, they're far away.", blankQ: "___ are cute " + plNoun + ".", answer: "Those", wrong: ["These", "That"] },
    ];
    var f = pick(rng, faces);
    var q = f.ctx + " " + f.blankQ;
    return buildItem("GP-04", q, f.answer, f.wrong);
  }

  // ---- GP-06 Wh 問句 -------------------------------------------------
  function genGP06(rng) {
    var noun = pick(rng, NOUNS).sg;
    var noun2 = pick(rng, NOUNS.filter(function (n) { return n.sg !== noun; })).sg;
    var place = pick(rng, PLACES);
    var name = pick(rng, NAMES).name;
    var name1 = pick(rng, NAMES).name;
    var name2 = pick(rng, NAMES.filter(function (n) { return n.name !== name1; })).name;
    var faces = [
      { q: "___ is that? It's a " + noun + ".", answer: "What" },
      { q: "___ is she? She is " + name + ".", answer: "Who" },
      { q: "___ is my " + noun + "? It's in the " + place + ".", answer: "Where" },
      { q: "___ are they? They are my friends, " + name1 + " and " + name2 + ".", answer: "Who" },
      { q: "___ is your favorite toy? It's a " + noun2 + ".", answer: "What" },
      { q: "___ is the cat? It's under the " + place + ".", answer: "Where" },
    ];
    var f = pick(rng, faces);
    var wrong = ["What", "Who", "Where"].filter(function (w) { return w !== f.answer; });
    return buildItem("GP-06", f.q, f.answer, wrong);
  }

  // ---- GP-07 How 問句 -------------------------------------------------
  function genGP07(rng) {
    var name = pick(rng, NAMES).name;
    var plNoun = pick(rng, NOUNS).pl;
    var mass = pick(rng, MASS_NOUNS);
    var faces = [
      { q: "How ___ are you, " + name + "?", answer: "old" },
      { q: "How ___ is your dog?", answer: "old" },
      { q: "How ___ " + plNoun + " are there?", answer: "many" },
      { q: "How ___ students are in your class?", answer: "many" },
      { q: "How ___ " + mass + " is there?", answer: "much" },
      { q: "How ___ " + mass + " do you need?", answer: "much" },
    ];
    var f = pick(rng, faces);
    var wrong = ["old", "many", "much"].filter(function (w) { return w !== f.answer; });
    return buildItem("GP-07", f.q, f.answer, wrong);
  }

  // ---- GP-10 現在進行式 -------------------------------------------------
  function genGP10(rng) {
    var v = pick(rng, ACTION_VERBS);
    var mode = pickIndex(rng, 6);
    var subj, q, answer, wrong;
    if (mode < 3) {
      // 測試 be 動詞主詞一致
      if (mode === 0) subj = { text: "I", be: "am" };
      else if (mode === 1) subj = pick(rng, [{ text: "He", be: "is" }, { text: "She", be: "is" }, { text: pick(rng, NAMES).name, be: "is" }]);
      else subj = pick(rng, [{ text: "We", be: "are" }, { text: "They", be: "are" }, twoNameSubject(rng)]);
      q = subj.text + " ___ " + v.ing + " now.";
      answer = subj.be;
      wrong = ALL_BE_FORMS.filter(function (f) { return f !== answer; });
    } else {
      // 測試 -ing 拼法
      var subjTexts = ["I am", "He is", "They are"];
      var chosen = subjTexts[mode - 3];
      q = chosen + " ___ now.";
      answer = v.ing;
      wrong = [v.wrongIng, v.base];
    }
    return buildItem("GP-10", q, answer, wrong);
  }

  // ---- GP-11 There be -------------------------------------------------
  function genGP11(rng) {
    var sgNoun = pick(rng, NOUNS);
    var plNoun = pick(rng, NOUNS).pl;
    var place = pick(rng, PLACES);
    var numWord = CARDINAL[1 + pickIndex(rng, 8)];
    var faces = [
      { q: "There ___ a " + sgNoun.sg + " on the " + place + ".", answer: "is" },
      { q: "There ___ " + numWord + " " + plNoun + " in the " + place + ".", answer: "are" },
      { q: "There ___ many " + plNoun + " on the " + place + ".", answer: "are" },
      { q: "There ___ " + (sgNoun.vowel ? "an " : "a ") + sgNoun.sg + " in the bag.", answer: "is" },
      { q: "There ___ some " + plNoun + " near the " + place + ".", answer: "are" },
      { q: "There ___ one " + sgNoun.sg + " under the " + place + ".", answer: "is" },
    ];
    var f = pick(rng, faces);
    var wrong = ["is", "are", "am"].filter(function (w) { return w !== f.answer; });
    return buildItem("GP-11", f.q, f.answer, wrong);
  }

  // ---- GP-12 祈使句 -------------------------------------------------
  function genGP12(rng) {
    var v = pick(rng, ACTION_VERBS);
    var faces = [
      { q: "___ the door, please.", answer: v.base, wrong: [v.s, v.ing] },
      { q: "Please ___ your hands.", answer: v.base, wrong: [v.s, v.ing] },
      { q: "Don't ___ in the classroom.", answer: v.base, wrong: [v.s, v.ing] },
      { q: "___ quiet, please!", answer: "Be", wrong: ["Is", "Are"] },
      { q: "___ your book, everyone.", answer: v.base, wrong: [v.s, v.ing] },

feel about camping tonight?", "audioSrc": "audio/cap/cap-talk-015.mp3"}, {"id": "cap-talk-016", "kind": "talk", "subkind": "monologue", "function": "請求", "options": ["Seven dollars.", "Ten dollars.", "At three o'clock."], "answer": 0, "say": "Welcome to our theater. Tickets are ten dollars for adults and seven dollars for students.　Please show your student card when you buy a student ticket.　The next movie starts at three o'clock.　❓How much is a student ticket?", "audioSrc": "audio/cap/cap-talk-016.mp3"}, {"id": "cap-talk-017", "kind": "talk", "subkind": "monologue", "function": "拒絕", "options": ["Because of the heavy rain.", "Because she does not like the songs.", "Because the games started late."], "answer": 0, "say": "Thank you all for tonight. We are sorry, but the last singer can't come because of the heavy rain.　We will play more music and games for everyone.　Please stay and enjoy the show.　❓Why can't the last singer come?", "audioSrc": "audio/cap/cap-talk-017.mp3"}, {"id": "cap-talk-018", "kind": "talk", "subkind": "monologue", "function": "抱怨", "options": ["Next to the front gate.", "At this counter.", "Near the fish tanks."], "answer": 0, "say": "Attention, please. We are sorry for the long line today.　If you want to buy tickets, the ticket counter is next to the front gate, not at this counter.　This counter is for gift shop items only.　❓Where is the ticket counter?", "audioSrc": "audio/cap/cap-talk-018.mp3"}, {"id": "cap-talk-019", "kind": "talk", "subkind": "monologue", "function": "詢問經驗", "options": ["He was proud.", "He was nervous.", "He was angry."], "answer": 0, "say": "Last year, I helped at the fair for the first time.　I was very nervous at first, but everyone was kind to me.　By the end of the day, I was proud of our class table.　I want to help again this year.　❓How did Hank feel by the end of the day?", "audioSrc": "audio/cap/cap-talk-019.mp3"}, {"id": "cap-talk-020", "kind": "talk", "subkind": "monologue", "function": "建議", "options": ["Their bag, lunch box, and umbrella.", "Their bag, lunch box, and books.", "Get off at the next stop."], "answer": 0, "say": "Good morning, everyone. Before we get off the bus, please take your bag, your lunch box, and your umbrella.　Do not leave anything under the seat.　Have a nice day at school.　❓What should students take with them?", "audioSrc": "audio/cap/cap-talk-020.mp3"}];
var K='nanyi-eng-ledger-v1';
var KIND_LABEL={qa:'單題問答',talk:'短文'};
function kindLabel(k){return KIND_LABEL[k]||k}
function ledger(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}}
function save(d){try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
function tg(msg){fetch('https://bobo-math-notify.bobo-math-grader.workers.dev',{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({text:msg,to:'bobo'})}).catch(function(){})}
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function isWeekend(){var d=new Date().getDay();return d===5||d===6||d===0}

// ---------- 文法：待補／已補待確認／已銷帳 ----------
// status 未定義時退回舊語意：wrong>cleared＝待補、wrong<=cleared＝已銷帳。
// status="recovered"＝已補待確認（cleared 尚未追上 wrong，週末驗過才會追上）。
function grammarPending(){
  var d=ledger(),out=[];
  Object.keys(d.gp||{}).forEach(function(gp){
    var g=d.gp[gp];if(!g||typeof g!=='object')return;
    var cleared=g.cleared||0,wrong=g.wrong||0;
    if(g.status!=='recovered'&&wrong>cleared)out.push({gp:gp,n:wrong-cleared})});
  out.sort(function(a,b){return b.n-a.n});return out}
function grammarConfirming(){
  var d=ledger(),out=[];
  Object.keys(d.gp||{}).forEach(function(gp){
    var g=d.gp[gp];if(g&&typeof g==='object'&&g.status==='recovered')out.push({gp:gp})});
  return out}

function pickGrammarConfirmItems(gp,n,seen){
  seen=seen||[];
  var used={};seen.forEach(function(s){used[s]=true});
  var out=[];
  var pool=(POOL[gp]||[]).filter(function(it){return !used[it.id]});
  shuffleArr(pool);
  pool.slice(0,n).forEach(function(it){used[it.id]=true;
    out.push({stem:it.q,options:it.options.slice(),correctText:it.answer,say:it.say,key:it.id})});
  if(out.length<n&&typeof GrammarGen!=='undefined'&&GrammarGen.supportedGPs.indexOf(gp)!==-1){
    var need=n-out.length,tries=0,raw=[];
    while(raw.length<need*6&&tries<20){tries++;raw=raw.concat(GrammarGen.make([gp],need*6))}
    for(var i=0;i<raw.length&&out.length<n;i++){
      var it=raw[i],key='gg:'+it.q;if(used[key])continue;used[key]=true;
      out.push({stem:it.q,options:it.options,correctText:it.answer,say:it.say,key:key})}}
  if(out.length<n){ // 最後防線：題庫太小，寧可重複也不要開天窗
    var all=(POOL[gp]||[]).slice();shuffleArr(all);
    for(var j=0;j<all.length&&out.length<n;j++){
      if(!out.some(function(o){return o.key===all[j].id}))
        out.push({stem:all[j].q,options:all[j].options.slice(),correctText:all[j].answer,say:all[j].say,key:all[j].id})}}
  return out}

function attackGrammar(gp,host,btn){
  btn.disabled=true;
  var raw=(typeof GrammarGen!=='undefined')?GrammarGen.make([gp],3):[];
  var items=raw.map(function(it){return{stem:it.q,options:it.options,correctText:it.answer,say:it.say,key:'gg:'+it.q}});
  runQuiz(items,host,function(allOk){
    var d=ledger();d.gp=d.gp||{};var g=d.gp[gp]||{wrong:0,cleared:0};
    if(allOk){
      g.status='recovered';
      g.seen=(g.seen||[]).concat(items.map(function(it){return it.key}));
      d.gp[gp]=g;save(d);
      host.innerHTML='<div class="result ok">✓ 連對 3 題——先進「已補待確認」，週末再驗一次就正式銷帳！</div>';
    }else{
      g.wrong=(g.wrong||0)+1;d.gp[gp]=g;save(d);
      host.innerHTML='<div class="result no">還沒乾淨——這個點留在錯題本，晚點再追一次。</div>'}
    setTimeout(render,1600)})}

function confirmGrammar(gp,host){
  var d=ledger();var g=(d.gp||{})[gp]||{};
  var items=pickGrammarConfirmItems(gp,2,g.seen||[]);
  runQuiz(items,host,function(allOk){
    var d2=ledger();d2.gp=d2.gp||{};var g2=d2.gp[gp]||{wrong:0,cleared:0};
    if(allOk){
      g2.cleared=g2.wrong;g2.status='confirmed';g2.confirmedAt=Date.now();g2.lastConfirmSource='confirm_weekend';
      g2.seen=(g2.seen||[]).concat(items.map(function(it){return it.key}));
      d2.gp[gp]=g2;save(d2);
      host.innerHTML='<div class="result ok">✓ 2 題全對——這個文法點正式銷帳！</div>';
      tg('Bobo 英文錯題本銷帳（週末確認）：'+gp+' '+(GPN[gp]||''));
    }else{
      delete g2.status;d2.gp[gp]=g2;save(d2);
      host.innerHTML='<div class="result no">還沒穩——退回待補，之後再追攻一次。</div>'}
    setTimeout(render,1600)})}

// ---------- 聽力：待補／已補待確認／已銷帳 ----------
// capListening 是既有的「答錯事件」陣列（listen-cap 頁寫入，本頁只讀），
// 依 kind+function 分組。capState 是本頁新增的頂層鍵，記每組的關卡狀態：
// status="recovered"＝待確認；clearedThroughTs＝上次銷帳時間，之後才發生的
// 錯誤事件才算「新鮮」（待補），銷帳前的舊事件不會讓已銷帳的題型復活。
function listeningGroups(){
  var d=ledger();
  var events=Array.isArray(d.capListening)?d.capListening:[];
  var st=(d.capState&&typeof d.capState==='object')?d.capState:{};
  var byKey={};
  events.forEach(function(e){
    if(!e||typeof e!=='object'||!e.kind||!e.function)return;
    var key=e.kind+'|'+e.function;(byKey[key]=byKey[key]||[]).push(e)});
  var pending=[],confirming=[];
  Object.keys(byKey).forEach(function(key){
    var s=st[key]||{};
    if(s.status==='recovered'){confirming.push({key:key});return}
    var since=s.clearedThroughTs||0;
    var fresh=byKey[key].filter(function(e){return(e.ts||0)>since});
    if(fresh.length)pending.push({key:key,n:fresh.length})});
  pending.sort(function(a,b){return b.n-a.n});
  return{pending:pending,confirming:confirming}}

function splitKey(key){var i=key.indexOf('|');return{kind:key.slice(0,i),fn:key.slice(i+1)}}

function pickListeningItems(kind,fn,n,seen){
  seen=seen||[];var used={};seen.forEach(function(s){used[s]=true});
  var pool=CAPITEMS.filter(function(it){return it.kind===kind&&it.function===fn&&!used[it.id]});
  shuffleArr(pool);
  var chosen=pool.slice(0,n);
  if(chosen.length<n){ // 題庫太小才會走到這裡：寧可重複也不要開天窗
    var chosenIds={};chosen.forEach(function(it){chosenIds[it.id]=true});
    var rest=CAPITEMS.filter(function(it){return it.kind===kind&&it.function===fn&&!chosenIds[it.id]});
    shuffleArr(rest);chosen=chosen.concat(rest.slice(0,n-chosen.length))}
  return chosen.map(function(it){return{stem:'🎧 '+kindLabel(it.kind)+'／'+it.function+'（聽音檔作答）',
    options:it.options.slice(),correctText:it.options[it.answer],say:it.say,key:it.id,audioSrc:it.audioSrc}})}

function attackListening(key,host,btn){
  btn.disabled=true;var p=splitKey(key);
  var d=ledger();var st=(d.capState||{})[key]||{};
  var items=pickListeningItems(p.kind,p.fn,2,st.seen||[]);
  runQuiz(items,host,function(allOk){
    var d2=ledger();d2.capState=d2.capState||{};var s=d2.capState[key]||{};
    if(allOk){
      s.status='recovered';s.seen=(s.seen||[]).concat(items.map(function(it){return it.key}));
      d2.capState[key]=s;save(d2);
      host.innerHTML='<div class="result ok">✓ 連對 2 題——先進「已補待確認」，週末再驗一次就正式銷帳！</div>';
    }else{
      d2.capState[key]=s;save(d2);
      host.innerHTML='<div class="result no">還沒乾淨——這個題型留在錯題本，晚點再追一次。</div>'}
    setTimeout(render,1600)})}

function confirmListening(key,host){
  var p=splitKey(key);var d=ledger();var s=(d.capState||{})[key]||{};
  var items=pickListeningItems(p.kind,p.fn,2,s.seen||[]);
  runQuiz(items,host,function(allOk){
    var d2=ledger();d2.capState=d2.capState||{};var s2=d2.capState[key]||{};
    if(allOk){
      s2.status='confirmed';s2.clearedThroughTs=Date.now();
      s2.seen=(s2.seen||[]).concat(items.map(function(it){return it.key}));
      d2.capState[key]=s2;save(d2);
      host.innerHTML='<div class="result ok">✓ 2 題全對——這個題型正式銷帳！</div>';
      tg('Bobo 英文錯題本銷帳（週末確認）：聽力 '+kindLabel(p.kind)+'／'+p.fn);
    }else{
      delete s2.status;d2.capState[key]=s2;save(d2);
      host.innerHTML='<div class="result no">還沒穩——退回待補，之後再追攻一次。</div>'}
    setTimeout(render,1600)})}

// ---------- 共用出題引擎（文法／聽力、追攻／確認都走這一份） ----------
// item: {stem, options[], correctText, say, key, audioSrc?}
function runQuiz(items,host,cb){
  var i=0,allOk=true;
  function next(){
    if(i>=items.length){cb(allOk);return}
    var it=items[i],q=document.createElement('div');q.className='q';
    var stemHtml=(i+1)+' / '+items.length+'　'+it.stem;
    q.innerHTML='<div class="stem">'+stemHtml+'</div>';
    if(it.audioSrc){
      var qa=document.createElement('audio');
      qa.controls=true;qa.preload='none';qa.src=it.audioSrc;
      qa.style.width='100%';qa.style.marginBottom='8px';
      q.appendChild(qa);
    }
    it.options.slice().sort(function(){return Math.random()-.5}).forEach(function(o){
      var b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=function(){q.querySelectorAll('.opt').forEach(function(x){x.disabled=true});
        var right=o===it.correctText;if(!right)allOk=false;
        b.classList.add(right?'correct':'wrong');
        var r=document.createElement('div');r.className='result '+(right?'ok':'no');
        r.textContent=(right?'✓　':'✗ 正解：'+it.correctText+'　')+(it.say||'');
        q.appendChild(r);
        i++;setTimeout(next,right?700:1800)};
      q.appendChild(b)});
    host.innerHTML='';host.appendChild(q)}
  next()}

// ---------- 主渲染 ----------
function render(){
  var gpPend=grammarPending(),gpConf=grammarConfirming();
  var lg=listeningGroups();

  var host=document.getElementById('gp-list');host.innerHTML='';
  var totalPending=gpPend.length+lg.pending.length;
  document.getElementById('summary').textContent=totalPending?('待補 '+totalPending+' 項'):'';
  if(!gpPend.length){host.innerHTML='<div class="empty">🎉 沒有待補的文法點。</div>'}
  gpPend.forEach(function(item){
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<h3>'+item.gp+'　'+(GPN[item.gp]||'')+'</h3>'
      +'<div class="meta">累積答錯 '+item.n+' 次（未銷帳）</div>'
      +'<button class="btn">⚔️ 追攻 3 題（同觀念、不同題）</button><div class="qhost"></div>';
    d.querySelector('.btn').onclick=function(){attackGrammar(item.gp,d.querySelector('.qhost'),this)};
    host.appendChild(d)});

  var lhost=document.getElementById('listen-list');lhost.innerHTML='';
  if(!lg.pending.length){lhost.innerHTML='<div class="empty">🎉 沒有待補的聽力題型。</div>'}
  lg.pending.forEach(function(item){
    var p=splitKey(item.key);
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<h3>'+kindLabel(p.kind)+'／'+p.fn+'</h3>'
      +'<div class="meta">累積答錯 '+item.n+' 次（未銷帳）</div>'
      +'<button class="btn">⚔️ 追攻 2 題（同題型、不同題）</button><div class="qhost"></div>';
    d.querySelector('.btn').onclick=function(){attackListening(item.key,d.querySelector('.qhost'),this)};
    lhost.appendChild(d)});

  var wc=document.getElementById('weekend-confirm');
  var body=document.getElementById('weekend-body');
  if(isWeekend()&&(gpConf.length||lg.confirming.length)){
    wc.style.display='';body.innerHTML='';
    gpConf.forEach(function(item){
      var d=document.createElement('div');d.className='card';
      d.innerHTML='<h3>'+item.gp+'　'+(GPN[item.gp]||'')+'<span class="tag wait">已補待確認</span></h3>'
        +'<button class="btn weekend">開始確認（2 題）</button><div class="qhost"></div>';
      d.querySelector('.btn').onclick=function(){this.disabled=true;confirmGrammar(item.gp,d.querySelector('.qhost'))};
      body.appendChild(d)});
    lg.confirming.forEach(function(item){
      var p=splitKey(item.key);
      var d=document.createElement('div');d.className='card';
      d.innerHTML='<h3>'+kindLabel(p.kind)+'／'+p.fn+'<span class="tag wait">已補待確認</span></h3>'
        +'<button class="btn weekend">開始確認（2 題）</button><div class="qhost"></div>';
      d.querySelector('.btn').onclick=function(){this.disabled=true;confirmListening(item.key,d.querySelector('.qhost'))};
      body.appendChild(d)});
  }else{
    wc.style.display='none';body.innerHTML=''}

  var rd=ledger().read||{},rh=document.getElementById('read-stats');rh.innerHTML='';
  var types=['主旨','細節','推論','字義猜測'];var any=false;
  types.forEach(function(t){var r=rd[t];if(!r||!r.n)return;any=true;
    var rate=Math.round((1-r.wrong/r.n)*100);
    rh.innerHTML+='<div><b>'+t+'</b>　'+rate+'%（'+(r.n-r.wrong)+'/'+r.n+'）'
      +(rate<70?'　<span style="color:#c92a2a;font-weight:850">偏弱→多讀幾篇文章再答題</span>':'')
      +'</div><div class="bar"><span style="width:'+rate+'%"></span></div>'});
  if(!any)rh.innerHTML='<div class="empty">還沒有閱讀作答紀錄。</div>';
}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>
