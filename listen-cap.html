"subkind": "monologue", "fn": "詢問經驗", "options": ["He was proud.", "He was nervous.", "He was angry."], "answer": 0, "distractorTags": [null, "因果-時間點錯置", "語氣誤判-憑空情緒"], "material": ["Last year, I helped at the fair for the first time.", "I was very nervous at first, but everyone was kind to me.", "By the end of the day, I was proud of our class table.", "I want to help again this year."], "question": "How did Hank feel by the end of the day?", "audioSrc": "audio/cap/cap-talk-019.mp3", "seg": {"material1": 0.0, "question": 29.628}}, "cap-talk-020": {"id": "cap-talk-020", "kind": "talk", "subkind": "monologue", "fn": "建議", "options": ["Their bag, lunch box, and umbrella.", "Their bag, lunch box, and books.", "Get off at the next stop."], "answer": 0, "distractorTags": [null, "列表增減陷阱-項目替換", "答非所問-類別錯位"], "material": ["Good morning, everyone. Before we get off the bus, please take your bag, your lunch box, and your umbrella.", "Do not leave anything under the seat.", "Have a nice day at school."], "question": "What should students take with them?", "audioSrc": "audio/cap/cap-talk-020.mp3", "seg": {"material1": 0.0, "question": 27.9}}};var GROUPS=[["cap-qa-001", "cap-qa-002", "cap-qa-003", "cap-qa-004", "cap-qa-005", "cap-qa-006", "cap-qa-007", "cap-qa-008", "cap-qa-009", "cap-qa-010", "cap-qa-011", "cap-qa-012", "cap-qa-013", "cap-qa-014", "cap-qa-015", "cap-qa-016", "cap-talk-001", "cap-talk-002"], ["cap-talk-003", "cap-talk-004", "cap-talk-005", "cap-talk-006", "cap-talk-007", "cap-talk-008", "cap-talk-009", "cap-talk-010", "cap-talk-011", "cap-talk-012", "cap-talk-013", "cap-talk-014", "cap-talk-015", "cap-talk-016", "cap-talk-017", "cap-talk-018", "cap-talk-019", "cap-talk-020"]];var GROUP_SIZE=18;

var LK='nanyi-eng-ledger-v1';
var PK='cap-listen-progress-v1';

function ledger(){try{return JSON.parse(localStorage.getItem(LK)||'{}')}catch(e){return{}}}
function saveLedger(d){try{localStorage.setItem(LK,JSON.stringify(d))}catch(e){}}
function recordWrong(item, distractorTag){
  var d=ledger();
  d.capListening=d.capListening||[];
  d.capListening.push({type:'cap-listening', id:item.id, kind:item.kind, subkind:item.subkind,
    function:item.fn, distractorTag:distractorTag||null, ts:Date.now()});
  saveLedger(d);
}

function loadProgress(){
  try{
    var p=JSON.parse(localStorage.getItem(PK)||'null');
    if(p && typeof p.groupIdx==='number' && typeof p.qIdx==='number' && Array.isArray(p.answers)) return p;
  }catch(e){}
  return {groupIdx:0, qIdx:0, answers:[]};
}
function saveProgress(p){try{localStorage.setItem(PK,JSON.stringify(p))}catch(e){}}

var STATE=loadProgress();

function currentGroup(){return GROUPS[STATE.groupIdx]||[]}

function fmtTranscript(item){
  var html='';
  item.material.forEach(function(line){html+='<div class="line">'+line+'</div>'});
  if(item.question) html+='<div class="q">❓ '+item.question+'</div>';
  return html;
}

function renderQuestion(){
  var host=document.getElementById('stage');
  var group=currentGroup();
  if(STATE.qIdx>=group.length){renderReport();return}
  var id=group[STATE.qIdx];
  var item=DATA[id];
  var globalNo=STATE.groupIdx*GROUP_SIZE+STATE.qIdx+1;
  var html='<div class="card"><div class="qhead"><span class="num">第 '+globalNo+' 題</span>'
    +'<span class="prog">第 '+(STATE.groupIdx+1)+' 組　'+(STATE.qIdx+1)+' / '+group.length+'</span></div>';
  html+='<div class="playbar"><button class="btn" id="startBtn">▶ 開始作答</button>'
    +'<audio id="qaudio" preload="none" src="'+item.audioSrc+'"></audio></div>';
  html+='<div id="opts"></div><div id="afterQ"></div></div>';
  host.innerHTML=html;

  var opts=document.getElementById('opts');
  var order=item.options.map(function(text,idx){return {text:text, idx:idx}});
  order.forEach(function(o){
    var b=document.createElement('button');
    b.className='opt dim'; b.textContent=o.text; b.disabled=true;
    b.setAttribute('data-idx', o.idx);
    b.onclick=function(){answer(item, o.idx, b, opts)};
    opts.appendChild(b);
  });

  document.getElementById('startBtn').onclick=function(){
    var a=document.getElementById('qaudio');
    opts.querySelectorAll('.opt').forEach(function(b){b.disabled=false;b.classList.remove('dim')});
    var p=a.play(); if(p&&p.catch)p.catch(function(){});
    this.disabled=true;
  };
}

function distractorTagFor(item, chosenIdx){
  // item.distractorTags 已在建置時對齊 options 索引（answer 位置為 null），直接查表即可
  if(chosenIdx===item.answer) return null;
  return (item.distractorTags && item.distractorTags[chosenIdx]) || null;
}

function answer(item, chosenIdx, btn, opts){
  opts.querySelectorAll('.opt').forEach(function(b){b.disabled=true});
  var right=chosenIdx===item.answer;
  opts.querySelectorAll('.opt').forEach(function(b){
    var i=parseInt(b.getAttribute('data-idx'),10);
    if(i===item.answer) b.classList.add('correct');
    else if(i===chosenIdx) b.classList.add('wrong');
  });
  var tag=null;
  if(!right){ tag=distractorTagFor(item, chosenIdx); recordWrong(item, tag) }

  STATE.answers.push({id:item.id, correct:right, distractorTag:tag});
  saveProgress(STATE);

  var after=document.getElementById('afterQ');
  var html='<div class="result '+(right?'ok':'no')+'">'+(right?'✓ 答對了':'✗ 答錯了')+'</div>';
  html+='<div class="answer-line">正解：'+item.options[item.answer]+'</div>';
  html+='<div class="transcript" id="transcriptBox" style="display:none">'+fmtTranscript(item)+'</div>';
  html+='<button class="btn ghost" id="relistenBtn">🔁 重聽</button>';
  html+='<div class="segrow" id="segRow" style="display:none"></div>';
  html+='<button class="btn" id="nextBtn">下一題 →</button>';
  after.innerHTML=html;

  document.getElementById('relistenBtn').onclick=function(){
    var box=document.getElementById('transcriptBox'); box.style.display='block';
    var row=document.getElementById('segRow'); row.style.display='flex'; row.innerHTML='';
    var a=document.getElementById('qaudio');
    if(item.seg && item.seg.material1!=null){
      var b1=document.createElement('button'); b1.className='segbtn'; b1.textContent='🔁 素材';
      b1.onclick=function(){ a.currentTime=item.seg.material1; var p=a.play(); if(p&&p.catch)p.catch(function(){}) };
      row.appendChild(b1);
    }
    if(item.seg && item.seg.question!=null){
      var b2=document.createElement('button'); b2.className='segbtn'; b2.textContent='🔁 問題';
      b2.onclick=function(){ a.currentTime=item.seg.question; var p=a.play(); if(p&&p.catch)p.catch(function(){}) };
      row.appendChild(b2);
    }
    var b3=document.createElement('button'); b3.className='segbtn'; b3.textContent='▶ 從頭播';
    b3.onclick=function(){ a.currentTime=0; var p=a.play(); if(p&&p.catch)p.catch(function(){}) };
    row.appendChild(b3);
  };
  document.getElementById('nextBtn').onclick=function(){
    STATE.qIdx++; saveProgress(STATE); renderQuestion();
  };
}

function renderReport(){
  var group=currentGroup();
  var answers=STATE.answers.slice(-group.length);
  var total=answers.length, okN=answers.filter(function(a){return a.correct}).length;
  var byKind={}, byFn={};
  answers.forEach(function(a){
    var item=DATA[a.id];
    var kk=item.kind+'/'+item.subkind;
    byKind[kk]=byKind[kk]||{ok:0,n:0}; byKind[kk].n++; if(a.correct)byKind[kk].ok++;
    byFn[item.fn]=byFn[item.fn]||{ok:0,n:0,wrong:0}; byFn[item.fn].n++;
    if(a.correct)byFn[item.fn].ok++; else byFn[item.fn].wrong++;
  });
  var html='<div class="card report"><h2>📋 第 '+(STATE.groupIdx+1)+' 組成績單</h2>';
  html+='<div class="stat"><span>總分</span><b>'+okN+' / '+total+'</b></div>';
  Object.keys(byKind).sort().forEach(function(k){
    var s=byKind[k];
    html+='<div class="stat"><span>'+k+'</span><b>'+s.ok+' / '+s.n+'</b></div>';
  });
  var weak=Object.keys(byFn).filter(function(f){return byFn[f].wrong>0})
    .sort(function(a,b){return byFn[b].wrong-byFn[a].wrong});
  if(weak.length){
    html+='<div class="weak">弱項功能：'+weak.map(function(f){return f+'（錯 '+byFn[f].wrong+' 題）'}).join('、')+'</div>';
  }
  var hasMore=STATE.groupIdx+1 < GROUPS.length;
  if(hasMore){
    html+='<button class="btn" id="nextGroupBtn">下一組 →</button>';
  } else {
    html+='<div class="done-banner" style="margin-top:12px">🎉 全部題組完成！</div>';
  }
  html+='</div>';
  document.getElementById('stage').innerHTML=html;
  if(hasMore){
    document.getElementById('nextGroupBtn').onclick=function(){
      STATE.groupIdx++; STATE.qIdx=0; STATE.answers=[]; saveProgress(STATE); renderQuestion();
    };
  }
}

document.addEventListener('DOMContentLoaded', renderQuestion);
</script></body></html>
