  if (curRec) { try { curRec.stop(); } catch (e) {} return; }
  if (!HAS_SR) { cb(null); return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  var r = new SR();
  r.lang = 'en-US';
  r.interimResults = false;
  r.maxAlternatives = 5;
  r.continuous = !!opts.long;
  var finals = [], alts = [];
  r.onresult = function (e) {
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      if (opts.long) finals.push(e.results[i][0].transcript);
      else for (var j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript);
    }
  };
  r.onerror = function (e) { if (e && e.error === 'not-allowed') toast('麥克風權限被拒絕，請到設定允許 Safari 使用麥克風'); };
  r.onend = function () {
    curRec = null; window.__recActive = false; if (onState) onState(false);
    cb(opts.long ? [finals.join(' ')] : alts);
  };
  curRec = r; window.__recActive = true; if (onState) onState(true);
  try { r.start(); } catch (e) { curRec = null; window.__recActive = false; if (onState) onState(false); cb([]); }
}
function best(target, alts) {
  var b = { s: 0, t: '' };
  (alts || []).forEach(function (a) { var s = score(target, a); if (s > b.s || !b.t) b = { s: s, t: a }; });
  return b;
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200);
}
/* 唸不過時的提示文字 */
function failText(r, again) {
  if (r.silent) return '沒聽到聲音，靠近一點再唸一次';
  return '聽到：「' + r.heard + '」，' + again;
}
function passText(r) {
  return r.forced ? '💪 練習 ' + r.n + ' 次，先過關（這個比較難，之後再多唸幾次）' : '✅ 唸對了：「' + r.heard + '」';
}
</script>
<script>
(function () {
  $('#series').textContent = EP.series; $('#ttl').textContent = EP.title; $('#ttlzh').textContent = EP.title_zh + '（' + EP.date + '）';
  $('#predict').textContent = EP.predict; $('#bbcMp3').href = EP.audio_url; $('#afterLink').href = EP.id + '-practice.html';
  var V = EP.vocab, st = store.get(); st.pass = st.pass || {};
  var heardOnce = {};

  function hl(ex, w) {
    var core = w.replace(/…/g, '').split('/')[0].trim().replace(/^I'm |^I /, '');
    var i = ex.toLowerCase().indexOf(core.toLowerCase());
    return i < 0 ? esc(ex) : esc(ex.slice(0, i)) + '<b>' + esc(ex.slice(i, i + core.length)) + '</b>' + esc(ex.slice(i + core.length));
  }
  function target(v) { return v.say || v.w; }

  V.forEach(function (v, i) {
    var c = el('div', 'card');
    c.innerHTML = '<div class="row"><span class="word">' + esc(v.w) + '</span>' +
      '<span class="tag ' + v.src + '">' + (v.src === 'bbc' || v.src === 'BBC' ? 'BBC 官方' : '加碼片語') + '</span>' +
      '<span class="spacer"></span><button class="say">🔊 聽</button><button class="mic" disabled>🎤 唸</button></div>' +
      '<div class="zhm">' + esc(v.zh) + '</div>' +
      '<div class="ex">' + hl(v.ex, v.w) + ' <button class="exsay" style="min-height:30px;padding:2px 8px;font-size:13px">🔊 例句</button></div>' +
      '<div class="heard"></div>';
    if (v.src === 'BBC') c.querySelector('.tag').className = 'tag bbc';
    var mic = c.querySelector('.mic'), heard = c.querySelector('.heard');
    c.querySelector('.say').onclick = function () { heardOnce[i] = 1; mic.disabled = false; speak(target(v), { rate: 0.85 }); };
    c.querySelector('.exsay').onclick = function () { speak(v.ex, { rate: 0.9 }); };
    mic.onclick = function () {
      heard.className = 'heard'; heard.textContent = '🎙️ 請唸：' + target(v);
      listen({}, function (alts) {
        if (alts === null) { heard.className = 'heard no'; heard.textContent = NO_SR_MSG; return; }
        var r = judge('w' + i, '單字「' + v.w + '」', target(v), alts, 0.7, 'word');
        if (r.pass) ok(r);
        else { heard.className = 'heard no'; heard.textContent = failText(r, '再試一次！'); }
      }, function (on) { mic.classList.toggle('rec', on); mic.textContent = on ? '⏹ 停' : '🎤 唸'; });
    };
    function ok(r) { st.pass[i] = 1; store.set(st); heard.className = 'heard ok'; heard.textContent = passText(r); c.classList.add('pass'); mic.disabled = true; upd(); }
    if (st.pass[i]) { c.classList.add('pass'); mic.disabled = false; heard.className = 'heard ok'; heard.textContent = '✅ 已完成'; }
    $('#cards').appendChild(c);
  });

  function upd() {
    var n = Object.keys(st.pass).length;
    $('#b1').style.width = (n / V.length * 100) + '%';
    $('#p1').textContent = '已唸對 ' + n + ' / ' + V.length;
    if (n >= V.length) {
      sectionDone('vocab', '單字片語 ' + V.length + ' 個全部唸過');
      $('#st1').className = 'done'; $('#quizLock').classList.add('hide'); $('#quiz').classList.remove('hide');
      if (st.quiz) unlockGo(); else { $('#st2').className = 'on'; if (!quizStarted) startQuiz(); }
    }
  }

  var quizStarted = false, order, qi, firstTry, wrongs;
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function startQuiz() { quizStarted = true; order = shuffle(V.map(function (_, i) { return i; })); qi = 0; wrongs = 0; showQ(); }
  function showQ() {
    $('#b2').style.width = (qi / order.length * 100) + '%';
    $('#p2').textContent = '第 ' + (qi + 1) + ' / ' + order.length + ' 題';
    var v = V[order[qi]]; firstTry = true;
    $('#qw').textContent = v.w; $('#qsay').onclick = function () { speak(target(v)); };
    var others = shuffle(V.filter(function (x) { return x !== v; })).slice(0, 3);
    var box = $('#qopts'); box.innerHTML = '';
    shuffle(others.concat([v])).forEach(function (o) {
      var b = el('button', '', esc(o.zh));
      b.onclick = function () {
        if (o === v) {
          b.className = 'right'; speak(target(v));
          setTimeout(function () { qi++; if (qi >= order.length) finishQuiz(); else showQ(); }, 700);
        } else { b.className = 'wrong'; b.disabled = true; if (firstTry) { wrongs++; firstTry = false; order.push(order[qi]); } }
      };
      box.appendChild(b);
    });
  }
  function finishQuiz() {
    st.quiz = 1; store.set(st);
    report('意思小測：答錯 ' + wrongs + ' 題（答錯的已重考）');
    $('#b2').style.width = '100%';
    $('#p2').textContent = '小測完成！' + (wrongs ? '（答錯的字已經多練一次了）' : '全部一次答對 🎉');
    $('#qopts').innerHTML = ''; $('#qw').textContent = '👏 Great job!';
    unlockGo();
  }
  function unlockGo() {
    $('#st2').className = 'done'; $('#st3').className = 'on';
    $('#goLock').classList.add('hide'); $('#go').classList.remove('hide');
    if (st.quiz && !quizStarted) { $('#quiz').classList.add('hide'); var L = $('#quizLock'); L.classList.remove('hide'); L.className = 'card pass'; L.textContent = '✅ 小測已完成'; }
  }
  upd();
})();
</script>
<script>/* 選聲升級 2026-09-03：頁面原本沒設定 voice，用到系統預設的機械 compact 音。
   這裡統一攔截 speechSynthesis.speak：英文語音自動改挑「增強/Siri 版」聲音
   （家長已在裝置下載 Allison/Joelle/Tom/Nathan 增強音質），沒有增強音就照舊。 */
(function(){
  var ENH=/enhanced|premium|siri/i, PREF=['Allison','Joelle','Samantha','Ava','Tom','Nathan','Aaron','Daniel','Karen'];
  function pick(){
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices&&speechSynthesis.getVoices())||[];
    var en=vs.filter(function(v){return /^en[-_](US|GB|AU)/i.test(v.lang||'');});
    if(!en.length) return null;
    function isEnh(v){return ENH.test(v.name+'|'+(v.voiceURI||''));}
    for(var pass=0;pass<2;pass++){
      for(var i=0;i<PREF.length;i++){
        var hits=en.filter(function(v){return v.name.indexOf(PREF[i])>=0;});
        if(pass===0)hits=hits.filter(isEnh);
        if(hits.length)return hits.find(isEnh)||hits[0];
      }
    }
    return en.find(isEnh)||null;
  }
  var orig=window.speechSynthesis.speak.bind(window.speechSynthesis);
  window.speechSynthesis.speak=function(u){
    try{ if(u&&!u.voice&&/^en/i.test(u.lang||'en')){ var v=pick(); if(v)u.voice=v; } }catch(e){}
    return orig(u);
  };
  try{ speechSynthesis.getVoices(); }catch(e){}
})();
</script>
