function judge(key, label, target, alts, thr, kind) {
  var limit = FORCE_AFTER[kind] || 5;
  var b = best(target, alts);
  if (!b.t) return { pass: false, heard: '', silent: true };
  T.att[key] = (T.att[key] || 0) + 1; saveT();
  if (b.s >= thr) return { pass: true, heard: b.t, n: T.att[key] };
  if (T.att[key] >= limit) { T.forced[key] = label; saveT(); return { pass: true, forced: true, heard: b.t, n: T.att[key] }; }
  return { pass: false, heard: b.t, n: T.att[key] };
}
function sectionDone(id, name) {
  if (T.sent[id]) return;
  T.sent[id] = 1; saveT();
  notify('通過：Bobo BBC ' + EP.id + '「' + EP.title + '」' + PAGE_NAME + '：' + name);
}
function report(extra) {
  if (T.sent._done) return;
  T.sent._done = 1; saveT();
  var tot = 0; Object.keys(T.att).forEach(function (k) { tot += T.att[k]; });
  var forced = Object.keys(T.forced).map(function (k) { return '・' + T.forced[k] + '（練 ' + T.att[k] + ' 次）'; });
  notify('Bobo BBC ' + EP.id + '「' + EP.title + '」' + PAGE_NAME + '完成。' +
    (extra ? '\n' + extra : '') +
    '\n口說總嘗試：' + tot + ' 次' +
    (forced.length ? '\n一直唸不過、練滿次數才放行的：\n' + forced.join('\n') : '\n口說全部正常唸對過關'));
}

window.__recActive = false;
function speak(text, opts, onEnd) {
  opts = opts || {};
  if (window.__recActive || !window.speechSynthesis) { if (onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = opts.rate || 0.9;
  u.pitch = opts.pitch || 1;
  var done = false;
  function fin() { if (!done) { done = true; if (onEnd) onEnd(); } }
  u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
}

function norm(s) {
  return String(s).toLowerCase().replace(/[’']/g, '').replace(/…|\.\.\./g, ' ')
    .replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
}
/* 目標字有幾成被唸到（不計順序，同字可重複計） */
function score(target, heard) {
  var t = norm(target), h = norm(heard), pool = {};
  h.forEach(function (w) { pool[w] = (pool[w] || 0) + 1; });
  var hit = 0;
  t.forEach(function (w) { if (pool[w]) { pool[w]--; hit++; } });
  return t.length ? hit / t.length : 0;
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var HAS_SR = !!SR;
var NO_SR_MSG = '這個瀏覽器不能收音。請用 Safari 直接打開這個網頁（不要用 LINE／Telegram 內建瀏覽器）。';
/* 一次辨識。cb(alternatives[])；不支援辨識時 cb(null) */
var curRec = null;
function listen(opts, cb, onState) {
  if (curRec) { try { curRec.stop(); } catch (e) {} return; }
  if (!HAS_SR) { cb(null); return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  var r = new SR();
  r.lang = 'en-US';
  r.interimResults = false;
  r.maxAlternatives = 5;
  r.continuous = !!opts.long;
  var finals = [], alts = [];
  r.onresult = function (e) {
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      if (opts.long) finals.push(e.results[i][0].transcript);
      else for (var j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript);
    }
  };
  r.onerror = function (e) { if (e && e.error === 'not-allowed') toast('麥克風權限被拒絕，請到設定允許 Safari 使用麥克風'); };
  r.onend = function () {
    curRec = null; window.__recActive = false; if (onState) onState(false);
    cb(opts.long ? [finals.join(' ')] : alts);
  };
  curRec = r; window.__recActive = true; if (onState) onState(true);
  try { r.start(); } catch (e) { curRec = null; window.__recActive = false; if (onState) onState(false); cb([]); }
}
function best(target, alts) {
  var b = { s: 0, t: '' };
  (alts || []).forEach(function (a) { var s = score(target, a); if (s > b.s || !b.t) b = { s: s, t: a }; });
  return b;
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200);
}
/* 唸不過時的提示文字 */
function failText(r, again) {
  if (r.silent) return '沒聽到聲音，靠近一點再唸一次';
  return '聽到：「' + r.heard + '」，' + again;
}
function passText(r) {
  return r.forced ? '💪 練習 ' + r.n + ' 次，先過關（這個比較難，之後再多唸幾次）' : '✅ 唸對了：「' + r.heard + '」';
}
</script>
<script>
(function () {
  $('#series').textContent = EP.series; $('#ttl').textContent = EP.title; $('#ttlzh').textContent = EP.title_zh + '（' + EP.date + '）';
  $('#predict').textContent = EP.predict; $('#bbcMp3').href = EP.audio_url; $('#afterLink').href = EP.id + '-practice.html';
  var V = EP.vocab, st = store.get();

  function hl(ex, w) {
    var core = w.replace(/…/g, '').split('/')[0].trim().replace(/^I'm |^I /, '');
    var i = ex.toLowerCase().indexOf(core.toLowerCase());
    return i < 0 ? esc(ex) : esc(ex.slice(0, i)) + '<b>' + esc(ex.slice(i, i + core.length)) + '</b>' + esc(ex.slice(i + core.length));
  }
  function target(v) { return v.say || v.w; }

  /* 每張卡：先聽單字→唸單字；唸過後再聽例句→唸例句。兩個都過，這張卡才算完成。 */
  st.wd = st.wd || {}; st.done = st.done || {};
  V.forEach(function (v, i) {
    var c = el('div', 'card');
    c.innerHTML = '<div class="row"><span class="word">' + esc(v.w) + '</span>' +
      '<span class="tag ' + (v.src === 'BBC' ? 'bbc' : 'pick') + '">' + (v.src === 'BBC' ? 'BBC 官方' : '加碼片語') + '</span>' +
      '<span class="tag ' + (v.lv === 'plus' ? 'plus' : 'gept') + '">' + (v.lv === 'plus' ? '進階・多學' : 'GEPT 初級') + '</span>' +
      '<span class="spacer"></span><button class="say">🔊 聽</button><button class="mic" disabled>🎤 唸</button></div>' +
      '<div class="zhm">' + esc(v.zh) + '</div><div class="heard hw"></div>' +
      '<div class="exrow hide" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">' +
      '<div class="ex">例句：' + hl(v.ex, v.w) + '</div>' +
      '<div class="row" style="margin-top:6px"><button class="exsay">🔊 聽例句</button><button class="mic exmic" disabled>🎤 唸例句</button></div>' +
      '<div class="heard he"></div></div>';
    var mic = c.querySelector('.mic'), hw = c.querySelector('.hw'), exrow = c.querySelector('.exrow'),
        exmic = c.querySelector('.exmic'), he = c.querySelector('.he');
    c.querySelector('.say').onclick = function () { if (!st.wd[i]) mic.disabled = false; speak(target(v), { rate: 0.85 }); };
    c.querySelector('.exsay').onclick = function () { if (!st.done[i]) exmic.disabled = false; speak(v.ex, { rate: 0.85 }); };
    function micState(b, label) { return function (on) { b.classList.toggle('rec', on); b.textContent = on ? '⏹ 停' : label; }; }
    mic.onclick = function () {
      hw.className = 'heard hw'; hw.textContent = '🎙️ 請唸：' + target(v);
      listen({}, function (alts) {
        if (alts === null) { hw.className = 'heard hw no'; hw.textContent = NO_SR_MSG; return; }
        var r = judge('w' + i, '單字「' + v.w + '」', target(v), alts, 0.7, 'word');
        if (r.pass) { st.wd[i] = 1; store.set(st); mic.disabled = true; hw.className = 'heard hw ok'; hw.textContent = passText(r) + '　接著唸例句 👇'; exrow.classList.remove('hide'); }
        else { hw.className = 'heard hw no'; hw.textContent = failText(r, '再試一次！'); }
      }, micState(mic, '🎤 唸'));
    };
    exmic.onclick = function () {
      he.className = 'heard he'; he.textContent = '🎙️ 請唸整句例句';
      listen({}, function (alts) {
        if (alts === null) { he.className = 'heard he no'; he.textContent = NO_SR_MSG; return; }
        var r = judge('e' + i, '例句「' + v.ex + '」', v.ex, alts, 0.75, 'sentence');
        if (r.pass) { st.done[i] = 1; store.set(st); exmic.disabled = true; he.className = 'heard he ok'; he.textContent = passText(r); c.classList.add('pass'); upd(); }
        else { he.className = 'heard he no'; he.textContent = failText(r, '整句再唸一次，每個字都要唸到！'); }
      }, micState(exmic, '🎤 唸例句'));
    };
    if (st.wd[i]) { exrow.classList.remove('hide'); hw.className = 'heard hw ok'; hw.textContent = '✅ 單字已完成'; }
    if (st.done[i]) { c.classList.add('pass'); he.className = 'heard he ok'; he.textContent = '✅ 例句已完成'; }
    $('#cards').appendChild(c);
  });

  function upd() {
    var n = Object.keys(st.done).length;
    $('#b1').style.width = (n / V.length * 100) + '%';
    $('#p1').textContent = '已唸對 ' + n + ' / ' + V.length;
    if (n >= V.length) {
      sectionDone('vocab', '單字片語＋例句 ' + V.length + ' 組全部唸過');
      $('#st1').className = 'done'; $('#quizLock').classList.add('hide'); $('#quiz').classList.remove('hide');
      if (st.quiz) unlockGo(); else { $('#st2').className = 'on'; if (!quizStarted) startQuiz(); }
    }
  }

  var quizStarted = false, order, qi, firstTry, wrongs;
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function startQuiz() { quizStarted = true; order = shuffle(V.map(function (_, i) { return i; })); qi = 0; wrongs = 0; showQ(); }
  function showQ() {
    $('#b2').style.width = (qi / order.length * 100) + '%';
    $('#p2').textContent = '第 ' + (qi + 1) + ' / ' + order.length + ' 題';
    var v = V[order[qi]]; firstTry = true;
    $('#qw').textContent = v.w; $('#qsay').onclick = function () { speak(target(v)); };
    var others = shuffle(V.filter(function (x) { return x !== v; })).slice(0, 3);
    var box = $('#qopts'); box.innerHTML = '';
    shuffle(others.concat([v])).forEach(function (o) {
      var b = el('button', '', esc(o.zh));
      b.onclick = function () {
        if (o === v) {
          b.className = 'right'; speak(target(v));
          setTimeout(function () { qi++; if (qi >= order.length) finishQuiz(); else showQ(); }, 700);
        } else { b.className = 'wrong'; b.disabled = true; if (firstTry) { wrongs++; firstTry = false; order.push(order[qi]); } }
      };
      box.appendChild(b);
    });
  }
  function finishQuiz() {
    st.quiz = 1; store.set(st);
    report('意思小測：答錯 ' + wrongs + ' 題（答錯的已重考）');
    $('#b2').style.width = '100%';
    $('#p2').textContent = '小測完成！' + (wrongs ? '（答錯的字已經多練一次了）' : '全部一次答對 🎉');
    $('#qopts').innerHTML = ''; $('#qw').textContent = '👏 Great job!';
    unlockGo();
  }
  function unlockGo() {
    $('#st2').className = 'done'; $('#st3').className = 'on';
    $('#goLock').classList.add('hide'); $('#go').classList.remove('hide');
    if (st.quiz && !quizStarted) { $('#quiz').classList.add('hide'); var L = $('#quizLock'); L.classList.remove('hide'); L.className = 'card pass'; L.textContent = '✅ 小測已完成'; }
  }
  upd();
})();
</script>
<script>/* 選聲升級 2026-09-03：頁面原本沒設定 voice，用到系統預設的機械 compact 音。
   這裡統一攔截 speechSynthesis.speak：英文語音自動改挑「增強/Siri 版」聲音
   （家長已在裝置下載 Allison/Joelle/Tom/Nathan 增強音質），沒有增強音就照舊。 */
(function(){
  var ENH=/enhanced|premium|siri/i, PREF=['Allison','Joelle','Samantha','Ava','Tom','Nathan','Aaron','Daniel','Karen'];
  function pick(){
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices&&speechSynthesis.getVoices())||[];
    var en=vs.filter(function(v){return /^en[-_](US|GB|AU)/i.test(v.lang||'');});
    if(!en.length) return null;
    function isEnh(v){return ENH.test(v.name+'|'+(v.voiceURI||''));}
    for(var pass=0;pass<2;pass++){
      for(var i=0;i<PREF.length;i++){
        var hits=en.filter(function(v){return v.name.indexOf(PREF[i])>=0;});
        if(pass===0)hits=hits.filter(isEnh);
        if(hits.length)return hits.find(isEnh)||hits[0];
      }
    }
    return en.find(isEnh)||null;
  }
  var orig=window.speechSynthesis.speak.bind(window.speechSynthesis);
  window.speechSynthesis.speak=function(u){
    try{ if(u&&!u.voice&&/^en/i.test(u.lang||'en')){ var v=pick(); if(v)u.voice=v; } }catch(e){}
    return orig(u);
  };
  try{ speechSynthesis.getVoices(); }catch(e){}
})();
</script>
