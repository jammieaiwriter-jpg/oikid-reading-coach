<script>/* BBC 聽力週課共用引擎：TTS（speechSynthesis）＋語音辨識＋比對＋練習紀錄＋家長通知。
   紅線：辨識頁零 HTML5 Audio；錄音中不出聲（防止拿示範音作弊）。 */

function $(s, r) { return (r || document).querySelector(s); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function mkStore(key) {
  return {
    get: function () { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; } },
    set: function (o) { try { localStorage.setItem(key, JSON.stringify(o)); } catch (e) {} }

var store = mkStore('bbc-' + EP.id + '-' + (window.PAGE || ''));

var NOTIFY_ENDPOINT = 'https://bobo-math-notify.bobo-math-grader.workers.dev';
var PAGE_NAME = { pre: '預習', read: '課後練習' }[window.PAGE] || window.PAGE;
function notify(msg) {
  try {
    fetch(NOTIFY_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: msg, to: 'bobo' }) }).catch(function () {});
  } catch (e) {}
}

/* ---- 練習紀錄：每個口說項目的嘗試次數、一直唸不過才放行的項目 ----
   唸對就立刻過關；只有連續唸不過時，單字練滿 5 次、句子練滿 3 次才放行（Emma 2026-10-19）。
   畫面不顯示「再幾次可過關」，以免孩子故意亂唸耗次數。 */
var FORCE_AFTER = { word: 5, sentence: 3 };

function saveT() { trackStore.set(T); }
/* 只在「有聽到聲音」時記一次嘗試；沒唸對但已練滿 5 次 → 以「練習 5 次過關」放行，並記下來通知家長 */
function judge(key, label, target, alts, thr, kind) {
  var limit = FORCE_AFTER[kind] || 5;
  var b = best(target, alts);
  if (!b.t) return { pass: false, heard: '', silent: true };

  if (T.att[key] >= limit) { T.forced[key] = label + '——最後聽到「' + b.t + '」'; saveT(); return { pass: true, forced: true, heard: b.t, n: T.att[key] }; }
  return { pass: false, heard: b.t, n: T.att[key] };

function sectionDone(id, name) {
  if (T.sent[id]) return;
  T.sent[id] = 1; saveT();

}
function report(extra) {
  if (T.sent._done) return;
  T.sent._done = 1; saveT();
  var tot = 0; Object.keys(T.att).forEach(function (k) { tot += T.att[k]; });
  var forced = Object.keys(T.forced).map(function (k) { return '・' + T.forced[k] + '（練 ' + T.att[k] + ' 次）'; });
  notify('Bobo BBC ' + EP.id + '「' + EP.title + '」' + PAGE_NAME + '完成。' +
    (extra ? '\n' + extra : '') +
    '\n口說總嘗試：' + tot + ' 次' +
    (forced.length ? '\n一直唸不過、練滿次數才放行的：\n' + forced.join('\n') : '\n口說全部正常唸對過關'));

window.__recActive = false;
function speak(text, opts, onEnd) {

/* 縮寫一律展開（辨識有時給 I'm、有時給 I am）；單複數、拆成兩個字的複合字都算對——
   2026-10-21 cinema 預習：distractions／downside 練滿 5 次才放行，多半是比對太死，不是孩子唸不出來 */
var CONTR = { im: 'i am', youre: 'you are', were_: 'we are', theyre: 'they are', hes: 'he is', shes: 'she is', its: 'it is',
  thats: 'that is', dont: 'do not', doesnt: 'does not', didnt: 'did not', isnt: 'is not', arent: 'are not',
  wasnt: 'was not', cant: 'can not', cannot: 'can not', wont: 'will not', shouldnt: 'should not', havent: 'have not',
  hasnt: 'has not', ive: 'i have', id: 'i would', ill: 'i will', lets: 'let us', whats: 'what is' };
function stem(w) {   // movies/movie、studies/study、cookies/cookie 兩邊都還原成同一個形狀

  var out = [];
  raw.forEach(function (w) { (CONTR[w] || w).split(' ').forEach(function (x) { out.push(stem(x)); }); });
  return out;
}
/* 目標字有幾成被唸到（不計順序，同字可重複計）；沒對到的長字，再拿「聽到的整串去掉空格」比一次（down side → downside） */

  var t = norm(target), h = norm(heard), pool = {}, joined = h.join('');
  h.forEach(function (w) { pool[w] = (pool[w] || 0) + 1; });
  var hit = 0;
  t.forEach(function (w) {
    if (pool[w]) { pool[w]--; hit++; }
    else if (w.length >= 5 && joined.indexOf(w) >= 0) hit++;

var HAS_SR = !!SR;

}

<script>
(function () {

      '<div class="zhm">' + esc(v.zh) + '</div><div class="heard hw"></div>' +

      var b = el('button', '', esc(o.zh));

        if (o === v) {
          b.className = 'right'; speak(target(v));
          setTimeout(function () { qi++; if (qi >= order.length) finishQuiz(); else showQ(); }, 700);
        } else {
          b.className = 'wrong'; if (firstTry) { wrongs++; firstTry = false; order.push(order[qi]); }
          [].forEach.call(box.children, function (x) { x.disabled = true; if (x._v === v) x.className = 'right'; });
          sayFix(v, order[qi]);
        }
      };
      b._v = o; box.appendChild(b);
    });
  }
  /* 小測答錯：顯示正確意思，先聽、再把這個字唸對才能往下（Emma 2026-10-21）。這題之後還會再考一次。 */
  function sayFix(v, vi) {
    var f = $('#qfix'); f.classList.remove('hide');
    f.innerHTML = '<div>❌ <b>' + esc(v.w) + '</b> 的意思是「' + esc(v.zh) + '」。先聽，再唸一次這個字才能繼續。</div>' +
      '<div class="row" style="margin-top:6px"><button class="fsay">🔊 聽</button><button class="mic fmic" disabled>🎤 唸</button></div><div class="heard fh"></div>';
    var mic = f.querySelector('.fmic'), fh = f.querySelector('.fh');
    f.querySelector('.fsay').onclick = function () { mic.disabled = false; speak(target(v), { rate: 0.85 }); };
    mic.onclick = function () {
      fh.className = 'heard fh'; fh.textContent = '🎙️ 請唸：' + target(v);
      listen({}, function (alts) {
        if (alts === null) { fh.className = 'heard fh no'; fh.textContent = NO_SR_MSG; return; }
        var r = judge('q' + vi, '小測答錯補唸「' + v.w + '」', target(v), alts, 0.7, 'word');
        if (r.pass) {
          mic.disabled = true; fh.className = 'heard fh ok'; fh.textContent = passText(r) + '　這個字等一下會再考一次';
          setTimeout(function () { qi++; if (qi >= order.length) finishQuiz(); else showQ(); }, 1200);
        } else { fh.className = 'heard fh no'; fh.textContent = failText(r, '再試一次！'); }
      }, function (on) { mic.classList.toggle('rec', on); mic.textContent = on ? '⏹ 停' : '🎤 唸'; });
    };
  }
  function finishQuiz() {
    st.quiz = 1; store.set(st);
    report('意思小測：答錯 ' + wrongs + ' 題（答錯的已重考）');
    $('#b2').style.width = '100%';
    $('#p2').textContent = '小測完成！' + (wrongs ? '（答錯的字已經多練一次了）' : '全部一次答對 🎉');
    $('#qopts').innerHTML = ''; $('#qw').textContent = '👏 Great job!';
    unlockGo();
  }
  function unlockGo() {
    $('#st2').className = 'done'; $('#st3').className = 'on';
    $('#goLock').classList.add('hide'); $('#go').classList.remove('hide');
    if (st.quiz && !quizStarted) { $('#quiz').classList.add('hide'); var L = $('#quizLock'); L.classList.remove('hide'); L.className = 'card pass'; L.textContent = '✅ 小測已完成'; }
  }
  upd();
})();
</script>
<script>/* 選聲升級 2026-09-03：頁面原本沒設定 voice，用到系統預設的機械 compact 音。
   這裡統一攔截 speechSynthesis.speak：英文語音自動改挑「增強/Siri 版」聲音
   （家長已在裝置下載 Allison/Joelle/Tom/Nathan 增強音質），沒有增強音就照舊。 */
(function(){
  var ENH=/enhanced|premium|siri/i, PREF=['Allison','Joelle','Samantha','Ava','Tom','Nathan','Aaron','Daniel','Karen'];
  function pick(){
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices&&speechSynthesis.getVoices())||[];
    var en=vs.filter(function(v){return /^en[-_](US|GB|AU)/i.test(v.lang||'');});
    if(!en.length) return null;
    function isEnh(v){return ENH.test(v.name+'|'+(v.voiceURI||''));}
    for(var pass=0;pass<2;pass++){
      for(var i=0;i<PREF.length;i++){
        var hits=en.filter(function(v){return v.name.indexOf(PREF[i])>=0;});
        if(pass===0)hits=hits.filter(isEnh);
        if(hits.length)return hits.find(isEnh)||hits[0];
      }
    }
    return en.find(isEnh)||null;
  }
  var orig=window.speechSynthesis.speak.bind(window.speechSynthesis);
  window.speechSynthesis.speak=function(u){
    try{ if(u&&!u.voice&&/^en/i.test(u.lang||'en')){ var v=pick(); if(v)u.voice=v; } }catch(e){}
    return orig(u);
  };
  try{ speechSynthesis.getVoices(); }catch(e){}
})();
</script>
