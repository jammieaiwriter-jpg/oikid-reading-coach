<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LV4-40 Hobbies – Outdoor Hobbies | OiKID</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#e8f7fb;color:#333;padding-bottom:60px;}

.hero{background:linear-gradient(135deg,#4ec9e1,#2196a8);color:#fff;text-align:center;padding:28px 20px 20px;}
.hero .badge{display:inline-block;background:#ff8c42;color:#fff;font-size:.8rem;font-weight:700;padding:3px 14px;border-radius:20px;margin-bottom:8px;}
.hero h1{font-size:1.8rem;font-weight:800;}
.hero h2{font-size:1rem;opacity:.9;margin-top:4px;}

.section{max-width:820px;margin:20px auto 0;background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08);overflow:hidden;}
.sec-head{display:flex;align-items:center;gap:8px;padding:13px 20px;font-size:1.05rem;font-weight:700;color:#fff;}
.sec-head.teal{background:#2aabbb;}
.sec-head.orange{background:#f4873a;}
.sec-body{padding:18px 20px;}

/* VOCAB CARDS */
.vocab-list{display:flex;flex-direction:column;gap:10px;}
.vocab-card{background:#f8fafb;border:1.5px solid #ddf0f5;border-radius:12px;padding:13px 16px;cursor:pointer;transition:background .15s,transform .15s;display:flex;align-items:center;justify-content:space-between;user-select:none;}
.vocab-card:hover{background:#e6f7fb;transform:translateX(3px);}
.vocab-card:active{transform:scale(.97);}
.vocab-left .word{font-size:1.25rem;font-weight:700;color:#222;}
.vocab-left .meta{font-size:.85rem;margin-top:2px;}
.vocab-left .pos{color:#2aabbb;font-weight:600;}
.vocab-left .zh{color:#e07b3a;font-weight:600;margin-left:6px;}
.vocab-speaker{font-size:1.3rem;color:#2aabbb;opacity:.5;}
.vocab-card:hover .vocab-speaker{opacity:1;}

/* VOCAB ASSESS */
.vocab-assess{background:#f8f2ff;border-radius:14px;padding:16px 18px;margin-top:16px;}
.vocab-assess h4{font-size:.9rem;font-weight:700;color:#7b3fc4;margin-bottom:12px;}
.vocab-word-list{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px 16px;font-size:1.1rem;line-height:2.4;margin-bottom:10px;min-height:60px;}
.vocab-word-list span{display:inline-block;margin:2px 6px;padding:2px 8px;border-radius:6px;font-weight:700;}
.w-ok{color:#27ae60;background:#eafaf1;}
.w-err{color:#e74c3c;background:#fdf2f2;text-decoration:underline wavy #e74c3c;}
.w-neutral{color:#555;background:#f4f4f4;}

/* PARA BLOCK */
.para-block{margin-bottom:14px;}
.para-block:last-child{margin-bottom:0;}
.listen-btn{width:100%;background:#f0f9fb;border:1.5px solid #b8e8f0;border-radius:12px;padding:13px 16px;text-align:left;font-size:.97rem;line-height:1.85;color:#333;cursor:pointer;position:relative;transition:background .15s;}
.listen-btn:hover{background:#ddf5fa;}
.para-label{font-size:.72rem;font-weight:700;color:#2aabbb;display:block;margin-bottom:3px;letter-spacing:.5px;}
.listen-icon{position:absolute;top:11px;right:14px;font-size:1.1rem;opacity:.4;}
.listen-btn:hover .listen-icon{opacity:1;}

/* ASSESS BLOCK */
.assess-block{background:#fff8f0;border:1.5px solid #f8d8b0;border-radius:12px;padding:14px 16px;margin-top:6px;}
.assess-label{font-size:.75rem;font-weight:700;color:#e07b3a;margin-bottom:8px;}
.result-display{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px 12px;font-size:.95rem;line-height:2;min-height:44px;margin-bottom:8px;}
.result-display span{display:inline-block;margin:1px 3px;padding:1px 5px;border-radius:5px;}
.result-display .placeholder{color:#bbb;font-style:italic;font-size:.88rem;background:none;padding:0;}
.assess-info{font-size:.8rem;color:#888;margin-bottom:8px;}
.assess-feedback{font-size:.95rem;font-weight:700;min-height:20px;margin-bottom:8px;}
.assess-feedback.pass{color:#27ae60;}
.assess-feedback.fail{color:#e74c3c;}
.assess-feedback.perfect{color:#e67e22;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn-speak{background:#2aabbb;color:#fff;border:none;border-radius:20px;padding:9px 22px;font-size:.95rem;font-weight:700;cursor:pointer;}
.btn-speak:disabled{background:#aaa;cursor:not-allowed;}
.btn-stop{background:#e74c3c;color:#fff;border:none;border-radius:20px;padding:9px 20px;font-size:.95rem;font-weight:700;cursor:pointer;}
.btn-stop:disabled{background:#ccc;color:#999;cursor:not-allowed;}
.score-pill{display:none;margin-top:10px;border-radius:10px;padding:9px 16px;font-size:.95rem;font-weight:700;text-align:center;}
.score-pill.perfect{background:linear-gradient(135deg,#f6d365,#fda085);color:#fff;}
.score-pill.pass{background:linear-gradient(135deg,#43c98e,#2aabbb);color:#fff;}
.score-pill.fail{background:#ffeaea;color:#c0392b;border:1.5px solid #f5c6c6;}

/* Recording */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.rec-dot{display:inline-block;width:10px;height:10px;background:#e74c3c;border-radius:50%;margin-right:6px;animation:pulse .8s infinite;}
.rec-status{font-size:.85rem;color:#e74c3c;font-weight:600;margin-bottom:8px;min-height:20px;}

@media(max-width:600px){
  .hero h1{font-size:1.4rem;}
  .vocab-left .word{font-size:1.1rem;}
  .btn-speak,.btn-stop{padding:8px 14px;font-size:.85rem;}
}
</style>
</head>
<body>

<div class="hero">
  <div class="badge">LV4-40</div>
  <h1>Hobbies</h1>
  <h2>Outdoor Hobbies &amp; Taking Pictures</h2>
</div>

<!-- VOCABULARY -->
<div class="section">
  <div class="sec-head orange">📖 單字示範區 — 點按聆聽發音</div>
  <div class="sec-body">
    <div class="vocab-list">
      <div class="vocab-card" onclick="speak('rollerblades')">
        <div class="vocab-left"><div class="word">rollerblades</div><div class="meta"><span class="pos">n.</span><span class="zh">直排輪</span></div></div>
        <div class="vocab-speaker">🔊</div>
      </div>
      <div class="vocab-card" onclick="speak('soccer')">
        <div class="vocab-left"><div class="word">soccer</div><div class="meta"><span class="pos">n.</span><span class="zh">足球</span></div></div>
        <div class="vocab-speaker">🔊</div>
      </div>
      <div class="vocab-card" onclick="speak('opposite')">
        <div class="vocab-left"><div class="word">opposite</div><div class="meta"><span class="pos">adj.</span><span class="zh">對面的</span></div></div>
        <div class="vocab-speaker">🔊</div>
      </div>
      <div class="vocab-card" onclick="speak('snorkel')">
        <div class="vocab-left"><div class="word">snorkel</div><div class="meta"><span class="pos">n.</span><span class="zh">浮潛面鏡</span></div></div>
        <div class="vocab-speaker">🔊</div>
      </div>
      <div class="vocab-card" onclick="speak('kick')">
        <div class="vocab-left"><div class="word">kick</div><div class="meta"><span class="pos">v.</span><span class="zh">踢</span></div></div>
        <div class="vocab-speaker">🔊</div>
      </div>
      <div class="vocab-card" onclick="speak('floating')">
        <div class="vocab-left"><div class="word">floating</div><div class="meta"><span class="pos">adj.</span><span class="zh">漂浮的</span></div></div>
        <div class="vocab-speaker">🔊</div>
      </div>
      <div class="vocab-card" onclick="speak('tube')">
        <div class="vocab-left"><div class="word">tube</div><div class="meta"><span class="pos">n.</span><span class="zh">管子</span></div></div>
        <div class="vocab-speaker">🔊</div>
      </div>
    </div>

    <div class="vocab-assess">
      <h4>🎤 單字驗收區 — 說出以下所有單字</h4>
      <!-- Word list ALWAYS visible, just changes color after result -->
      <div class="vocab-word-list" id="vocab-display">
        <span class="w-neutral">rollerblades</span>
        <span class="w-neutral">soccer</span>
        <span class="w-neutral">opposite</span>
        <span class="w-neutral">snorkel</span>
        <span class="w-neutral">kick</span>
        <span class="w-neutral">floating</span>
        <span class="w-neutral">tube</span>
      </div>
      <div class="rec-status" id="vocab-recstatus"></div>
      <div class="assess-info">嘗試次數：<span id="vocab-count">0</span></div>
      <div class="assess-feedback" id="vocab-fb"></div>
      <div class="btn-row">
        <button class="btn-speak" id="vocab-start" onclick="startVocab()">🎤 Start Speaking</button>
        <button class="btn-stop" id="vocab-stop" onclick="stopVocab()" disabled>⏹ Stop</button>
      </div>
      <div class="score-pill" id="vocab-score"></div>
    </div>
  </div>
</div>

<!-- READING -->
<div class="section">
  <div class="sec-head teal">📚 課文示範 &amp; 驗收 — 每段聆聽後口述</div>
  <div class="sec-body" id="passages-container"></div>
</div>

<script>
// TTS
function speak(text){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.85;
  window.speechSynthesis.speak(u);
}

// Passages
const PARAS=[
  {label:'PARAGRAPH 1 — Hobbies',
   text:'People have many different kinds of hobbies. Some hobbies are done indoors, like chess or playing the piano. Other hobbies are done outdoors, like rollerblading, snorkeling, and playing soccer.'},
  {label:'PARAGRAPH 2 — Rollerblades & Soccer',
   text:'Rollerblades are shoes with inline rollers. Many kids enjoy rollerblading in the park. Soccer is a game played by two teams. Each team tries to kick the ball into the opposite goal.'},
  {label:'PARAGRAPH 3 — Snorkeling',
   text:'Snorkeling is a fun outdoor hobby. A snorkel is a mask with a short tube. It lets swimmers breathe when floating on the water. You can see many beautiful fish in the sea!'},
  {label:'PARAGRAPH 4 — Taking Pictures',
   text:'Taking pictures can be an indoor or outdoor hobby. Many people like to take pictures of their friends and families. Some people travel to different places to take pictures. They take pictures of open spaces, like fields or old landmarks.'},
  {label:'PARAGRAPH 5 — Sharing Memories',
   text:'People also take pictures of themselves having fun. Pictures tell stories, capture memories, and give us something to share with the people we like.'},
  {label:'PARAGRAPH 6 — Old Cameras',
   text:'Cameras were first invented hundreds of years ago. Old cameras were big and slow. People had to sit very still while photographers took their pictures. Over the years, cameras became smaller and faster.'},
  {label:'PARAGRAPH 7 — Digital Cameras',
   text:'Now, cameras are digital and even smaller. A digital camera shows you the picture right after you take it. More people can now enjoy taking pictures and sharing them with their friends and family.'}
];

// Build paragraph blocks
const container=document.getElementById('passages-container');
PARAS.forEach((p,i)=>{
  const block=document.createElement('div');
  block.className='para-block';
  block.innerHTML=`
    <button class="listen-btn" onclick="speak(this.dataset.text)" data-text="${p.text.replace(/"/g,'&quot;')}">
      <span class="para-label">${p.label}</span>
      ${p.text}
      <span class="listen-icon">🔊</span>
    </button>
    <div class="assess-block">
      <div class="assess-label">🎤 驗收區 — 口述以上段落</div>
      <div class="result-display" id="res-${i}"><span class="placeholder">按下 Start Speaking 開始錄音…</span></div>
      <div class="rec-status" id="recstatus-${i}"></div>
      <div class="assess-info">嘗試次數：<span id="cnt-${i}">0</span></div>
      <div class="assess-feedback" id="fb-${i}"></div>
      <div class="btn-row">
        <button class="btn-speak" id="start-${i}" onclick="startPara(${i})">🎤 Start Speaking</button>
        <button class="btn-stop" id="stop-${i}" onclick="stopPara(${i})" disabled>⏹ Stop</button>
      </div>
      <div class="score-pill" id="score-${i}"></div>
    </div>
  `;
  container.appendChild(block);
});

// State
const paraState=PARAS.map(()=>({rec:null,stopped:false,transcript:'',attempts:0}));

// Normalize: lowercase, strip punctuation
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();}

// Fuzzy: allow 1 char difference for words >4 chars (handles minor mispronunciation)
function similar(a,b){
  if(a===b) return true;
  if(Math.abs(a.length-b.length)>2) return false;
  let diff=0;
  const len=Math.max(a.length,b.length);
  for(let i=0;i<len;i++){if(a[i]!==b[i])diff++;}
  return diff<=1;
}

// Compare spoken vs target — word order flexible within a ±3 window
function compareHTML(spoken, targetText){
  const sw=norm(spoken).split(/\s+/).filter(Boolean);
  const tw=targetText.split(/\s+/);
  const usedIdx=new Set();
  let correct=0;
  const matched=new Array(tw.length).fill(false);

  // For each target word, find a match in spoken words within window
  tw.forEach((w,ti)=>{
    const n=norm(w);
    // search spoken words ±5 around current position
    const si_start=Math.max(0,ti-5);
    const si_end=Math.min(sw.length-1,ti+8);
    for(let si=si_start;si<=si_end;si++){
      if(usedIdx.has(si)) continue;
      if(similar(sw[si],n)){
        matched[ti]=true;
        usedIdx.add(si);
        correct++;
        break;
      }
    }
  });

  let html='';
  tw.forEach((w,ti)=>{
    if(matched[ti]) html+=`<span class="w-ok">${w}</span> `;
    else html+=`<span class="w-err">${w}</span> `;
  });
  return{html:html.trim(), correct, total:tw.length};
}

function showScore(pct, correct, total, pillEl, fbEl, unitName){
  fbEl.textContent=`得分：${correct}/${total} 字正確（${pct}%）`;
  pillEl.style.display='block';
  if(pct===100){
    fbEl.className='assess-feedback perfect';
    pillEl.className='score-pill perfect';
    pillEl.textContent='🏆 滿分！完美！';
    checkAndNotify(unitName);
  } else if(pct>=90){
    fbEl.className='assess-feedback pass';
    pillEl.className='score-pill pass';
    pillEl.textContent=`✅ ${pct}% — 合格！很棒！`;
    checkAndNotify(unitName);
  } else {
    fbEl.className='assess-feedback fail';
    pillEl.className='score-pill fail';
    pillEl.textContent=`💪 ${pct}% — 繼續加油！（合格需90分）`;
  }
}

// ── PARAGRAPH RECOGNITION ──
function makeSR(){ return new (window.SpeechRecognition||window.webkitSpeechRecognition)(); }

function startPara(i){
  if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){alert('請使用 Chrome 瀏覽器');return;}

  // Kill previous
  if(paraState[i].rec){
    paraState[i].rec.onend=null; paraState[i].rec.onerror=null;
    try{paraState[i].rec.abort();}catch(e){}
  }
  paraState[i].stopped=false;
  paraState[i].transcript='';

  const startBtn=document.getElementById(`start-${i}`);
  const stopBtn=document.getElementById(`stop-${i}`);
  const fb=document.getElementById(`fb-${i}`);
  const resEl=document.getElementById(`res-${i}`);
  const pill=document.getElementById(`score-${i}`);
  const recStatus=document.getElementById(`recstatus-${i}`);

  startBtn.disabled=true; stopBtn.disabled=false;
  fb.textContent=''; fb.className='assess-feedback';
  pill.style.display='none';
  resEl.innerHTML='<span class="placeholder">正在聆聽中…</span>';
  recStatus.innerHTML='<span class="rec-dot"></span>錄音中… 說完整段後按 Stop';

  function launchRec(){
    if(paraState[i].stopped) return;
    const rec=makeSR();
    paraState[i].rec=rec;
    rec.lang='en-US'; rec.continuous=true; rec.interimResults=false;

    rec.onresult=e=>{
      for(let r=e.resultIndex;r<e.results.length;r++){
        if(e.results[r].isFinal) paraState[i].transcript+=e.results[r][0].transcript+' ';
      }
    };

    rec.onerror=e=>{
      if(e.error==='aborted'||e.error==='no-speech') return;
      console.warn('SR',e.error);
    };

    rec.onend=()=>{
      if(!paraState[i].stopped){
        // Auto-restart to keep recording
        setTimeout(launchRec, 100);
        return;
      }
      // User pressed stop — compute result
      recStatus.textContent='';
      startBtn.disabled=false; stopBtn.disabled=true;
      paraState[i].attempts++;
      document.getElementById(`cnt-${i}`).textContent=paraState[i].attempts;

      const t=paraState[i].transcript.trim();
      if(!t){
        resEl.innerHTML='<span class="placeholder">未偵測到語音，請重試。</span>';
        fb.textContent='🎙 沒有偵測到語音'; fb.className='assess-feedback fail';
        return;
      }
      const{html,correct,total}=compareHTML(t, PARAS[i].text);
      resEl.innerHTML=html;
      const pct=Math.round(correct/total*100);
      showScore(pct, correct, total, pill, fb, 'para'+i);
    };

    try{rec.start();}catch(e){console.warn('start err',e);}
  }

  launchRec();
}

function stopPara(i){
  paraState[i].stopped=true;
  document.getElementById(`stop-${i}`).disabled=true;
  if(paraState[i].rec){
    try{paraState[i].rec.stop();}catch(e){}
    setTimeout(()=>{
      if(paraState[i].rec){try{paraState[i].rec.abort();}catch(e){} paraState[i].rec=null;}
    },1200);
  }
}

// ── VOCAB RECOGNITION ──
const VOCAB_WORDS=['rollerblades','soccer','opposite','snorkel','kick','floating','tube'];
let vocabRec=null, vocabAttempts=0, vocabStopped=false, vocabTranscript='';

function renderVocabNeutral(){
  document.getElementById('vocab-display').innerHTML=
    VOCAB_WORDS.map(w=>`<span class="w-neutral">${w}</span>`).join('\n        ');
}

function startVocab(){
  if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){alert('請使用 Chrome 瀏覽器');return;}

  if(vocabRec){
    vocabRec.onend=null; vocabRec.onerror=null;
    try{vocabRec.abort();}catch(e){}
    vocabRec=null;
  }
  vocabStopped=false;
  vocabTranscript='';

  const startBtn=document.getElementById('vocab-start');
  const stopBtn=document.getElementById('vocab-stop');
  const fb=document.getElementById('vocab-fb');
  const pill=document.getElementById('vocab-score');
  const recStatus=document.getElementById('vocab-recstatus');

  startBtn.disabled=true; stopBtn.disabled=false;
  fb.textContent=''; pill.style.display='none';
  recStatus.innerHTML='<span class="rec-dot"></span>錄音中… 說出所有單字後按 Stop';
  // Keep word list visible in neutral color during recording
  renderVocabNeutral();

  function launchVocabRec(){
    if(vocabStopped) return;
    const rec=makeSR();
    vocabRec=rec;
    rec.lang='en-US'; rec.continuous=true; rec.interimResults=false;

    rec.onresult=e=>{
      for(let r=e.resultIndex;r<e.results.length;r++){
        if(e.results[r].isFinal) vocabTranscript+=e.results[r][0].transcript+' ';
      }
    };

    rec.onerror=e=>{
      if(e.error==='aborted'||e.error==='no-speech') return;
      console.warn('VocabSR',e.error);
    };

    rec.onend=()=>{
      if(!vocabStopped){
        setTimeout(launchVocabRec, 100);
        return;
      }
      // User stopped — score
      recStatus.textContent='';
      startBtn.disabled=false; stopBtn.disabled=true;
      vocabAttempts++;
      document.getElementById('vocab-count').textContent=vocabAttempts;

      const t=vocabTranscript.trim();
      if(!t){
        renderVocabNeutral();
        fb.textContent='🎙 沒有偵測到語音，請重試'; fb.className='assess-feedback fail';
        return;
      }

      const spoken=norm(t).split(/\s+/).filter(Boolean);
      let correct=0, html='';
      VOCAB_WORDS.forEach(w=>{
        // Allow fuzzy match: any spoken word similar to target
        const found=spoken.some(s=>similar(s,norm(w)));
        if(found){correct++;html+=`<span class="w-ok">${w}</span>\n        `;}
        else{html+=`<span class="w-err">${w}</span>\n        `;}
      });
      document.getElementById('vocab-display').innerHTML=html;
      const pct=Math.round(correct/VOCAB_WORDS.length*100);
      showScore(pct, correct, VOCAB_WORDS.length, pill, fb, 'vocab');
    };

    try{rec.start();}catch(e){console.warn('vocabStart err',e);}
  }

  launchVocabRec();
}

function stopVocab(){
  vocabStopped=true;
  document.getElementById('vocab-stop').disabled=true;
  if(vocabRec){
    try{vocabRec.stop();}catch(e){}
    setTimeout(()=>{if(vocabRec){try{vocabRec.abort();}catch(e){} vocabRec=null;}},1200);
  }
}

// ── TELEGRAM NOTIFICATION ──
/* 通知走 Cloudflare Worker 中繼；token 與 chat id 留在 Worker secrets，不落前端 */
const NOTIFY_ENDPOINT=window.OIKID_NOTIFY_ENDPOINT||'https://bobo-math-notify.bobo-math-grader.workers.dev';

const TOTAL_UNITS=PARAS.length+1; // 7 paragraphs + vocab
const passed=new Set(); // tracks which units passed

function checkAndNotify(unitName){
  passed.add(unitName);
  if(passed.size>=TOTAL_UNITS){
    sendTelegram('🎉 太棒了！LV4-40 全部通關！\n孩子完成了所有單字和課文驗收，滿分合格！👏');
  }
}

function sendTelegram(msg){
  fetch(NOTIFY_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:msg,to:(DATA&&DATA.child==='Bobo')?'bobo':'default'})}).then(r=>r.json()).then(d=>{
    if(d.ok) console.log('TG sent');
    else console.warn('TG error',d);
  }).catch(e=>console.warn('TG fetch err',e));
}
</script>
<script>
/* 選聲升級 2026-09-03：頁面原本沒設定 voice，用到系統預設的機械 compact 音。
   這裡統一攔截 speechSynthesis.speak：英文語音自動改挑「增強/Siri 版」聲音
   （家長已在裝置下載 Allison/Joelle/Tom/Nathan 增強音質），沒有增強音就照舊。 */
(function(){
  var ENH=/enhanced|premium|siri/i, PREF=['Allison','Joelle','Samantha','Ava','Tom','Nathan','Aaron','Daniel','Karen'];
  function pick(){
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices&&speechSynthesis.getVoices())||[];
    var en=vs.filter(function(v){return /^en[-_](US|GB|AU)/i.test(v.lang||'');});
    if(!en.length) return null;
    function isEnh(v){return ENH.test(v.name+'|'+(v.voiceURI||''));}
    for(var pass=0;pass<2;pass++){
      for(var i=0;i<PREF.length;i++){
        var hits=en.filter(function(v){return v.name.indexOf(PREF[i])>=0;});
        if(pass===0)hits=hits.filter(isEnh);
        if(hits.length)return hits.find(isEnh)||hits[0];
      }
    }
    return en.find(isEnh)||null;
  }
  var orig=window.speechSynthesis.speak.bind(window.speechSynthesis);
  window.speechSynthesis.speak=function(u){
    try{ if(u&&!u.voice&&/^en/i.test(u.lang||'en')){ var v=pick(); if(v)u.voice=v; } }catch(e){}
    return orig(u);
  };
  try{ speechSynthesis.getVoices(); }catch(e){}
})();
</script>
