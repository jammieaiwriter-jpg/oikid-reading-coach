<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>每日單字</title><style>
*{box-sizing:border-box}

.wordcard{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#fff;
  border:2px solid #0f7c90;border-radius:12px;padding:14px 18px;box-shadow:0 8px 24px rgba(15,30,45,.28);

/* 課完成大徽章：與單回完成的 round-cta 視覺明確區分（金色＋徽章圖示＋更大字） */
.round-cta.course-done{background:linear-gradient(135deg,#7c4a03,#c9950c);border:3px solid #ffd43b;padding:28px 20px}
.round-cta.course-done .course-badge{font-size:2.6rem;line-height:1;margin-bottom:8px}
.round-cta.course-done .course-done-title{font-size:1.5rem;font-weight:900;margin-bottom:6px}

.core-badge{display:inline-block;background:#ffb020;color:#2a1a00;border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:900;vertical-align:middle}</style></head><body><div class="wrap">
<div class="hero">
<span class="badge">每日單字</span>
<h1>今日單字練習</h1>
<h2>複習到期單字 ＋ 補新字（每天最多學 8 個新字）</h2>
<div class="intro">今天的題目一開就固定，不會因為重整而變來變去；已經做完的不會再出現。單字庫共 1970 個字。</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="note" id="prog"></div>
</div>
<div id="card-host"></div>
</div><script>window.VOCAB_SRS_NO_AUTORENDER=true;</script><script>
/*!
 * fsrs-review.js — 跨課單字間隔複習模組（IIFE，零依賴）
 * 只暴露 window.VocabSRS = { learn(word, quality) }
 *
 * 需求環境（由主頁面 build 內嵌後提供）：
 *   window.DATA  = { lesson, child, blocks:[{ words:[{w,zh,pos}], practice:[{kind:'spell',answer,mask,say}] }] }
 *   window.speak(text)   -- TTS，可缺席
 *   window.el(id)        -- document.getElementById 包裝，可缺席
 *   window.tg(msg)       -- Telegram 通知，可缺席
 *
 * localStorage：
 *   nanyi-vocab-fsrs-v1        -- 全域字庫（跨課，各單字一張 FSRS 卡）
 *   nanyi-vocab-fsrs-v1-daily  -- 當日複習進度（12 張上限 / 完成旗標）
 */
(function () {
  'use strict';

  var STORAGE_KEY = 'nanyi-vocab-fsrs-v1';
  var DAILY_KEY = 'nanyi-vocab-fsrs-v1-daily';
  var DAILY_LIMIT = 12;
  var LEECH_THRESHOLD = 4;
  var DAY_MS = 86400000;

  // ---- FSRS-4.5 簡化版（僅 long-term / Again·Hard·Good 三鍵） -------------
  // 參數取自 open-spaced-repetition/ts-fsrs 的公開預設權重（FSRS-4.5, 17 個）
  var W = [0.4072, 1.1829, 3.1262, 15.4722, 7.2102, 0.5316, 1.0651, 0.0234,
    1.616, 0.1544, 1.0824, 1.9813, 0.0953, 0.2975, 2.2042, 0.2407, 2.9466];
  var DECAY = -0.5;
  var FACTOR = Math.pow(0.9, 1 / DECAY) - 1; // 使 R(t=S, retention=0.9) 成立
  var RATING = { again: 1, hard: 2, good: 3 };

  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

  function initStability(g) { return W[g - 1]; } // g:1/2/3 -> W0/W1/W2
  function initDifficulty(g) { return clamp(W[4] - (g - 3) * W[5], 1, 10); }

  function nextDifficulty(D, g) {
    var d0Easy = clamp(W[4] - W[5], 1, 10); // D0(rating=4/easy)，用於均值回歸
    var dp = D - W[6] * (g - 3);
    var dpp = W[7] * d0Easy + (1 - W[7]) * dp;
    return clamp(dpp, 1, 10);
  }

  function retrievability(tDays, S) {
    if (!S || S <= 0) return 0;
    return Math.pow(1 + FACTOR * tDays / S, DECAY);
  }

  function nextStability(S, D, R, g) {
    if (g === 1) {
      return W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) * Math.exp((1 - R) * W[14]);
    }
    var hardPenalty = (g === 2) ? W[15] : 1;
    return S * (1 + Math.exp(W[8]) * (11 - D) * Math.pow(S, -W[9]) *
      (Math.exp((1 - R) * W[10]) - 1) * hardPenalty);
  }

  // 純函式：不修改卡片，回傳排程後的新欄位
  function schedule(card, quality, now) {
    var g = RATING[quality] || RATING.good;
    var reps = (card.reps || 0) + 1;
    var lapses = card.lapses || 0;
    var D, S;
    if (!card.reps) {
      S = initStability(g);
      D = initDifficulty(g);
    } else {
      var t = Math.max(0, (now - (card.last || now)) / DAY_MS);
      var R = retrievability(t, Math.max(card.stability || 0.1, 0.1));
      D = nextDifficulty(card.difficulty || initDifficulty(3), g);
      S = nextStability(Math.max(card.stability || 0.1, 0.1), card.difficulty || initDifficulty(3), R, g);
    }
    if (g === 1) lapses += 1;
    S = Math.max(S, 0.1);
    var interval = Math.max(1, Math.round(S));
    var due = now + interval * DAY_MS;
    return { stability: S, difficulty: D, reps: reps, lapses: lapses, due: due };
  }

  // ---- 小工具 --------------------------------------------------------
  function safeSpeak(text) { try { if (typeof window.speak === 'function') window.speak(text); } catch (e) {} }
  function safeTg(msg) { try { if (typeof window.tg === 'function') window.tg(msg); } catch (e) {} }
  function getEl(id) {
    try { if (typeof window.el === 'function') return window.el(id); } catch (e) {}
    return document.getElementById(id);
  }
  function normKey(w) { return String(w || '').trim().toLowerCase(); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function currentLesson() {
    try { return (window.DATA && window.DATA.lesson) || ''; } catch (e) { return ''; }
  }
  function currentChild() {
    try { return (window.DATA && window.DATA.child) || ''; } catch (e) { return ''; }
  }

  // ---- localStorage 存取（防呆：損毀時重建，不噴錯） -------------------
  function loadDB() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      var obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object') return {};
      return obj;
    } catch (e) { return {}; }
  }
  function saveDB(db) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
  }
  function loadDaily() {
    try {
      var raw = localStorage.getItem(DAILY_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return null;
      return o;
    } catch (e) { return null; }
  }
  function saveDaily(d) {
    try { localStorage.setItem(DAILY_KEY, JSON.stringify(d)); } catch (e) {}
  }
  function getDaily() {
    var d = loadDaily();
    var t = todayStr();
    if (!d || d.date !== t) d = { date: t, count: 0, leech: 0, notifiedComplete: false };
    return d;
  }

  // ---- 從 DATA 撈單字 metadata -----------------------------------------
  function lookupMeta(word) {
    var meta = { zh: '', pos: '', mask: null, say: word };
    try {
      var blocks = (window.DATA && window.DATA.blocks) || [];
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i];
        if (b && b.words) {
          for (var j = 0; j < b.words.length; j++) {
            var wd = b.words[j];
            if (wd && wd.w && normKey(wd.w) === normKey(word)) {
              if (wd.zh) meta.zh = wd.zh;
              if (wd.pos) meta.pos = wd.pos;
            }
          }
        }
        if (b && b.practice) {
          for (var k = 0; k < b.practice.length; k++) {
            var p = b.practice[k];
            if (p && p.kind === 'spell' && p.answer && normKey(p.answer) === normKey(word)) {
              if (p.mask) meta.mask = p.mask;
              if (p.say) meta.say = p.say;
            }
          }
        }
      }
    } catch (e) {}
    return meta;
  }

  function newCard(word, meta) {
    return {
      w: word, zh: meta.zh || '', pos: meta.pos || '', mask: meta.mask || null, say: meta.say || word,
      lesson: currentLesson(), due: 0, stability: 0, difficulty: 0, reps: 0, lapses: 0, last: 0,
      leech: false, notified: false
    };
  }

  // 套用一次評分到卡片（原地修改），回傳是否「新產生的難字」
  function applyReview(card, quality, opts) {
    var wasLeech = (card.lapses || 0) >= LEECH_THRESHOLD;
    var now = Date.now();
    var sched = schedule(card, quality, now);
    card.stability = sched.stability;
    card.difficulty = sched.difficulty;
    card.reps = sched.reps;
    card.lapses = sched.lapses;
    card.last = now;
    card.due = sched.due;
    card.leech = card.lapses >= LEECH_THRESHOLD;
    if (opts && opts.setLesson) card.lesson = currentLesson();
    if (card.leech && !wasLeech && !card.notified) {
      card.notified = true;
      safeTg(currentChild() + ' 的難字：' + card.w + '（已錯 ' + card.lapses + ' 次）');
    }
    return card;
  }

  // ---- 公開 API：learn() ------------------------------------------------
  function learn(word, quality) {
    if (!word) return null;
    var db = loadDB();
    var key = normKey(word);
    var meta = lookupMeta(word);
    var card = db[key];
    if (!card) {
      card = newCard(word, meta);
    } else {
      if (meta.zh) card.zh = meta.zh;
      if (meta.pos) card.pos = meta.pos;
      if (meta.mask) card.mask = meta.mask;
      if (meta.say) card.say = meta.say;
    }
    applyReview(card, quality, { setLesson: true });
    db[key] = card;
    saveDB(db);
    return card;
  }

  function getDueCards(db, now) {
    var lesson = currentLesson();
    var arr = [];
    for (var k in db) {
      if (!Object.prototype.hasOwnProperty.call(db, k)) continue;
      var c = db[k];
      if (!c || typeof c !== 'object') continue;
      if (typeof c.due !== 'number' || c.due > now) continue;
      if (c.lesson === lesson) continue;
      arr.push(c);
    }
    arr.sort(function (a, b) {
      var al = (a.lapses || 0) >= LEECH_THRESHOLD ? 0 : 1;
      var bl = (b.lapses || 0) >= LEECH_THRESHOLD ? 0 : 1;
      if (al !== bl) return al - bl;
      return (a.due || 0) - (b.due || 0);
    });
    return arr;
  }

  // ---- UI ---------------------------------------------------------------
  var CSS = '' +
    '.vsrs-box{background:#fff;border-radius:16px;padding:16px 18px;margin:0 0 16px;' +
    'box-shadow:0 1px 4px rgba(0,0,0,.08);font-family:inherit}' +
    '.vsrs-box h3{margin:0 0 10px;font-size:17px}' +
    '.vsrs-done{color:#2e7d32;font-weight:600}' +
    '.vsrs-card{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:8px}' +
    '.vsrs-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}' +
    '.vsrs-zh{font-size:18px;font-weight:600}' +
    '.vsrs-pos{color:#888;font-size:13px}' +
    '.vsrs-leech{color:#c0392b;font-size:12px;border:1px solid #c0392b;border-radius:6px;padding:1px 6px}' +
    '.vsrs-speak{border:none;background:#f0f4ff;border-radius:8px;padding:4px 10px;cursor:pointer}' +
    '.vsrs-letters{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}' +
    '.vsrs-letters input{width:32px;height:38px;text-align:center;font-size:18px;' +
    'border:1px solid #ccc;border-radius:6px;text-transform:lowercase}' +
    '.vsrs-letters .fixed{width:32px;height:38px;display:flex;align-items:center;justify-content:center;' +
    'background:#f2f2f2;color:#999;border-radius:6px;font-size:18px}' +
    '.vsrs-actions{display:flex;gap:8px;margin-top:8px}' +
    '.vsrs-actions button{border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}' +
    '.vsrs-check{background:#3f51b5;color:#fff}' +
    '.vsrs-idk{background:#eee;color:#555}' +
    '.vsrs-next{background:#2e7d32;color:#fff}' +
    '.vsrs-feedback{margin-top:8px;font-size:14px}' +
    '.vsrs-feedback.bad{color:#c0392b}' +
    '.vsrs-feedback.good{color:#2e7d32}' +
    '.vsrs-progress{color:#888;font-size:12px;margin-bottom:6px}';

  function injectCss() {
    if (document.getElementById('vsrs-style')) return;
    var s = document.createElement('style');
    s.id = 'vsrs-style';
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function buildMaskChars(card) {
    var answer = String(card.w || '');
    var mask = card.mask;
    if (mask && String(mask).length === answer.length) {
      return String(mask).split('').map(function (ch, i) {
        return { blank: (ch === '_' || ch === '*'), letter: answer.charAt(i) };
      });
    }
    // 沒有 mask 就整字挖空
    return answer.split('').map(function (ch) { return { blank: true, letter: ch }; });
  }

  // 建立單張複習卡的 DOM，done(quality) 為完成時的 callback
  function renderCardUI(card, done) {
    var wrap = document.createElement('div');
    wrap.className = 'vsrs-card';

    var top = document.createElement('div');
    top.className = 'vsrs-top';
    var zh = document.createElement('span');
    zh.className = 'vsrs-zh';
    zh.textContent = card.zh || card.w;
    top.appendChild(zh);
    if (card.pos) {
      var pos = document.createElement('span');
      pos.className = 'vsrs-pos';
      pos.textContent = card.pos;
      top.appendChild(pos);
    }
    if (card.leech) {
      var leechTag = document.createElement('span');
      leechTag.className = 'vsrs-leech';
      leechTag.textContent = '⚠ 難字';
      top.appendChild(leechTag);
    }

function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

/* ---- 佇列組成：只在「今天第一次開頁」時跑一次，之後固定存在 localStorage ---- */
function fsrsDb(){try{return (window.VocabSRS&&VocabSRS._test.loadDB())||{}}catch(e){return {}}}
function leechThreshold(){try{return VocabSRS._test.LEECH_THRESHOLD}catch(e){return 4}}

/* 會考 1200 核心字判斷：沿用 vocab-bank.json ladder 既有的 tier 欄位（不新增任何欄位、
   不寫入 FSRS 儲存），只在排隊/顯示徽章時查表。 */
function isCoreWord(w){const m=findLadderMeta(w);return !!(m&&m.tier==='1200')}
function dayBucket(ts){return Math.floor((ts||0)/86400000)}

function buildQueue(now){
  const db=fsrsDb(),LEECH=leechThreshold();
  const dueAll=Object.keys(db).map(k=>db[k]).filter(c=>c&&typeof c.due==='number'&&c.due<=now);
  dueAll.sort((a,b)=>{
    const al=(a.lapses||0)>=LEECH?0:1,bl=(b.lapses||0)>=LEECH?0:1;
    if(al!==bl)return al-bl; // 難字（lapses>=4）永遠最前，不受核心字影響
    const ad=dayBucket(a.due),bd=dayBucket(b.due);
    if(ad!==bd)return (a.due||0)-(b.due||0); // 不同到期日仍照 FSRS 時間排，核心字不搶跑
    const ac=isCoreWord(a.w)?0:1,bc=isCoreWord(b.w)?0:1;
    if(ac!==bc)return ac-bc; // 同一天到期：核心字排前
    return (a.due||0)-(b.due||0);
  });
  const take=Math.min(dueAll.length,20);
  const queue=dueAll.slice(0,take).map(c=>({w:c.w,type:'review'}));
  if(dueAll.length<20){
    let scanned=0;
    const ladder=(DATA.bank&&DATA.bank.ladder)||[];
    const candidates=[];
    for(let i=0;i<ladder.length;i++){
      if(candidates.length>=20-queue.length||scanned>=20)break;
      scanned++;
      const item=ladder[i];
      if(db[normKey(item.w)])continue; // 已有卡（不管是否到期）就跳過，不重複學
      candidates.push(item);
    }
    // 新字入列：核心 1200 字優先，同層內維持原本掃描到的先後順序（穩定排序，非核心字不會被餓死）
    const core=candidates.filter(item=>item.tier==='1200');
    const rest=candidates.filter(item=>item.tier!=='1200');
    core.concat(rest).forEach(item=>queue.push({w:item.w,type:'new'}));
  }
  return queue;
}

/* ---- 當日狀態存取 ---- */
let STATE, idx=0;
function loadState(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(DATA.storage)||'null')}catch(e){}
  const t=todayStr();
  if(!s||s.date!==t){
    s={date:t,queue:buildQueue(Date.now()),completed:{},newQuotaUsed:0,
       notifiedStart:false,notifiedComplete:false,reviewDone:0,newDone:0,leechDone:0};
  }
  return s;
}
function saveState(){try{localStorage.setItem(DATA.storage,JSON.stringify(STATE))}catch(e){}}

function updateProgress(){
  const total=STATE.queue.length;
  const done=Object.keys(STATE.completed).length;
  const bar=el('bar'),prog=el('prog');
  if(bar)bar.style.width=Math.round(done/Math.max(total,1)*100)+'%';
  if(prog){const rv=STATE.queue.filter(q=>q.type==='review').length,nw=total-rv;
    const mins=Math.max(1,Math.round((rv*0.5+nw*1)));
    prog.textContent='今日 '+done+' / '+total+'（複習 '+rv+'＋新字 '+nw+'，約 '+mins+' 分鐘）'}
}
function clearHost(){const h=el('card-host');h.innerHTML='';return h}

/* 核心 1200 字小徽章（純顯示用，不寫入 FSRS 卡片資料） */
function appendCoreBadge(labelDiv,isCore){
  if(!isCore)return;
  const b=mkEl('span','core-badge','核心');b.id='core-badge';
  labelDiv.appendChild(document.createTextNode(' '));
  labelDiv.appendChild(b);
}

/* ---- 拼寫階段（複習卡、新字卡的「認識」通過後都會走到這） ---- */
function renderSpellStage(host,card,onDone,isCore){
  const box=mkEl('div','item');
  const labelDiv=mkEl('div','label','拼寫');
  appendCoreBadge(labelDiv,isCore);
  box.appendChild(labelDiv);
  const sent=mkEl('div','sentence');
  sent.innerHTML=esc(card.zh||'')+(card.pos?' <span class="pos">'+esc(card.pos)+'</span>':'');
  box.appendChild(sent);
  const listenBtn=mkEl('button','btn','🔊 聽');listenBtn.id='sp-listen';
  box.appendChild(listenBtn);
  const mask=String(card.mask||('_'.repeat(String(card.w||'').length)));
  const row=mkEl('div','spellrow');row.id='sp-boxes';
  const inputs=[];
  for(let ci=0;ci<mask.length;ci++){
    const ch=mask[ci];
    if(ch==='_'){
      const inp=document.createElement('input');
      inp.className='ltr';inp.maxLength=1;inp.id='sp-c'+ci;inp.dataset.pos=String(ci);
      inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
      inp.addEventListener('input',()=>{
        inp.value=(inp.value||'').replace(/[^a-zA-Z]/g,'').slice(-1).toLowerCase();
        if(inp.value){const nxt=inputs.find(x=>+x.dataset.pos>ci&&!x.disabled&&!x.value);if(nxt)nxt.focus()}
      });
      inputs.push(inp);row.appendChild(inp);
    }else{
      row.appendChild(mkEl('span','ltr fixed',ch));
    }
  }
  box.appendChild(row);
  const checkBtn=mkEl('button','btn','檢查');checkBtn.id='sp-check';checkBtn.disabled=true;
  const idkBtn=mkEl('button','btn warn','不會');idkBtn.id='sp-idk';
  box.appendChild(checkBtn);box.appendChild(idkBtn);
  const res=mkEl('div','result');res.id='sp-res';box.appendChild(res);
  const reveal=mkEl('div','result');reveal.id='sp-reveal';reveal.style.display='none';box.appendChild(reveal);
  host.appendChild(box);

  let listened=false,attempts=0,finished=false;
  listenBtn.onclick=()=>{listened=true;speak(card.say||card.w);checkBtn.disabled=false};

  function currentGuess(){
    let out='',ii=0;
    for(let ci=0;ci<mask.length;ci++){
      if(mask[ci]==='_'){out+=(inputs[ii]&&inputs[ii].value)||'';ii++}
      else out+=mask[ci];
    }
    return out.toLowerCase();
  }
  function lockAll(){inputs.forEach(i=>i.disabled=true);checkBtn.disabled=true;idkBtn.disabled=true}
  function doReveal(quality){
    finished=true;lockAll();
    reveal.style.display='block';
    reveal.innerHTML='正解：'+esc(card.w)+(card.say?'（例句：'+esc(card.say)+'）':'')+'　請聽過再繼續';
    const cont=mkEl('button','btn ok','繼續');cont.id='sp-continue';
    cont.onclick=()=>onDone(quality);
    reveal.appendChild(cont);
    speak(card.say||card.w);
  }
  checkBtn.onclick=()=>{
    if(finished||!listened)return;
    attempts++;
    if(currentGuess()===String(card.w||'').toLowerCase()){
      finished=true;lockAll();
      res.className='result oktext';res.textContent='拼對了。';
      const q=attempts<=1?'good':'hard';
      setTimeout(()=>onDone(q),50);
    }else if(attempts>=2){
      doReveal('again');
    }else{
      res.className='result failtext';res.textContent='拼錯了，再試一次。';
      inputs.forEach(i=>i.value='');if(inputs[0])inputs[0].focus();
    }
  };
  idkBtn.onclick=()=>{if(!finished)doReveal('again')};
}

/* ---- 新字「認識」階段：先聽，再跟著唸一次，唸對才能進拼寫 ---- */
function renderRecognizeStage(host,card,onPass,isCore){
  const box=mkEl('div','item');
  const labelDiv=mkEl('div','label','新字');
  appendCoreBadge(labelDiv,isCore);
  box.appendChild(labelDiv);
  const sent=mkEl('div','sentence');
  sent.innerHTML='<strong>'+esc(card.w)+'</strong>'+(card.pos?' <span class="pos">'+esc(card.pos)+'</span>':'')+
    '　<span class="note">'+esc(card.zh||'')+'</span>';
  box.appendChild(sent);
  const listenBtn=mkEl('button','btn','🔊 聽');listenBtn.id='nw-listen';
  const startBtn=mkEl('button','btn ok','跟著唸');startBtn.id='nw-start';startBtn.disabled=true;
  const stopBtn=mkEl('button','btn warn','停止');stopBtn.id='nw-stop';stopBtn.disabled=true;
  const out=mkEl('div','heard');out.id='nw-out';
  const res=mkEl('div','result');res.id='nw-res';
  const skipBtn=mkEl('button','btn alt','跳過（辨識不良）');skipBtn.id='nw-skip';skipBtn.style.display='none';
  listenBtn.onclick=()=>{speak(card.say||card.w);startBtn.disabled=false};
  let fails=0,done=false;
  startBtn.onclick=()=>{
    rec('nw',t=>{
      out.textContent='聽到：'+(t||'(沒收到聲音)');
      if(done)return;
      if(wordOk(card.w,t)){
        done=true;res.className='result oktext';res.textContent='唸對了。';
        startBtn.disabled=true;onPass();
      }else{
        fails++;
        res.className='result failtext';res.textContent='再聽一次，把整個字唸清楚。';
        if(fails>=3)skipBtn.style.display='inline-block';
      }
    });
  };
  skipBtn.onclick=()=>{if(!done){done=true;onPass()}};
  box.appendChild(listenBtn);box.appendChild(startBtn);box.appendChild(stopBtn);
  box.appendChild(out);box.appendChild(res);box.appendChild(skipBtn);
  host.appendChild(box);
}

/* ---- 卡片查找 / 建立 ---- */
function findLadderMeta(w){
  const ladder=(DATA.bank&&DATA.bank.ladder)||[];
  for(let i=0;i<ladder.length;i++)if(normKey(ladder[i].w)===normKey(w))return ladder[i];
  return null;
}
function newCardFor(meta){
  return {w:meta.w,zh:meta.zh||'',pos:meta.pos||'',mask:meta.mask||null,say:meta.say||meta.w,
    lesson:DATA.lesson,due:0,stability:0,difficulty:0,reps:0,lapses:0,last:0,leech:false,notified:false};
}
function saveCard(card){
  const db=fsrsDb();db[normKey(card.w)]=card;
  try{VocabSRS._test.saveDB(db)}catch(e){}
}

/* ---- 主流程：一次只顯示一張卡，做完才出下一張 ---- */
function renderNext(){
  updateProgress();
  while(idx<STATE.queue.length&&STATE.completed[idx])idx++;
  if(idx>=STATE.queue.length){finish();return}
  const item=STATE.queue[idx];
  if(item.type==='new'&&STATE.newQuotaUsed>=8){
    // 新字額度用完：這張新字今天不再出，直接跳過（複習卡不受此限制）
    STATE.completed[idx]=true;saveState();idx++;renderNext();return;
  }
  if(item.type==='review')renderReview(item);
  else renderNewWord(item);
}

function renderReview(item){
  const db=fsrsDb(),card=db[normKey(item.w)];
  const host=clearHost();
  if(!card){STATE.completed[idx]=true;saveState();idx++;renderNext();return}
  const core=isCoreWord(item.w);
  renderSpellStage(host,card,function(quality){
    const fresh=fsrsDb(),key=normKey(card.w),stored=fresh[key]||card;
    try{VocabSRS._test.applyReview(stored,quality,{setLesson:false})}catch(e){}
    fresh[key]=stored;try{VocabSRS._test.saveDB(fresh)}catch(e){}
    STATE.reviewDone++;
    if(stored.leech)STATE.leechDone++;
    STATE.completed[idx]=true;saveState();
    idx++;renderNext();
  },core);
}

function renderNewWord(item){
  const meta=findLadderMeta(item.w);
  const host=clearHost();
  if(!meta){STATE.completed[idx]=true;saveState();idx++;renderNext();return}
  const card=newCardFor(meta);
  const core=isCoreWord(item.w);
  renderRecognizeStage(host,card,function(){
    const host2=clearHost();
    renderSpellStage(host2,card,function(quality){
      if(quality!=='good')STATE.newQuotaUsed++;
      try{VocabSRS._test.applyReview(card,quality,{setLesson:false})}catch(e){}
      saveCard(card);
      STATE.newDone++;
      if(card.leech)STATE.leechDone++;
      STATE.completed[idx]=true;saveState();
      idx++;renderNext();
    },core);
  },core);
}

function finish(){
  if(!STATE.notifiedComplete){
    STATE.notifiedComplete=true;saveState();
    tg(DATA.child+' 完成每日單字：複習 '+STATE.reviewDone+' 張、新字 '+STATE.newDone+
      ' 個、難字 '+STATE.leechDone+' 張');
  }
  updateProgress();
  const host=clearHost();
  const box=mkEl('div','item done');box.id='finish-box';
  let nxt='';try{const db=fsrsDb(),now=Date.now();
    const fut=Object.keys(db).map(k=>db[k].due).filter(d=>typeof d==='number'&&d>now);
    if(fut.length){const d=new Date(Math.min.apply(null,fut));nxt='<br>下次複習：'+(d.getMonth()+1)+'/'+d.getDate()}}catch(e){}
  box.innerHTML='<div class="sentence">今日完成！複習 '+STATE.reviewDone+' 張、新字 '+
    STATE.newDone+' 個、難字 '+STATE.leechDone+' 張'+nxt+'</div>'+
    '<a class="btn alt" style="text-decoration:none" href="nanyi-b1-l1.html">📖 去做課次練習</a>';
  host.appendChild(box);
}

function init(){
  STATE=loadState();
  if(STATE.queue.length>0&&!STATE.notifiedStart){
    STATE.notifiedStart=true;
    tg(DATA.child+' 開始每日單字');
  }
  saveState();
  idx=0;
  renderNext();
}
init();

</script></body></html>
