<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>麥克風診斷</title>
<style>body{font-family:-apple-system,"Noto Sans TC",sans-serif;padding:16px;line-height:1.6}
button{font-size:1.1rem;padding:12px 18px;margin:6px 6px 6px 0;border-radius:8px;border:0;background:#0f7c90;color:#fff}
#log{white-space:pre-wrap;background:#f3f5f7;border-radius:8px;padding:10px;font-size:.9rem;margin-top:12px;min-height:8em}</style></head><body>
<h2>🎤 麥克風診斷頁</h2>
<div id="env"></div>
<button onclick="tts()">1️⃣ 聽（TTS 測試）</button>
<button id="go" onclick="mic()">2️⃣ 開始唸（辨識測試）</button>
<button id="st" onclick="stopRec()" disabled>停止</button>
<div id="log"></div>
<script>
function L(t){document.getElementById('log').textContent+=t+'\n'}
window.onerror=function(m,s,l){L('[JS錯誤] '+m+' :'+l)};
var SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
document.getElementById('env').innerHTML='辨識支援：<b>'+(SRC?'有':'❌ 無（可能是 LINE/Telegram 內建瀏覽器）')+'</b>｜TTS 聲音數：<b id="vc">?</b><br>UA：<span style="font-size:.75rem">'+navigator.userAgent+'</span>';
function vc(){document.getElementById('vc').textContent=speechSynthesis.getVoices().length}
speechSynthesis.onvoiceschanged=vc;vc();
function tts(){var u=new SpeechSynthesisUtterance('Hello, this is a test.');u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u);L('TTS 播放中…有聽到聲音嗎？')}
var r=null;
function mic(){if(!SRC){L('此環境不支援辨識');return}
 r=new SRC();r.lang='en-US';r.continuous=true;r.interimResults=true;
 r.onstart=function(){L('▶ 辨識已啟動（onstart）')};
 r.onaudiostart=function(){L('🎙 收到音訊流（onaudiostart）')};
 r.onspeechstart=function(){L('🗣 偵測到說話（onspeechstart）')};
 r.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)L((e.results[i].isFinal?'✅ 定稿：':'…暫定：')+e.results[i][0].transcript)};
 r.onerror=function(e){L('❌ onerror: '+e.error)};
 r.onend=function(){L('⏹ 辨識結束（onend）');document.getElementById('go').disabled=false;document.getElementById('st').disabled=true};
 document.getElementById('go').disabled=true;document.getElementById('st').disabled=false;
 L('--- 開始，請說 hello ---');try{r.start()}catch(e){L('start() 丟例外: '+e)}}
function stopRec(){try{r.stop()}catch(e){}}
</script></body></html>
