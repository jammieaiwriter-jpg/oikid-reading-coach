<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>校內考試線｜範圍卷組裝器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans TC",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 100px}
.hero{background:#1864ab;color:#fff;border-radius:10px;padding:20px;margin-bottom:14px}
.hero h1{font-size:1.4rem;margin:6px 0 4px}
.hero p{margin:6px 0 0;color:#d0ebff;font-size:.9rem;line-height:1.6}
.card{background:#fff;border:1px solid #d9e2ec;border-radius:10px;padding:16px;margin:12px 0}
label{display:block;font-weight:850;margin:12px 0 6px;color:#334}
select{width:100%;padding:11px;border:1.5px solid #bcccdc;border-radius:8px;font-size:1rem;font-weight:700;background:#fff}
.row2{display:flex;gap:10px}
.row2>div{flex:1}
.btn{border:0;border-radius:9px;padding:13px 18px;font-weight:900;cursor:pointer;background:#1864ab;color:#fff;font-size:1.02rem;width:100%;margin-top:14px}
.btn.sec{background:#495057}
.btn.warn{background:#e8590c}
.btn:disabled{opacity:.5;cursor:default}
.sect{background:#fff;border:1px solid #d9e2ec;border-radius:10px;margin:14px 0;overflow:hidden}
.sect>.head{padding:11px 16px;font-weight:900;color:#fff;background:#1864ab;display:flex;justify-content:space-between}
.q{border-bottom:1px solid #eef1f5;padding:14px 16px}
.q:last-child{border-bottom:0}
.stem{font-weight:850;margin-bottom:10px;line-height:1.6}
.qno{color:#1864ab;font-weight:900;margin-right:6px}
.opt{display:flex;align-items:center;gap:9px;border:1.5px solid #bcccdc;background:#fff;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;margin:7px 0}
.opt input{width:17px;height:17px;flex:none}
.opt.correct{background:#e6fcf5;border-color:#2f9e44}
.opt.wrong{background:#fff0f0;border-color:#e03131}
.opt.chosen-ok{background:#e6fcf5;border-color:#2f9e44}
.opt.chosen-no{background:#fff0f0;border-color:#e03131}
.article{background:#f8fafc;border:1px solid #d9e2ec;border-radius:8px;padding:12px 14px;margin:0 16px 6px;font-size:.95rem;line-height:1.8}
.article h3{margin:0 0 8px;color:#1864ab}
.playbar{padding:0 16px 8px}
audio{width:100%}
.expl{font-size:.85rem;color:#52606d;margin-top:8px;background:#f8f9fa;border-radius:7px;padding:8px 10px;line-height:1.6}
.scoreboard{text-align:center;padding:10px 0 4px}
.scoreboard .big{font-size:2.6rem;font-weight:900;color:#1864ab}
.subs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.subs>div{background:#eef4ff;border-radius:8px;padding:8px 12px;font-weight:800;font-size:.88rem;color:#234}
.hidden{display:none !important}
.note{font-size:.8rem;color:#52606d;margin-top:10px;line-height:1.6}
.tag{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;background:#495057;border-radius:5px;padding:2px 7px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">

  <div id="view-setup">
    <div class="hero">
      <h1>📝 範圍卷組裝器</h1>
      <p>選版本＋課次範圍，一鍵生成週考／段考模擬卷。單字10＋文法10＋閱讀5＋聽力4，共29題。</p>
    </div>
    <div class="card">
      <label>選版本</label>
      <select id="pubSel"></select>
      <label>課次範圍（B1）</label>
      <div class="row2">
        <div><select id="fromSel"></select></div>
        <div><select id="toSel"></select></div>
      </div>
      <button class="btn" id="genBtn">🚀 生成範圍卷</button>
      <div class="note" id="setupNote"></div>
    </div>
  </div>

  <div id="view-exam" class="hidden">
    <div class="hero">
      <h1>✏️ 作答中</h1>
      <p id="examMeta"></p>
    </div>
    <div id="examBody"></div>
    <button class="btn" id="submitBtn">✅ 交卷</button>
  </div>

  <div id="view-result" class="hidden">
    <div class="hero">
      <h1>📊 成績單</h1>
      <p id="resultMeta"></p>
    </div>
    <div class="card scoreboard">
      <div class="big" id="scoreTotal">0 / 29</div>
      <div class="subs" id="scoreSubs"></div>
    </div>
    <div id="resultBody"></div>
    <button class="btn" id="retryBtn">🔁 再考一份（同範圍重抽）</button>
    <button class="btn sec" id="resetBtn">🔧 重新設定版本／範圍</button>
  </div>

</div>

01-024-face32d4","grammarPointId":"GP-11","grammarPointName":"There be 存在句","stem":"There ___ a teacher in the library.","options":["has","be","are","is"],"answer":"D","explanation":"There be 的 be 要跟「後面」的名詞一致：「teacher」是單數，所以用 There is（中文的「有」不能直接翻成 have）。"}]}},"articles":{"nanyi":{"1":[{"id":"nanyi-b1-l1-convenience-store-helper","title":"A Big Helper at the Convenience Store","paras":["Today is Saturday. Leo is at his uncle's convenience store. He wears a blue apron and a big smile. His uncle is the owner, and Leo helps him every week.","The store is small but very busy. The shelves are full of snacks, drinks, and bread. Leo's job is easy. He cleans the shelves and puts new boxes of milk in the fridge.","A young girl comes to Leo. She is thirsty, but her money is only a few coins. Leo counts the coins with her. \"You have enough,\" he says with a kind smile.","Two boys are near the door. They are noisy and a little dirty from soccer practice. One boy's shirt is brown with mud. They are hungry, so they get some fruit and bread.","At three o'clock, an old man comes in. He is Leo's favorite customer. He always brings a picture of his dog. The dog's name is Bo, and Bo is very strong and young.","\"This is a new photo,\" the man says. \"Bo gets a prize today. He is the winner of a dog show!\" Leo is happy for Bo, and he gives the man a free cookie.","Near closing time, Leo's uncle checks the shelves. \"You are a great helper,\" he says. Leo smiles. He likes this job, and he likes the nice people at the small store."],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"A boy helps at his uncle's store.","options":["A boy helps at his uncle's store.","A boy buys a new bike.","A boy plays soccer with friends."]},{"qtype":"細節","q":"What is Leo's job at the store?","answer":"He cleans the shelves and puts milk in the fridge.","options":["He cleans the shelves and puts milk in the fridge.","He cooks food for customers.","He drives a truck to the store."]},{"qtype":"細節","q":"Why do the two boys get fruit and bread?","answer":"They are hungry after soccer practice.","options":["They are hungry after soccer practice.","They want a prize.","They are Leo's cousins."]},{"qtype":"推論","q":"How does Leo probably feel about his job?","answer":"He enjoys it and likes the customers.","options":["He enjoys it and likes the customers.","He feels bored and tired.","He wants to quit soon."]},{"qtype":"字義猜測","q":"In the story, \"fridge\" most likely means:","answer":"a machine that keeps food cold","options":["a machine that keeps food cold","a box for old newspapers","a small chair"]}]},{"id":"nanyi-b1-l1-formosan-macaque","title":"The Formosan Macaque","paras":["Taiwan has many kinds of animals. One special animal is the Formosan macaque. It is a small monkey, and it lives in the mountains and forests of Taiwan.","This monkey is hairy and brown. Its face is pink, and its tail is long. Baby monkeys are cute, but big monkeys are strong.","The Formosan monkey lives in big groups. A group can have twenty or more monkeys. They are not lonely animals; they like to stay with their family.","These monkeys eat fruit, leaves, and small bugs like ants. Sometimes they go to farms and take fruit from the trees. Farmers are not happy about this!","You can see a monkey footprint near a river or a path in the forest. If you see this animal, do not feed it. Wild monkeys are strong, and they can be a little dangerous.","This monkey is a famous animal for people who love nature. It is also a part of Taiwan's forests. This little monkey is a big treasure for the island!","Long ago, hunters hurt many of these monkeys. Now the law protects this animal, so people must not hunt it. Today, more and more monkeys live in the mountains again.","Many mountain paths in Taiwan have signs about this monkey. The signs say, \"Please do not feed the monkeys.\" This rule helps keep both people and monkeys safe and happy."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"The Formosan macaque, a special animal in Taiwan.","options":["The Formosan macaque, a special animal in Taiwan.","A new zoo in Taipei.","How to keep a pet monkey."]},{"qtype":"細節","q":"Where does the Formosan macaque live?","answer":"In the mountains and forests.","options":["In the mountains and forests.","In the city parks.","Near the beach."]},{"qtype":"細節","q":"What do these monkeys eat?","answer":"Fruit, leaves, and small bugs.","options":["Fruit, leaves, and small bugs.","Fish and bread.","Rice and noodles."]},{"qtype":"推論","q":"Why are farmers not happy about the monkeys?","answer":"Because the monkeys take fruit from their farms.","options":["Because the monkeys take fruit from their farms.","Because the monkeys are too loud.","Because the monkeys are dirty."]},{"qtype":"字義猜測","q":"In the passage, \"treasure\" most likely means:","answer":"something very special and valuable","options":["something very special and valuable","a kind of food","a type of forest"]}]},{"id":"nanyi-b1-l1-lost-puppy","title":"The Little Lost Dog","paras":["It is a sunny afternoon. Mia and her brother Ray are on their way home from school. Near the park, they see a small dog. The dog is brown and a little dirty.","The dog is alone, and it looks scared. It is young, maybe just a few months old. Its ears are big, and its tail is short. The dog is hungry and thirsty, too.","\"This is not our dog,\" Ray says. \"But it is so cute!\" Mia opens her bag. She has one apple and some bread. She gives the bread to the little dog.","The dog eats fast. Then it is calm and friendly. Mia checks its neck. A small tag is there, but the words are hard to read. The name on the tag is Coco.","\"Coco is a nice name,\" Ray says. He is not angry now, only worried. \"Its owner is probably very sad. We are good kids, so we help lost animals.\"","Mia and Ray walk to the police station near the park. Two officers are friendly and kind. \"This dog is not dirty inside, just outside,\" one officer says with a smile.","Later that day, a woman comes to the station. She is Coco's owner, and she is so happy! \"Thank you,\" she says. \"You two are real winners today.\" Mia and Ray are proud."],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"Two kids help a lost dog find its owner.","options":["Two kids help a lost dog find its owner.","Two kids buy a new puppy.","Two kids play with their own dog."]},{"qtype":"細節","q":"What does Mia give the dog first?","answer":"Some bread.","options":["Some bread.","An apple.","Some milk."]},{"qtype":"細節","q":"Where do Mia and Ray take the dog?","answer":"To the police station.","options":["To the police station.","To a pet shop.","To their school."]},{"qtype":"推論","q":"How does Ray probably feel about the dog?","answer":"He cares about the dog and wants to help.","options":["He cares about the dog and wants to help.","He is afraid of the dog.","He does not like animals."]},{"qtype":"字義猜測","q":"In the story, \"tag\" most likely means:","answer":"a small card with information","options":["a small card with information","a kind of food","a type of game"]}]},{"id":"nanyi-b1-l1-lunchtime-picture-book","title":"A Book at Lunchtime","paras":["Owen: Hi, Leo. Is that a new book?","Leo: Yes, it is. This book is about zoo animals. Look, this page is about a lion.","Owen: Wow, the lion is so strong! Its hair is brown and hairy.","Leo: And that page is about a zebra. Zebras are black and white, not brown.","Owen: I like this picture. Is this animal a goat or a sheep?","Leo: It is a goat. Goats are strong, and they are not shy.","Owen: This hippo is so big! Its footprint is really huge.","Leo: Yes, it is! My favorite animal is the elephant. Elephants are big, but they are gentle.","Owen: These monkeys are funny. Are they angry in this picture?","Leo: No, they are not angry. They are just hungry for fruit!","Owen: This book is great. Can I borrow it after lunch?","Leo: Sure! Do you want to read about frogs and geese, too?","Owen: Yes, I do! Animal books are my favorite."],"reading":[{"qtype":"主旨","q":"What are Owen and Leo doing?","answer":"Looking at a picture book about zoo animals.","options":["Looking at a picture book about zoo animals.","Playing a video game.","Doing their math homework."]},{"qtype":"細節","q":"What color is the zebra?","answer":"Black and white.","options":["Black and white.","Brown and hairy.","Pink and gray."]},{"qtype":"細節","q":"What is Leo's favorite animal?","answer":"The elephant.","options":["The elephant.","The lion.","The hippo."]},{"qtype":"推論","q":"Why are the monkeys not angry in the picture?","answer":"Because they are just hungry for fruit.","options":["Because they are just hungry for fruit.","Because they are asleep.","Because they are playing games."]},{"qtype":"字義猜測","q":"In the dialog, \"gentle\" most likely describes an animal that is:","answer":"kind and not scary","options":["kind and not scary","very fast","very hungry"]}]}],"2":[{"id":"nanyi-b1-l2-bulletin-board-email","title":"An E-mail About the Bulletin Board","paras":["To: Leo","From: Paul","Subject: A Fun Project on the Bulletin Board","Hi Leo,","How are you? I am at school now. I am standing in front of the bulletin board.","There is a new project on the board. It says, \"Tell us about your favorite famous person!\" The project is due next Friday.","Who is your favorite famous person? My favorite is a founder of a famous company. His idea is really wonderful.","I think you like a famous actress or a famous singer. Am I right? Please write back and tell me.","This project sounds easy and fun. We can work on it together after school tomorrow. Is that OK for you?","Next time, I want to visit your house and start the project early. See you soon!","Your friend,","Paul"],"reading":[{"qtype":"主旨","q":"What is Paul's e-mail mainly about?","answer":"A new project about a favorite famous person.","options":["A new project about a favorite famous person.","A trip to a theme park.","A new bike shop."]},{"qtype":"細節","q":"When is the project due?","answer":"Next Friday.","options":["Next Friday.","Tomorrow.","This weekend."]},{"qtype":"細節","q":"Who is Paul's favorite famous person?","answer":"A founder of a famous company.","options":["A founder of a famous company.","A famous actress.","A famous singer."]},{"qtype":"推論","q":"What does Paul guess about Leo's favorite person?","answer":"That Leo likes a famous actress or singer.","options":["That Leo likes a famous actress or singer.","That Leo likes a famous farmer.","That Leo has no favorite person."]},{"qtype":"字義猜測","q":"In the e-mail, \"project\" most likely means:","answer":"school work you do about one topic","options":["school work you do about one topic","a kind of game","a place to eat lunch"]}]},{"id":"nanyi-b1-l2-library-volunteer","title":"A Quiet Job at the Library","paras":["Every Saturday, Ivy is a helper at the town library. It's a quiet, wonderful place with many books. Ivy's job is easy but important. She puts books back on the right shelf.","\"Where do the cooking books go?\" a new helper asks. \"They're on the second floor, near the window,\" Ivy says with a smile. \"I remember every shelf here. It's like a map in my head.\"","\"What is your favorite book here?\" the boy asks. \"It's a book about the USA,\" Ivy says. \"The pictures are beautiful, and the stories are famous. I read it three times already.\"","An old man comes to the desk. \"Who is the author of this book?\" he asks Ivy. She checks the cover. \"A famous actress writes this one. It's about her family and her life.\"","\"How do I borrow this book?\" a little girl asks. Ivy is friendly and patient. \"It's easy. Give the book to the librarian at the desk, and she gives you a due date.\"","At noon, Ivy's father comes to say hello. \"Why are you always here on Saturdays?\" he asks with a laugh. \"Because I love books, and this place feels like home,\" Ivy says.","Before Ivy leaves, the librarian gives her a small postcard. \"You're a wonderful volunteer,\" she says. Ivy is happy. Her Saturday job is small, but it makes a big difference."],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"A girl volunteers at the library every Saturday.","options":["A girl volunteers at the library every Saturday.","A girl writes a new book.","A girl looks for a lost book."]},{"qtype":"細節","q":"What is Ivy's main job at the library?","answer":"She puts books back on the right shelf.","options":["She puts books back on the right shelf.","She reads stories to little kids.","She cleans the library windows."]},{"qtype":"細節","q":"How does a person borrow a book?","answer":"Give the book to the librarian for a due date.","options":["Give the book to the librarian for a due date.","Take the book home for free forever.","Ask Ivy's father for help."]},{"qtype":"推論","q":"How does Ivy probably feel about her Saturday job?","answer":"She loves it and finds it meaningful.","options":["She loves it and finds it meaningful.","She feels bored every week.","She wants to stop soon."]},{"qtype":"字義猜測","q":"In the story, \"patient\" most likely means:","answer":"able to wait calmly without getting upset","options":["able to wait calmly without getting upset","very fast and busy","loud and angry"]}]},{"id":"nanyi-b1-l2-school-fair-stand","title":"Our Class Stand at the School Fair","paras":["Today is the school fair. Our class has a small food stand near the gym. Nina and Owen are the leaders of our stand. Their job is fun but also busy.","\"What do we sell today?\" a boy asks. \"We sell popcorn and cold drinks,\" Nina says. \"Our stand is famous for cheap prices and friendly service.\" Everyone smiles and gets ready.","\"How much is a bag of popcorn?\" a girl asks. \"It's only twenty dollars,\" Owen says. \"And a drink is fifteen dollars.\" The girl is happy and buys two bags for her family.","\"Who is the founder of this stand idea?\" a teacher asks with a smile. \"It's Nina! She is really creative,\" Owen says. Nina is a little shy, but she is also proud.","\"Where do you get the popcorn machine?\" another teacher asks. \"It's from the school kitchen,\" Nina says. \"Our teacher is very kind. She helps us every day this week.\"","By noon, the line at the stand is very long. Many students and parents wait for popcorn. Nina and Owen work fast. Their hands are tired, but their smiles are big.","\"When is the fair over?\" Owen asks the clock. \"It's four o'clock now, so one more hour!\" At the end, their stand makes the most money. Nina and Owen are the class winners today."],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"A class runs a popcorn stand at the school fair.","options":["A class runs a popcorn stand at the school fair.","A class visits a fair in another city.","A class practices a dance for the fair."]},{"qtype":"細節","q":"What does the class stand sell?","answer":"Popcorn and cold drinks.","options":["Popcorn and cold drinks.","Books and postcards.","Toys and games."]},{"qtype":"細節","q":"Who thinks of the idea for the stand?","answer":"Nina.","options":["Nina.","Owen.","The teacher."]},{"qtype":"推論","q":"How do Nina and Owen probably feel at the end of the day?","answer":"Tired but proud of their hard work.","options":["Tired but proud of their hard work.","Bored and want to go home early.","Angry at their classmates."]},{"qtype":"字義猜測","q":"In the story, \"famous\" most likely means:","answer":"known well by many people","options":["known well by many people","very old and broken","quiet and small"]}]},{"id":"nanyi-b1-l2-theme-park-culture","title":"Why Do People Love Theme Parks?","paras":["Many families like to go to a theme park on the weekend. A theme park is a big place with rides, shows, and cartoon characters.","The USA has some very famous theme parks. Many people know about the parks there, and they are famous around the world.","The founder of a theme park is often a person with a wonderful idea. He or she wants to make a place that is fun for kids and adults.","In a theme park, you can see actors and actresses. They wear costumes and act like cartoon characters. Kids love to take pictures with them.","Some rides are easy and slow. Other rides are fast, and they are not for young kids. A theme park has something for every family member.","People also like to buy postcards and small gifts at a theme park. A postcard with a famous character is a nice thing to send to a friend.","A trip to a theme park is not cheap, but it is a special day. Many kids remember it for a long time. What a wonderful place a theme park is!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Why many families love theme parks.","options":["Why many families love theme parks.","How to become an actress.","The history of the USA."]},{"qtype":"細節","q":"What can you see people wearing in a theme park?","answer":"Costumes of cartoon characters.","options":["Costumes of cartoon characters.","School uniforms.","Winter jackets."]},{"qtype":"細節","q":"What do people often buy at a theme park?","answer":"Postcards and small gifts.","options":["Postcards and small gifts.","New bikes.","Kitchen tools."]},{"qtype":"推論","q":"Why do kids love to take pictures with the actors?","answer":"Because the actors act like famous cartoon characters.","options":["Because the actors act like famous cartoon characters.","Because the actors are their teachers.","Because the pictures are free."]},{"qtype":"字義猜測","q":"In the passage, \"character\" most likely means:","answer":"a person or figure in a story or cartoon","options":["a person or figure in a story or cartoon","a kind of food","a type of ride"]}]}],"3":[{"id":"nanyi-b1-l3-car-wash-fundraiser","title":"A Car Wash for a Good Cause","paras":["Our class has a car wash today. We want money for new sports equipment. Ella and Jack make a big sign. \"Car Wash: 100 dollars. Help our team!\" it says in red letters.","\"Please park your car here,\" Jack tells the first driver. \"Then wait on the bench, and we clean your car in fifteen minutes.\" The man smiles and gives Jack a thumbs up.","\"Bring more water, please!\" Ella calls to her friend. \"Don't forget the soap and the big sponge.\" Everyone works together, and soon the students are wet from head to toe.","\"Let's wash this red car first,\" Jack says. \"Use small circles with the sponge, and don't scratch the paint.\" His friends listen carefully and work with care.","A woman with two kids stops by. \"How much for a big car?\" she asks. \"It's still 100 dollars,\" Ella says with a smile. \"Please pay at the table after we finish.\"","\"Try this bucket of water,\" a boy says to a new helper. \"Just don't waste the water.\" They laugh and work fast. The line of cars gets longer and longer.","By the afternoon, the team collects a lot of money. \"We did it!\" Jack shouts. \"Let's buy the new soccer balls tomorrow!\" Everyone is tired but very proud of their hard work."],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"A class washes cars to raise money for sports equipment.","options":["A class washes cars to raise money for sports equipment.","A class fixes bikes for the neighborhood.","A class sells old books for a school trip."]},{"qtype":"細節","q":"How much does one car wash cost?","answer":"100 dollars.","options":["100 dollars.","50 dollars.","200 dollars."]},{"qtype":"細節","q":"What does Jack tell his friends to be careful about?","answer":"Not to scratch the car's paint.","options":["Not to scratch the car's paint.","Not to waste the soap.","Not to talk to customers."]},{"qtype":"推論","q":"How does the team probably feel at the end of the day?","answer":"Tired but proud of their work.","options":["Tired but proud of their work.","Angry about the hard work.","Bored with the whole day."]},{"qtype":"字義猜測","q":"In the story, \"collects\" most likely means:","answer":"gathers or brings together","options":["gathers or brings together","throws away","hides somewhere"]}]},{"id":"nanyi-b1-l3-halloween-in-taiwan","title":"Halloween Fun in Taiwan","paras":["Halloween is not a Taiwan holiday, but many people in Taiwan like it now. Every October, schools and shops plan Halloween parties and events.","At school, students often wear a costume for the party. Some students dress like animals. Other students dress like a hero from a movie.","Please bring some candy or a small gift to a Halloween party. It is polite to share with everyone at the party.","At the party, students eat and talk with their friends. They also join games. Some games use a bowl, a spoon, or a small ball.","You do not need to invite too many people to a Halloween party. A small party with your close friends can be very fun, too.","Some families in Taiwan use Halloween as a chance for a family night. They try a new dish, like beef noodles or a special dessert, and just enjoy time together.","Some shops and restaurants also join the fun. A shop may put a pumpkin near the door. A restaurant may put a new dish on the menu just for October.","Halloween in Taiwan is not scary. It is more like a fun new tradition. What a fun holiday it is becoming!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"How Halloween has become popular and fun in Taiwan.","options":["How Halloween has become popular and fun in Taiwan.","The history of Taiwan holidays.","How to cook beef noodles."]},{"qtype":"細節","q":"What do many students do at a school Halloween party?","answer":"Wear a costume.","options":["Wear a costume.","Take a big test.","Clean the classroom."]},{"qtype":"細節","q":"What should you bring to a Halloween party, according to the passage?","answer":"Some candy or a small gift.","options":["Some candy or a small gift.","A new backpack.","A big bowl of rice."]},{"qtype":"推論","q":"How does the passage feel about Halloween in Taiwan?","answer":"It sees it as a fun new tradition, not something scary.","options":["It sees it as a fun new tradition, not something scary.","It thinks Halloween is too scary for kids.","It thinks people should not celebrate Halloween."]},{"qtype":"字義猜測","q":"In the passage, \"tradition\" most likely means:","answer":"something people do again and again over time","options":["something people do again and again over time","a kind of food","a school subject"]}]},{"id":"nanyi-b1-l3-recycling-day-planning","title":"Planning at Recycling Day","paras":["Iris: Ted, please put the bottles in this box. It is recycling day.","Ted: OK! Look, I have a plate and a bowl here, too. Are they trash or something we can use again?","Iris: Just put the plate in the box. But keep the bowl. We can use it at the class party.","Ted: Good idea! Let's plan the party now. What do we need?","Iris: We need cups, forks, and spoons. Please bring some from home if you have extra.","Ted: Sure. Should we invite the other class, too?","Iris: Yes, invite everyone! It is more fun with more guys and girls.","Ted: What food do we need? Try to think of something easy.","Iris: Let's get some fruit and maybe beef noodles. Everyone likes noodles.","Ted: Great plan! Use my mom's chopsticks, too. She has many extra ones.","Iris: Perfect. Just tell your family the plan tonight.","Ted: I will! Next time, I want to help plan the whole party from the start."],"reading":[{"qtype":"主旨","q":"What are Iris and Ted mainly doing?","answer":"Sorting recycling and planning a class party.","options":["Sorting recycling and planning a class party.","Doing their math homework.","Cleaning the school garden."]},{"qtype":"細節","q":"What does Iris ask Ted to bring from home?","answer":"Cups, forks, and spoons.","options":["Cups, forks, and spoons.","Chairs and tables.","Books and pens."]},{"qtype":"細節","q":"What food do they plan to have?","answer":"Fruit and beef noodles.","options":["Fruit and beef noodles.","Pizza and cake.","Sandwiches and juice."]},{"qtype":"推論","q":"Why does Iris want to invite the other class?","answer":"Because the party is more fun with more people.","options":["Because the party is more fun with more people.","Because their class is too small.","Because the teacher told her to."]},{"qtype":"字義猜測","q":"In the dialog, \"extra\" most likely means:","answer":"more than what is needed","options":["more than what is needed","very old","very small"]}]},{"id":"nanyi-b1-l3-used-book-swap","title":"Book Swap Day at Our School","paras":["Today is Book Swap Day at our school. Every student brings old books from home. Kate and Sam put their books on a long table in the yard. It's a fun and busy morning.","\"Please put your name on the paper inside your book,\" the teacher says. \"Then bring three or four books to the table.\" Kate brings five books, and Sam brings only two.","\"Look at this comic book!\" Sam says. \"Can I try it?\" \"Sure, just use one point for each book,\" Kate says. \"Don't worry, everyone gets a chance to choose new books.\"","\"What's your plan for today?\" Sam asks Kate. \"I want a book about space,\" Kate says. \"Let's look at the science table first, and then we can check the story books.\"","A boy named Ray brings a big box of comics. \"Please don't push,\" he says with a laugh. \"There are enough books for everyone. Take your time and choose carefully.\"","At the food table, students bring snacks to share. \"Try this fruit,\" a girl says. \"It's really delicious.\" Everyone talks and eats together. The yard is full of happy voices.","By noon, Kate has a new book about space, and Sam has two comic books. \"This is the best day,\" Sam says. \"Let's do Book Swap Day again next year!\""],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"Students trade old books at a school event.","options":["Students trade old books at a school event.","Students clean their classroom together.","Students plan a class trip."]},{"qtype":"細節","q":"How many books does Sam bring?","answer":"Two.","options":["Two.","Five.","Four."]},{"qtype":"細節","q":"What does Kate get in the end?","answer":"A new book about space.","options":["A new book about space.","Two comic books.","A box of snacks."]},{"qtype":"推論","q":"How do the students probably feel about Book Swap Day?","answer":"They enjoy it and want to do it again.","options":["They enjoy it and want to do it again.","They feel bored and tired.","They think it is too crowded to enjoy."]},{"qtype":"字義猜測","q":"In the story, \"swap\" most likely means:","answer":"to trade one thing for another","options":["to trade one thing for another","to throw something away","to read very quickly"]}]}],"4":[{"id":"nanyi-b1-l4-a-day-on-the-bus","title":"A Busy Day on the Number 5 Bus","paras":["Every morning, there is a school bus near Ken's house. It's the number 5 bus, and it's always full of students. Ken sits near the window and watches the busy street.","\"There are new seats on this bus,\" a girl says to Ken. \"And there is a new driver, too.\" The driver is friendly. He says hello to every student by name.","\"There isn't much space near the door,\" Ken says. \"But there is an empty seat at the back.\" He walks carefully to the back seat and sits down with his bag.","At the next stop, there are many people waiting. An old woman gets on the bus. \"Please take my seat,\" Ken says. \"There's more space here.\" The woman smiles and says thank you.","\"There is a big park near the third stop,\" the girl tells Ken. \"I see dogs and kids there every day.\" Ken looks out the window and sees a family with a small dog.","\"There are traffic jams near the bridge sometimes,\" the driver says. \"So please don't worry if we are a little late today.\" The bus moves slowly but safely through the busy street.","When the bus stops near the school, Ken says goodbye to the driver. \"There's always something interesting on this bus,\" he thinks. \"I like this short trip every morning.\""],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"Ken's morning bus ride to school.","options":["Ken's morning bus ride to school.","Ken's first day at a new school.","Ken's trip to the park with his family."]},{"qtype":"細節","q":"What does Ken do for the old woman?","answer":"He gives her his seat.","options":["He gives her his seat.","He helps her with her bag.","He talks to the driver for her."]},{"qtype":"細節","q":"What is near the third bus stop?","answer":"A big park.","options":["A big park.","A bridge.","A school."]},{"qtype":"推論","q":"How does Ken probably feel about the bus ride?","answer":"He enjoys it and finds it interesting.","options":["He enjoys it and finds it interesting.","He feels bored every day.","He is afraid of the bus."]},{"qtype":"字義猜測","q":"In the story, \"empty\" most likely means:","answer":"with nobody or nothing in it","options":["with nobody or nothing in it","very colorful and bright","broken and old"]}]},{"id":"nanyi-b1-l4-class-garden","title":"Our Small Garden Behind the School","paras":["Behind our school, there is a small garden. Our class plants vegetables there every spring. Tina and Owen check the garden every morning before class. It's their favorite job of the week.","\"There are three rows of tomatoes near the fence,\" Tina says. \"And there is a row of carrots between the tomatoes and the wall.\" The garden is colorful and full of life.","\"Please water the plants first,\" the teacher says. \"Then pull the weeds near the small plants.\" Owen carries a bottle of water, and Tina uses a small tool for the weeds.","\"There isn't much rain this week,\" Owen says. \"So the plants are a little dry.\" He waters the tomatoes carefully. The soil turns from light brown to dark brown.","\"Look at this baby tomato!\" Tina calls. \"It's so small and green now.\" Owen smiles. \"In one month, there will be many red tomatoes here. We can share them with our class.\"","There is a bee near the flowers, but nobody is afraid. \"Bees are our garden's little helpers,\" the teacher says. \"They help the flowers grow into fruit and vegetables.\"","At the end of the class, there are happy smiles everywhere. \"This garden is hard work, but it's also fun,\" Tina says. \"I can't wait to see the tomatoes next month.\""],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"A class takes care of a small garden at school.","options":["A class takes care of a small garden at school.","A class studies plants in a science book.","A class visits a large farm."]},{"qtype":"細節","q":"What two vegetables are in the garden?","answer":"Tomatoes and carrots.","options":["Tomatoes and carrots.","Potatoes and corn.","Peppers and onions."]},{"qtype":"細節","q":"What do the students do before pulling weeds?","answer":"They water the plants first.","options":["They water the plants first.","They plant new seeds.","They clean the tools."]},{"qtype":"推論","q":"How do Tina and Owen probably feel about the garden work?","answer":"They find it hard but enjoyable.","options":["They find it hard but enjoyable.","They think it is boring and useless.","They want a teacher to do it instead."]},{"qtype":"字義猜測","q":"In the story, \"weeds\" most likely means:","answer":"unwanted small plants growing in the garden","options":["unwanted small plants growing in the garden","a kind of garden tool","a type of red flower"]}]},{"id":"nanyi-b1-l4-thanksgiving-invite-email","title":"An E-mail Near the Water Fountain","paras":["To: Zoe","From: Hank","Subject: Come to My House for Thanksgiving","Hi Zoe,","I am writing this near the water fountain at school. My hand is a little wet, sorry!","My family wants to have a Thanksgiving dinner. Can you come to my house this Thursday?","There is a big dining room in my house. Between the kitchen and the living room, there is a long table for our family and friends.","There is also a small garden behind the house. My dog loves to play there.","My mom is hard-working. She is busy in the kitchen every Thanksgiving. There will be turkey, bread, and a lot of other food.","Please bring a small gift if you can, but it is not a rule. Just come and have fun with us!","Next time, I want to cheer for our team at a game with you, too. See you Thursday!","Your friend,","Hank"],"reading":[{"qtype":"主旨","q":"What is Hank's e-mail mainly about?","answer":"Inviting Zoe to a Thanksgiving dinner at his house.","options":["Inviting Zoe to a Thanksgiving dinner at his house.","Asking Zoe for help with homework.","Telling Zoe about a new pet."]},{"qtype":"細節","q":"Where is the long table in Hank's house?","answer":"Between the kitchen and the living room.","options":["Between the kitchen and the living room.","Behind the garage.","Inside the bedroom."]},{"qtype":"細節","q":"What does Hank say his mom is doing?","answer":"Working hard in the kitchen.","options":["Working hard in the kitchen.","Watching TV in the living room.","Sleeping in her bedroom."]},{"qtype":"推論","q":"Is bringing a gift a strict rule for Zoe?","answer":"No, it is not a rule.","options":["No, it is not a rule.","Yes, she must bring a big gift.","Yes, or she cannot come."]},{"qtype":"字義猜測","q":"In the e-mail, \"fountain\" most likely means:","answer":"a place with water for drinking","options":["a place with water for drinking","a kind of chair","a kind of food"]}]},{"id":"nanyi-b1-l4-why-pandas-are-loved","title":"Why Do People Love Pandas?","paras":["The panda is one of the most popular animals in the world. Many kids love this black-and-white animal, and zoos are always busy on panda days.","There is a garden area for pandas in many zoos. Inside, there are trees, water, and lots of bamboo for the pandas to eat.","A panda eats bamboo almost all day. It is not a small animal, so it needs a lot of food. Some pandas eat bamboo for twelve hours a day!","Pandas are not really lazy animals, but they do not need to hunt for food like other animals. They just sit near the bamboo and eat.","Between naps, a panda is sometimes hard-working. It climbs trees and plays with other pandas. Baby pandas are small and love to roll on the grass.","People think pandas look kind and gentle. This is one reason so many people love this animal. A panda is also a symbol of love between countries.","There is a panda area near the entrance in many zoos, so it is often the first animal families see. What a lucky animal the panda is!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Why pandas are such a popular and loved animal.","options":["Why pandas are such a popular and loved animal.","How to build a zoo.","The life of a farmer."]},{"qtype":"細節","q":"What do pandas mostly eat?","answer":"Bamboo.","options":["Bamboo.","Fish.","Fruit."]},{"qtype":"細節","q":"What do baby pandas love to do?","answer":"Roll on the grass.","options":["Roll on the grass.","Climb tall buildings.","Swim in the pool."]},{"qtype":"推論","q":"Why does the passage say pandas are not really lazy?","answer":"Because they still climb trees and play sometimes.","options":["Because they still climb trees and play sometimes.","Because they run very fast.","Because they never sleep."]},{"qtype":"字義猜測","q":"In the passage, \"entrance\" most likely means:","answer":"the place where you go in","options":["the place where you go in","a kind of food","a big tree"]}]}],"5":[{"id":"nanyi-b1-l5-amusement-park-day","title":"A Fun Day at the Amusement Park","paras":["Today, Ruby and her aunt are enjoying a day at the amusement park. There are many rides here, and people all around are laughing and talking. Ruby is holding a park map and a camera.","\"Look, some kids are waiting for the little train,\" Ruby says. \"And over there, more people are waiting for the big wheel.\" Her aunt is laughing and watching the colorful park.","\"Are you enjoying the rides so far?\" her aunt asks. \"Yes! I'm enjoying so much fun,\" Ruby says. \"This is my favorite day this year.\" They walk to the next ride together.","Near the lake, some people are eating a picnic on the grass. Kids are feeding ducks by the water. \"That looks peaceful,\" Ruby's aunt says. \"Let's take a break there later.\"","\"I'm feeling hungry now,\" Ruby says. They walk to a small shop and buy snacks. \"This popcorn is delicious,\" Ruby's aunt says. \"Are you trying the ice cream too?\" \"Yes, please!\" Ruby laughs.","In the afternoon, Ruby is holding a camera for a selfie near the big wheel. Her aunt is picking a nice postcard from a small shop. \"This picture is beautiful,\" Ruby says, showing her aunt the photo.","As the sun sets, the lights in the park are turning on. \"I'm enjoying this whole day,\" Ruby says. \"Me too,\" her aunt says. \"Let's come back here again next summer.\""],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"Ruby and her aunt spend a fun day at an amusement park.","options":["Ruby and her aunt spend a fun day at an amusement park.","Ruby is planning a party at home.","Ruby is studying for a big test."]},{"qtype":"細節","q":"What are the kids doing near the lake?","answer":"Feeding ducks by the water.","options":["Feeding ducks by the water.","Riding the little train.","Buying postcards."]},{"qtype":"細節","q":"What is Ruby's aunt choosing near the end of the day?","answer":"A nice postcard.","options":["A nice postcard.","A new camera.","A big wheel ticket."]},{"qtype":"推論","q":"How does Ruby probably feel about the day?","answer":"She is having a wonderful, happy time.","options":["She is having a wonderful, happy time.","She is tired and wants to go home.","She is bored with the rides."]},{"qtype":"字義猜測","q":"In the story, \"peaceful\" most likely means:","answer":"calm and quiet","options":["calm and quiet","loud and crowded","fast and exciting"]}]},{"id":"nanyi-b1-l5-night-market-culture","title":"Taiwan's Night Market Fun","paras":["The night market is a special part of life in Taiwan. Many families are enjoying dinner or a snack there almost every night.","At a night market, many small shops are selling food side by side. People are walking, talking, and looking for something delicious to try.","You can find many kinds of food. Some people like a hot snack, and other people like a sweet drink. Many kids also enjoy playing simple games.","A night market is not only about food. Some people are taking photos or a selfie near colorful lights. It is a fun place for art and people-watching, too.","Many tourists visit a night market when they come to Taiwan. They are trying local snacks and taking pictures for their family back home.","A night market can also feel like a big outdoor picnic with many people. It is busy, sunny in the daytime, and full of joy at night.","Going to a night market with family or friends is a happy memory for many Taiwanese kids. Every night market has its own special snack, so there is always something new to try. What a fun place a night market is!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"The fun culture of night markets in Taiwan.","options":["The fun culture of night markets in Taiwan.","How to cook Taiwanese snacks.","A trip to a museum."]},{"qtype":"細節","q":"What are people doing at a night market, according to the passage?","answer":"Walking, talking, and looking for delicious food.","options":["Walking, talking, and looking for delicious food.","Sleeping in their cars.","Reading books quietly."]},{"qtype":"細節","q":"What do many tourists do at a night market?","answer":"Try local snacks and take pictures.","options":["Try local snacks and take pictures.","Buy new bikes.","Watch a movie."]},{"qtype":"推論","q":"Why does the passage compare a night market to a picnic?","answer":"Because it is a busy, happy place with a lot of people and food.","options":["Because it is a busy, happy place with a lot of people and food.","Because it is very quiet and small.","Because you must bring your own food."]},{"qtype":"字義猜測","q":"In the passage, \"colorful\" most likely describes lights that are:","answer":"full of many bright colors","options":["full of many bright colors","very old and broken","black and white"]}]},{"id":"nanyi-b1-l5-riverside-biking","title":"Biking Along the River","paras":["It's Sunday morning, and Owen is going for a bike ride along the river with his father. The sky is blue, and a light wind is blowing. Many people are enjoying the path near the water.","\"Look at that bridge!\" Owen says. \"It's beautiful in the morning light.\" His father rides beside him, and they are both wearing green helmets for safety.","Near the grass, some families are enjoying a picnic. Kids are feeding birds by the water. \"That family is enjoying their morning too,\" Owen's father says with a smile.","\"Are you feeling tired?\" his father asks. \"Not yet!\" Owen says. \"I'm feeling great today.\" They keep going past the bridge and toward a small park by the river.","A group of joggers is running near the path. \"They are training for a big race,\" Owen's father says. \"Running by the river is popular on sunny mornings like this.\"","At the park, Owen and his father are resting on a bench. \"I'm drinking all my water,\" Owen says, laughing. His father is watching the boats sail on the river.","Before they go home, Owen is standing near the river, looking at the water. \"This is a great morning,\" he says. \"Can we come back here again next Sunday?\""],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"Owen and his father go biking by the river.","options":["Owen and his father go biking by the river.","Owen and his father fix a bike at home.","Owen and his father watch a bike race on TV."]},{"qtype":"細節","q":"What are Owen and his father wearing for safety?","answer":"Green helmets.","options":["Green helmets.","Yellow jackets.","Blue shoes."]},{"qtype":"細節","q":"What are the joggers near the path doing?","answer":"Training for a big race.","options":["Training for a big race.","Feeding the birds.","Riding bikes with friends."]},{"qtype":"推論","q":"How does Owen probably feel about the morning?","answer":"He enjoys it and wants to come back.","options":["He enjoys it and wants to come back.","He feels tired and bored.","He wants to go home early."]},{"qtype":"字義猜測","q":"In the story, \"joggers\" most likely means:","answer":"people who are running for exercise","options":["people who are running for exercise","people who are riding bikes","people who are fishing"]}]},{"id":"nanyi-b1-l5-video-call-at-the-fountain","title":"A Video Call at the Water Fountain","paras":["Gina: Hi, Aunt Ryan! I am standing near the water fountain at school. Can you see me?","Ryan: Yes, I can see you on this video call! Are you drinking water right now?","Gina: No, I am just talking to you. What are you doing?","Ryan: I am painting a picture outside in the meadow. It is so sunny today!","Gina: Wow, is that your artwork? It looks like a bridge and some grass.","Ryan: Yes! Many people are enjoying a picnic near me. Some kids are feeding puppies, too.","Gina: That sounds like joy! Are you taking a selfie with your artwork?","Ryan: I am taking one right now with my camera. I will send it to you.","Gina: Please do! My class is going to the museum tomorrow. We have our tickets already.","Ryan: Nice! Are you going to see any artwork like mine there?","Gina: I hope so! I am also excited to try a snack at the night market after school today.","Ryan: Have fun! I am standing by a shop now, so I need to go. Bye, Gina!","Gina: Bye, Aunt Ryan! I wave to you with a big smile, right here at the water fountain."],"reading":[{"qtype":"主旨","q":"What are Gina and Ryan mainly doing?","answer":"Talking on a video call.","options":["Talking on a video call.","Eating breakfast together.","Shopping at a museum."]},{"qtype":"細節","q":"Where is Aunt Ryan right now?","answer":"Outside in a meadow, painting.","options":["Outside in a meadow, painting.","At a restaurant.","At the night market."]},{"qtype":"細節","q":"What are some people near Ryan doing?","answer":"Enjoying a picnic and feeding puppies.","options":["Enjoying a picnic and feeding puppies.","Riding bikes near a bridge.","Selling snacks at a shop."]},{"qtype":"推論","q":"Why does Gina say \"That sounds like joy\"?","answer":"Because the picnic scene Ryan describes sounds happy and fun.","options":["Because the picnic scene Ryan describes sounds happy and fun.","Because she is bored with the call.","Because she wants to go home."]},{"qtype":"字義猜測","q":"In the dialog, \"wave\" most likely describes:","answer":"moving your hand to say hi or bye","options":["moving your hand to say hi or bye","painting a picture","eating a snack"]}]}],"6":[{"id":"nanyi-b1-l6-aquarium-sleepover","title":"A Night at the Aquarium","paras":["Tonight, Nina's class is sleeping at the aquarium. It's a special event for young students. Nina can see sharks and dolphins through the big glass tank near her sleeping bag.","\"Can we walk through the tunnel now?\" a boy asks. \"Yes, you can,\" the guide says. \"But you can't touch the glass or make loud noise near the animals.\"","In the tunnel, the fish move all around them. \"I can see a shark right above us!\" Nina says. Her friend Ken can't stop smiling. \"This is amazing,\" he says quietly.","\"Some fish here can change color,\" the guide says. \"And some deep-sea animals can even make their own light in the dark water.\" The students listen with wide eyes.","At ten o'clock, the lights in the aquarium turn low. \"You can use your flashlight now,\" the guide says, \"but please stay near your sleeping bag.\" Nina feels safe and excited.","\"Can you hear that sound?\" Ken whispers. \"It's just the water moving,\" Nina says. \"Don't worry, we are safe here. The staff can help us if we need anything.\"","Before Nina falls asleep, she looks at the shark one more time. \"I can't wait to tell my family about tonight,\" she thinks. \"This is the best night ever.\""],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"Nina's class has a sleepover at the aquarium.","options":["Nina's class has a sleepover at the aquarium.","Nina's class visits a zoo for a day trip.","Nina's class watches a movie about the sea."]},{"qtype":"細節","q":"What can't the students do near the animals?","answer":"Touch the glass or make loud noise.","options":["Touch the glass or make loud noise.","Take pictures with a camera.","Walk through the tunnel."]},{"qtype":"細節","q":"What can the students use after the lights turn low?","answer":"Their flashlights.","options":["Their flashlights.","Their phones.","Their cameras."]},{"qtype":"推論","q":"How does Nina probably feel about the night?","answer":"Excited and happy about the special event.","options":["Excited and happy about the special event.","Bored and sleepy the whole time.","Scared and wanting to go home."]},{"qtype":"字義猜測","q":"In the story, \"amazing\" most likely means:","answer":"very wonderful and surprising","options":["very wonderful and surprising","very boring and slow","very dark and scary"]}]},{"id":"nanyi-b1-l6-noodle-stall-text-message","title":"A Text Message From the Noodle Stall","paras":["To: Nora","From: Mia","Hi Nora! I am at the noodle stall near my house right now.","There is a TV here, and it is telling a story about the sea. The ocean level can rise fast, and the ice is starting to melt.","This is not good for animals like polar bears. They can lose their home when the ice melts.","The news says we can save the Earth in small ways. We can save water, and we can use less power at home.","I even saw a member of an ocean group on TV. She said kids can help, too. We can tell our family and friends about this.","Do you want to learn more about this with me? We can even visit the Sea Rescue Center near the river this weekend.","I am safe at the noodle stall, and my noodles are ready now. What a big day for learning something new!","Talk soon,","Mia"],"reading":[{"qtype":"主旨","q":"What is Mia's text message mainly about?","answer":"News about the ocean and melting ice, and wanting to learn more with Nora.","options":["News about the ocean and melting ice, and wanting to learn more with Nora.","A new noodle recipe.","A math test tomorrow."]},{"qtype":"細節","q":"What is happening to the ocean level?","answer":"It is rising.","options":["It is rising.","It is going down.","It is staying the same."]},{"qtype":"細節","q":"What can people do to help, according to the news?","answer":"Save water and use less power.","options":["Save water and use less power.","Eat more noodles.","Watch more TV."]},{"qtype":"推論","q":"Why does Mia want Nora to learn about this, too?","answer":"She thinks kids can help and wants to share the idea with a friend.","options":["She thinks kids can help and wants to share the idea with a friend.","She wants Nora to stop eating noodles.","She does not want to learn alone at school."]},{"qtype":"字義猜測","q":"In the message, \"rise\" most likely means:","answer":"to go up or get higher","options":["to go up or get higher","to go down","to stay the same"]}]},{"id":"nanyi-b1-l6-polar-bears-and-melting-ice","title":"Polar Bears and the Melting Ice","paras":["The polar bear is a super big animal. It lives near the Earth's North Pole, on the ice of the ocean and the sea.","A polar bear can swim very fast in the cold water. It can also walk far on the ice to find food, like fish.","But there is a big problem now. The Earth is getting warmer, so the ice on the sea is starting to melt. Every year, there is less ice for polar bears.","When the ice melts, a polar bear can lose its home. It also cannot find food as easily, so many polar bears are in danger.","Some polar bears must swim a very long way to find safe ice. This is not easy, even for a strong animal like the polar bear.","People all over the world can help save the polar bear. We can use less power at home, and we can tell our friends about this problem, too.","Every small act can help keep the ice safe for polar bears. Next time, I want to learn more about how we can help save our Earth."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Polar bears and the problem of melting ice.","options":["Polar bears and the problem of melting ice.","How to visit the North Pole.","The life of a farmer."]},{"qtype":"細節","q":"Where does a polar bear live?","answer":"Near the North Pole, on the ice.","options":["Near the North Pole, on the ice.","In a hot forest.","In a big city."]},{"qtype":"細節","q":"What happens when the ice melts?","answer":"A polar bear can lose its home and find food less easily.","options":["A polar bear can lose its home and find food less easily.","The bear gets much stronger.","Nothing changes for the bear."]},{"qtype":"推論","q":"Why must some polar bears swim a very long way?","answer":"Because there is less safe ice near them now.","options":["Because there is less safe ice near them now.","Because they enjoy long swims for fun.","Because they are looking for other bears to play with."]},{"qtype":"字義猜測","q":"In the passage, \"melt\" most likely means:","answer":"to change from ice into water","options":["to change from ice into water","to grow bigger","to move very fast"]}]},{"id":"nanyi-b1-l6-study-group","title":"Our Study Group Before the Big Test","paras":["This Friday, a big test is coming, so Kate invites her friends to a study group. Sam, Ella, and Ray come to her house with their textbooks and notebooks after school.","\"Can everyone bring their English notes?\" Kate asks. \"Yes, we can,\" Sam says. \"I also have some review questions from last year.\" They sit around the table together.","\"I can answer this question about animals,\" Ray says. \"But I can't remember the words for the family lesson.\" Ella helps him. \"You can use this list. It's really helpful.\"","\"Can we take a short break now?\" Sam asks after an hour. \"Sure, we can rest for ten minutes,\" Kate says. They eat some fruit and drink water at the table.","After the break, they practice a quiz together. \"Who can answer this question first?\" Kate asks with a smile. Ella raises her hand fast. \"I can!\" she says happily.","\"This test can be easy if we study well,\" Ray says. \"I can feel more confident now.\" Everyone agrees and keeps working through the review questions one by one.","By evening, the group finishes the review. \"We can do well on this test,\" Kate says. \"Thank you for the study group,\" Sam says. \"We can meet again before the next big test.\""],"reading":[{"qtype":"主旨","q":"What is this story mainly about?","answer":"Friends have a study group before a big test.","options":["Friends have a study group before a big test.","Friends plan a birthday party together.","Friends practice for a sports game."]},{"qtype":"細節","q":"What does Ray have trouble remembering?","answer":"The words for the family lesson.","options":["The words for the family lesson.","The animal names.","The review questions."]},{"qtype":"細節","q":"What do they do during their short break?","answer":"Eat fruit and drink water.","options":["Eat fruit and drink water.","Watch a movie together.","Play a game outside."]},{"qtype":"推論","q":"How does Ray probably feel about the test after studying?","answer":"More confident and less worried.","options":["More confident and less worried.","Still very worried about the test.","Sure that he will fail the test."]},{"qtype":"字義猜測","q":"In the story, \"confident\" most likely means:","answer":"feeling sure about doing something well","options":["feeling sure about doing something well","feeling tired and sleepy","feeling angry at a friend"]}]}]},"kang":{"1":[{"id":"kang-b1-l1-letter-to-pen-pal","title":"A Letter to My New Pen Pal","paras":["Dear Nora,","Hi! My name is Leo. I am a junior high school student. I am really happy to have a pen pal from your class!","Let me tell you about my family. My family is not big, but we are warm and close. My father is a farmer, and my mother is a cook at our school.","My father is strict, but he is also kind. My mother is beautiful and very nice. They are the same age, and they are both really busy.","I have one sister and one brother. My sister is young and very cute. My brother is in senior high school. He is tall and handsome.","We also have a pet dog. Its name is Coco. Coco is a good pet, and it is friendly to our neighbors, too.","My aunt and uncle live near our house. Their daughter is my cousin, and she is my best friend. We are in the same class this year!","Is your family big or small? Are you a farmer's child, too? Please write back and tell me about your family. Do you want to send me a photo of your family?","Your new friend,","Leo"],"reading":[{"qtype":"主旨","q":"這封信主要在說什麼？","answer":"Leo 向新筆友介紹自己的家人","options":["Leo 向新筆友介紹自己的家人","Leo 邀請筆友來家裡玩","Leo 介紹他的學校"]},{"qtype":"細節","q":"Leo 的爸爸是做什麼的？","answer":"農夫","options":["農夫","醫生","廚師"]},{"qtype":"細節","q":"Leo 的哥哥現在讀什麼學校？","answer":"高中","options":["國中","高中","小學"]},{"qtype":"推論","q":"從信的內容看，Leo 和他的表姐（堂姐）感情如何？","answer":"非常要好，是最好的朋友","options":["非常要好，是最好的朋友","不太熟","常常吵架"]},{"qtype":"字義猜測","q":"根據上下文，\"neighbor\" 最接近的意思是？","answer":"鄰居","options":["鄰居","老師","醫生"]}]},{"id":"kang-b1-l1-pet-adoption-day","title":"A Pet Adoption Day","paras":["Today is a big pet adoption day at the park. Many families are here. Ben and his little cousin Ivy are here, too. \"Look at that dog! Is it friendly?\" Ivy asks.","A young woman with the dog says, \"Yes, she is very friendly. Her name is Coco.\" Ben sees a small cat in a box. \"Who is this cat?\" he asks the man beside the box.","The man is a nice farmer. \"Her name is Momo. She is two years old,\" the farmer says. \"Is she a good pet for a child?\" Ben asks. \"Yes, she is,\" the farmer says with a warm smile.","Ivy is happy. \"Are you a doctor for animals?\" she asks a woman in a white coat. \"No, I'm not a doctor. I'm a nurse for pets,\" the woman says. \"My job is easy but busy today.\" Ivy thinks the nurse is really kind.","Ben's aunt and uncle are also here with their son and daughter. \"Where is your family from?\" a boy asks Ben. \"We are from a small town near the city,\" Ben says. \"Our family loves animals very much.\"","At noon, Ben and Ivy meet Momo again. \"How old are you, Momo?\" Ivy asks with a big smile. Momo is quiet and cute. Ben's mom says, \"She can be our new pet!\"","Ben and Ivy are so happy. It is a beautiful day for their family, and Momo has a new home."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"一家人到公園參加寵物領養日","options":["一家人到公園參加寵物領養日","一家人去看醫生","一家人去買寵物用品"]},{"qtype":"細節","q":"Coco 是什麼動物？","answer":"狗","options":["狗","貓","兔子"]},{"qtype":"細節","q":"Momo 幾歲？","answer":"兩歲","options":["一歲","兩歲","三歲"]},{"qtype":"推論","q":"為什麼 Ivy 覺得那位護理師很親切？","answer":"因為她耐心又溫和地回答問題","options":["因為她耐心又溫和地回答問題","因為她送 Ivy 禮物","因為她是 Ivy 的親戚"]},{"qtype":"字義猜測","q":"根據上下文，\"friendly\" 最接近的意思是？","answer":"友善的","options":["友善的","生氣的","害怕的"]}]},{"id":"kang-b1-l1-school-radio-station","title":"News at the School Radio Station","paras":["It is Friday morning at the junior high school. Nina and Oscar are in the small radio room. They are the school news team today. \"Are you ready, Oscar?\" Nina asks.","\"Yes, I am ready,\" Oscar says with a big smile. \"Who is our guest today?\" Nina asks the teacher. \"Your guest is Mr. Chen. He is a strict but nice PE teacher,\" the teacher says.","Mr. Chen comes into the room. \"Good morning! What is your class doing this week?\" Nina asks him. \"My class is doing a fun sports day,\" Mr. Chen says. \"Is it hard for the students?\" Oscar asks.","\"No, it is not hard. It is fun for everyone,\" Mr. Chen says with a warm smile. Nina and Oscar are happy to hear the good news.","\"Where is the sports day?\" Nina asks. \"It is near the classroom, on the small field,\" Mr. Chen says. \"Our students are excited. Some are young, and some are not so young, but all are happy.\"","After the talk, Oscar reads more school news. \"Our cousin school has a new nurse and a new doctor for students,\" he says. \"They are very nice people.\"","At the end, Nina says, \"Thank you, Mr. Chen! That is all of our news for today.\" Oscar and Nina are proud. Their radio show is short but really special for their school family."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"兩位學生在學校廣播站訪問老師","options":["兩位學生在學校廣播站訪問老師","老師在教體育課","學生在準備考試"]},{"qtype":"細節","q":"今天的來賓是誰？","answer":"Mr. Chen","options":["Mr. Chen","校長","護理師"]},{"qtype":"細節","q":"運動會在哪裡舉行？","answer":"教室旁的小操場","options":["教室旁的小操場","體育館","隔壁學校"]},{"qtype":"推論","q":"為什麼 Nina 和 Oscar 對訪問結果感到開心？","answer":"因為運動會聽起來很有趣又不難","options":["因為運動會聽起來很有趣又不難","因為他們可以放假","因為老師給他們禮物"]},{"qtype":"字義猜測","q":"根據上下文，\"proud\" 最接近的意思是？","answer":"驕傲的","options":["驕傲的","難過的","疲累的"]}]},{"id":"kang-b1-l1-small-families-today","title":"Small Families in Taiwan Today","paras":["In Taiwan, many families are small today. In the past, a family often had many people. Grandparents, parents, aunts, uncles, and cousins lived in one big house. Now, a family is often just parents and one or two children.","Why are families smaller now? Many parents are busy with work. A big family with many children is not easy for young parents. Also, houses in the city are small, so a big family is hard to have.","Ben's family is a good example. His father is a doctor, and his mother is a nurse. They are both busy every day. Ben is their only child. He does not have a brother or a sister, but he has a cousin near his house.","Is a small family a problem? Not really! Ben's parents are warm and nice to him. His aunt and uncle are close to his family, too. They are not a big family, but they are a happy family.","Many children today are like Ben. They live with just their parents, but they are still close to their grandparents, aunts, and uncles. Family is not about the number of people. It is about being warm and kind to each other.","Small or big, every family is special in its own way."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"台灣的家庭現在變得比較小","options":["台灣的家庭現在變得比較小","如何找到好醫生","怎麼蓋一間大房子"]},{"qtype":"細節","q":"以前的大家庭通常住在哪裡？","answer":"同一間大房子","options":["同一間大房子","很多間小房子","學校附近"]},{"qtype":"細節","q":"文章提到家庭變小的原因不包括下列哪一項？","answer":"城市的房子很便宜","options":["父母工作忙碌","城市的房子很小","城市的房子很便宜"]},{"qtype":"推論","q":"根據文章，Ben 的家庭氣氛可能是什麼樣子？","answer":"溫暖而親近","options":["溫暖而親近","冷淡而疏遠","嚴格而緊張"]},{"qtype":"字義猜測","q":"根據上下文，\"grandparent\" 最接近的意思是？","answer":"祖父母","options":["祖父母","鄰居","老師"]}]}],"2":[{"id":"kang-b1-l2-chinese-zodiac-animals","title":"The Twelve Chinese Zodiac Animals","paras":["Do you know your Chinese zodiac animal? In Chinese culture, there are twelve zodiac animals. This is a very old and famous tradition.","The twelve animals are the rat, the ox, the tiger, the rabbit, the dragon, the snake, the horse, the goat, the monkey, the rooster, the dog, and the pig. Each year has a different animal.","These animals are not the same. The dragon is a special animal in stories, but it is not a real animal. The other eleven are all true animals.","Some are big, like the ox and the horse. Some are small, like the rat and the rabbit.","People say each animal has a different meaning. The ox is a hard worker. The tiger is brave. The rabbit is quiet and gentle. The horse is energetic and fast. The monkey is smart, and the sheep... I mean the goat, is soft and kind.","Many families put a picture of the year's animal on their door at Chinese New Year. It is a fun sign for the new year. People also give red envelopes with the zodiac animal on them.","So, what is your zodiac animal? Are you an ox, a rabbit, or maybe a dragon? Next time you see the twelve zodiac animals, you will know their story!"],"reading":[{"qtype":"主旨","q":"這篇文章主要在介紹什麼？","answer":"十二生肖動物的傳統與意義","options":["十二生肖動物的傳統與意義","如何在動物園工作","十二種名貴的寵物"]},{"qtype":"細節","q":"文章說哪個生肖動物很聰明？","answer":"猴子","options":["猴子","老虎","兔子"]},{"qtype":"細節","q":"文章提到牛的個性是什麼？","answer":"認真工作","options":["認真工作","很吵鬧","很害怕"]},{"qtype":"推論","q":"根據文章，紅包上出現生肖動物圖案最可能的原因是什麼？","answer":"當作新年的吉祥象徵","options":["當作新年的吉祥象徵","因為信封不夠用","因為動物很便宜"]},{"qtype":"字義猜測","q":"根據上下文，\"tradition\" 最接近的意思是？","answer":"傳統","options":["傳統","問題","價格"]}]},{"id":"kang-b1-l2-flea-market-instrument","title":"New Instruments from the Flea Market","paras":["On Sunday, the community has a flea market near the park. Ruby and her brother Max walk around the tables. \"These tables have so many things,\" Ruby says.","Max sees some old guitars. \"This guitar is small. That guitar is big,\" he says. \"Which one do you like?\" Ruby asks. \"I like this small one. It looks cool,\" Max says with a big smile.","They walk to another table. \"What are those things?\" Ruby asks a woman there. \"Those are drums,\" the woman says. \"They are not expensive today.\" Ruby picks up a small drum. \"This drum is so light!\" she says.","\"These drums are good for kids,\" the woman says. \"Are they easy to play?\" Ruby asks. \"Yes, they are easy,\" the woman says. Ruby is excited about the drum.","Max talks to the guitar seller. \"How much is this guitar?\" he asks. The seller is an old man with a warm smile. \"It is not expensive. It is a good guitar for a young player,\" he says.","Max buys the small guitar, and Ruby buys the light drum. \"These are our new instruments!\" Ruby says happily. Max agrees and holds his guitar close.","On the way home, they talk about music. \"We can play songs together now,\" Max says. Ruby smiles. The flea market is their favorite place on Sunday mornings."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"兩兄妹在社區跳蚤市場買樂器","options":["兩兄妹在社區跳蚤市場買樂器","兩兄妹去上音樂課","兩兄妹在家練習樂器"]},{"qtype":"細節","q":"Max 買了哪一把吉他？","answer":"小的吉他","options":["大的吉他","小的吉他","紅色的吉他"]},{"qtype":"細節","q":"賣鼓的人怎麼形容鼓的重量？","answer":"很輕","options":["很重","很輕","很大"]},{"qtype":"推論","q":"為什麼 Max 決定買那把吉他？","answer":"因為它看起來很酷而且價格不貴","options":["因為它看起來很酷而且價格不貴","因為那是唯一的吉他","因為賣家免費送他"]},{"qtype":"字義猜測","q":"根據上下文，\"seller\" 最接近的意思是？","answer":"賣家","options":["賣家","買家","老師"]}]},{"id":"kang-b1-l2-new-stationery-store","title":"The New Stationery Store","paras":["There is a new stationery store at the end of the lane. Its name is Sunny Shop. Kevin and his sister Lily walk in after school. \"Wow, this store is really big!\" Lily says.","\"Look at these pens on the table,\" Kevin says. \"This pen is blue, and that pen is red.\" Lily picks up two notebooks. \"These notebooks are so cute! Are they new?\" she asks the man at the counter.","\"Yes, they are new,\" the man says. He is a young and friendly worker. \"Those erasers by the window are also new. They come in many colors.\" Lily looks at the erasers with a big smile.","\"What are those toys on the shelf?\" Kevin asks. \"Those are small robot toys,\" the man says. \"Kids really like them.\" Kevin picks up one robot. \"This one is cool. Is it expensive?\" he asks.","\"No, it is not very expensive,\" the man says. Kevin is happy. Lily finds some stickers near the door. \"These stickers are pretty. I want three of them,\" she says.","At the counter, Kevin buys the pen and the robot. Lily buys her notebooks and stickers. \"Thank you! Come back again,\" the man says with a nice smile.","Kevin and Lily walk home with their new things. \"This shop is my favorite place now,\" Lily says. Kevin agrees. They are excited to visit Sunny Shop again next week."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"兩兄妹去巷口新開的文具店逛街購物","options":["兩兄妹去巷口新開的文具店逛街購物","兩兄妹去公園玩","兩兄妹去學校買課本"]},{"qtype":"細節","q":"文具店的名字是什麼？","answer":"Sunny Shop","options":["Sunny Shop","Happy Shop","Star Shop"]},{"qtype":"細節","q":"Kevin 最後買了什麼？","answer":"一支筆和一個機器人玩具","options":["一支筆和一個機器人玩具","橡皮擦和貼紙","筆記本和貼紙"]},{"qtype":"推論","q":"為什麼 Kevin 決定買那個機器人？","answer":"因為它很酷而且不貴","options":["因為它很酷而且不貴","因為店員送他的","因為 Lily 要他買"]},{"qtype":"字義猜測","q":"根據上下文，\"counter\" 最接近的意思是？","answer":"櫃台","options":["櫃台","窗戶","架子"]}]},{"id":"kang-b1-l2-zoo-animal-talk","title":"A Talk at the Zoo","paras":["Ryan and Iris are at the zoo. They are near the big animal signs.","Ryan: Look, Iris! This is a zebra. Its size is like a small horse.","Iris: Wow, and that animal over there... is that a tiger?","Ryan: No, that's not a tiger. That's a lion. Tigers have different lines on their body.","Iris: Oh, I see. These two animals look a little the same to me!","Ryan: But they are very different animals. Look, this sign has their lifespan. A lion's lifespan is about fifteen years.","Iris: That's interesting. And what about those big animals? Are those elephants or are those bears?","Ryan: Those are elephants. They are very smart animals. This sign says an elephant is about three meters tall!","Iris: Three meters? That's so big! Are these small animals here rabbits or rats?","Ryan: Those little ones are rabbits. But this animal is a mouse, not a rabbit. It's really small!","Iris: I like this zoo very much. Are we energetic enough to see the monkeys, too?","Ryan: Sure! But first, is that your bag on the ground, or is it mine?","Iris: Oh no, that's my bag! I almost left it with the goats!"],"reading":[{"qtype":"主旨","q":"這段對話主要在說什麼？","answer":"兩位同學在動物園討論不同的動物","options":["兩位同學在動物園討論不同的動物","兩位同學在討論功課","兩位同學在找出口"]},{"qtype":"細節","q":"根據對話，獅子的壽命大約幾年？","answer":"十五年","options":["五年","十五年","五十年"]},{"qtype":"細節","q":"大象的身高大約是幾公尺？","answer":"三公尺","options":["一公尺","三公尺","十公尺"]},{"qtype":"推論","q":"Iris 一開始為什麼會把老虎和獅子搞混？","answer":"因為她覺得這兩種動物看起來有點像","options":["因為她覺得這兩種動物看起來有點像","因為牌子上寫錯了","因為她沒有看到動物"]},{"qtype":"字義猜測","q":"根據上下文，\"interesting\" 最接近的意思是？","answer":"有趣的","options":["有趣的","無聊的","危險的"]}]}],"3":[{"id":"kang-b1-l3-broken-elevator","title":"Stairs Instead of the Elevator","paras":["One morning, the elevator in Peter's building stops working. A sign is on the door: \"Please do not use this elevator today.\" Peter looks at the sign and sighs.","His neighbor Sara walks over. \"Let's take the stairs,\" she says. \"It is not far. Our apartment is only on the fourth floor.\" Peter nods and picks up his bag.","\"Wait for me, Sara! Don't walk so fast,\" Peter says with a laugh. \"Okay, let's go together,\" Sara says. They start walking up the stairs step by step.","On the second floor, an old man stops them. \"Please help me with this box,\" he says. \"It is heavy.\" \"Sure, let me carry it for you,\" Peter says kindly.","\"Be careful on the stairs. Don't run,\" Sara tells Peter. They walk slowly and carefully. The old man says, \"Thank you both. You are very kind children.\"","At the fourth floor, they put the box near the old man's door. \"Have a nice day, and please rest well,\" Sara says with a smile. The old man thanks them again.","Peter and Sara finally reach their homes. \"That was hard, but it was a good idea to help him,\" Peter says. Sara agrees. They hope the elevator is fixed again soon."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"電梯故障，鄰居一起爬樓梯還互相幫忙","options":["電梯故障，鄰居一起爬樓梯還互相幫忙","他們去修理電梯","他們搬到新家"]},{"qtype":"細節","q":"他們的公寓在幾樓？","answer":"四樓","options":["二樓","三樓","四樓"]},{"qtype":"細節","q":"老先生請 Peter 幫忙做什麼？","answer":"幫忙搬箱子","options":["幫忙搬箱子","幫忙開門","幫忙找東西"]},{"qtype":"推論","q":"為什麼 Sara 提醒 Peter 在樓梯上要小心？","answer":"因為爬樓梯時奔跑容易跌倒受傷","options":["因為爬樓梯時奔跑容易跌倒受傷","因為樓梯很暗看不清楚","因為樓梯上有很多人"]},{"qtype":"字義猜測","q":"根據上下文，\"neighbor\" 最接近的意思是？","answer":"鄰居","options":["鄰居","老師","陌生人"]}]},{"id":"kang-b1-l3-directions-to-my-new-house","title":"Directions to My New House","paras":["Dear Zoe,","We moved to a new house near the park! Please come and see it this weekend. Here are the directions.","First, get off the bus near the small store. Please walk around the corner, not through the parking lot. It is faster this way.","Next, please look for a house between a bakery and a small garden. Our house is beside the bakery, not behind it. Please don't be confused with the house next door — that one is not ours!","Please wait near the gate. I will come outside to open the door for you. Our new home has a kitchen, a living room, and two bedrooms. It also has a small dining room, so we can eat together.","It's not a hard style of house to find, but please don't get lost! If you have any questions, please send me a photo of where you are.","Do you want to help me choose a soft blanket for my new bedroom, too? I have some great ideas, but I want your idea as well.","See you soon,","Ella"],"reading":[{"qtype":"主旨","q":"這封信主要在說什麼？","answer":"Ella 告訴 Zoe 怎麼走到她的新家","options":["Ella 告訴 Zoe 怎麼走到她的新家","Ella 邀請 Zoe 去麵包店","Ella 介紹她的新學校"]},{"qtype":"細節","q":"根據信中的指示，應該怎麼走比較快？","answer":"繞過轉角，不要穿過停車場","options":["繞過轉角，不要穿過停車場","穿過停車場","搭計程車直接到門口"]},{"qtype":"細節","q":"Ella 的新家有幾個臥室？","answer":"兩個","options":["一個","兩個","三個"]},{"qtype":"推論","q":"為什麼 Ella 特別提醒 Zoe 不要走錯隔壁的房子？","answer":"因為隔壁房子的樣子容易讓人搞混","options":["因為隔壁房子的樣子容易讓人搞混","因為隔壁的人很兇","因為隔壁房子沒有大門"]},{"qtype":"字義猜測","q":"根據上下文，\"confused\" 最接近的意思是？","answer":"困惑的","options":["困惑的","開心的","生氣的"]}]},{"id":"kang-b1-l3-fire-station-visit","title":"A Visit to the Fire Station","paras":["Mia's class visits the fire station this morning. A firefighter named Mr. Wu meets them at the door. \"Welcome! Please stay close to me,\" he says with a big smile.","\"Look at this red truck. Don't touch it, please,\" Mr. Wu says. The class looks at the big truck with excited eyes. \"It is so cool!\" Mia says.","\"Let's go inside the station now,\" Mr. Wu says. Inside, the room has beds, a kitchen, and a table with tools. \"This is where firefighters rest,\" he explains.","\"Please sit here and listen carefully,\" Mr. Wu says. He shows them a fire jacket. \"Wear this jacket like this, and always be quick,\" he says, and he puts it on fast.","A boy named Leo asks, \"What do we do if there is a fire at home?\" \"Get outside fast, and don't go back inside,\" Mr. Wu says. \"Call for help right away.\"","\"Please remember this: don't play with fire, and always tell an adult,\" Mr. Wu says. The class listens quietly and nods. Mia writes the ideas in her notebook.","Before they leave, Mr. Wu says, \"Thank you for coming. Please be safe and share this with your family.\" Mia and her classmates say thank you and walk back to school."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"班級去消防局參觀並學習安全知識","options":["班級去消防局參觀並學習安全知識","班級去警察局參觀","班級在學校做消防演習"]},{"qtype":"細節","q":"消防員的名字是什麼？","answer":"Mr. Wu","options":["Mr. Wu","Mr. Chen","Mr. Lin"]},{"qtype":"細節","q":"消防員請大家不要做什麼？","answer":"不要碰消防車","options":["不要碰消防車","不要拍照","不要說話"]},{"qtype":"推論","q":"如果家裡發生火災，Mr. Wu 建議大家怎麼做？","answer":"快速到外面並找大人幫忙","options":["快速到外面並找大人幫忙","留在房間裡等待","先拿重要的東西"]},{"qtype":"字義猜測","q":"根據上下文，\"safe\" 最接近的意思是？","answer":"安全的","options":["安全的","危險的","緊張的"]}]},{"id":"kang-b1-l3-small-apartments-in-the-city","title":"Small Apartments in the City","paras":["In big cities in Taiwan, houses are often small and expensive. Many families live in apartments, not big houses. This is a common style of city life today.","A small apartment usually has one or two bedrooms, a small kitchen, and a small living room. Some apartments do not have a dining room. The family eats between the kitchen and the living room instead.","Around a small apartment, every idea for space is important. Some families put a soft blanket on the sofa, so the living room can also be a bedroom at night. Some put tools inside boxes beside the door to save space.","\"Choose things with more than one use,\" says one city planner. \"A table near the window can be for homework and for dinner, too.\" This idea helps families with a small home use their space well.","Some people ask a question: is a small apartment hard for a family? It is not always hard. Many people say a small home with love inside is better than a big house with an empty heart.","So the next time you see a small apartment in the city, remember: it is not about the size of the house. It is about the people inside it."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"城市裡小公寓的生活方式","options":["城市裡小公寓的生活方式","如何買到便宜的房子","城市裡最貴的房子"]},{"qtype":"細節","q":"小公寓通常沒有哪一個房間？","answer":"飯廳","options":["臥室","廚房","飯廳"]},{"qtype":"細節","q":"文章說桌子放在窗邊可以做什麼用途？","answer":"寫功課和吃晚餐",
