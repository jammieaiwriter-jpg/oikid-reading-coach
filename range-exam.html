var LK='nanyi-eng-ledger-v1';
var SEEN_K='range-exam-seen-v1';
var READROT_K='range-exam-read-recent-v1';

function ledger(){try{return JSON.parse(localStorage.getItem(LK)||'{}')}catch(e){return{}}}
function ledgerSave(d){try{localStorage.setItem(LK,JSON.stringify(d))}catch(e){}}
function ledgerGram(gp){if(!gp)return;var d=ledger();d.gp=d.gp||{};
  var g=d.gp[gp]=d.gp[gp]||{wrong:0,cleared:0};g.wrong++;g.last=Date.now();ledgerSave(d)}
function ledgerRead(qtype,ok){if(!qtype)return;var d=ledger();d.read=d.read||{};
  var r=d.read[qtype]=d.read[qtype]||{n:0,wrong:0};r.n++;if(!ok)r.wrong++;ledgerSave(d)}
function ledgerCapWrong(item,distractorTag){var d=ledger();d.capListening=d.capListening||[];
  d.capListening.push({type:'cap-listening',id:item.id,kind:item.kind,subkind:item.subkind,
    function:item.function,distractorTag:distractorTag||null,ts:Date.now()});ledgerSave(d)}
function ledgerVocabWrong(rec){var d=ledger();d.rangeExamVocab=d.rangeExamVocab||[];
  d.rangeExamVocab.push(rec);ledgerSave(d)}

function loadSeen(){try{var a=JSON.parse(localStorage.getItem(SEEN_K)||'[]');
  return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveSeen(arr){try{
  if(arr.length>1000)arr=arr.slice(arr.length-1000);
  localStorage.setItem(SEEN_K,JSON.stringify(arr))}catch(e){}}
function loadReadRecent(){try{return JSON.parse(localStorage.getItem(READROT_K)||'{}')}catch(e){return{}}}
function saveReadRecent(o){try{localStorage.setItem(READROT_K,JSON.stringify(o))}catch(e){}}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function sample(a,n){return shuffle(a).slice(0,n)}
function letterIdx(letter){return 'ABCD'.indexOf(letter)}

var PUB_LABELS={nanyi:'南一',kang:'康軒',han:'翰林'};

function initSetup(){
  var pubSel=document.getElementById('pubSel'),fromSel=document.getElementById('fromSel'),toSel=document.getElementById('toSel');
  Object.keys(PUB_LABELS).forEach(function(p){var o=document.createElement('option');o.value=p;o.textContent=PUB_LABELS[p];pubSel.appendChild(o)});
  for(var n=1;n<=6;n++){
    var o1=document.createElement('option');o1.value=n;o1.textContent='L'+n;fromSel.appendChild(o1);
    var o2=document.createElement('option');o2.value=n;o2.textContent='L'+n;toSel.appendChild(o2.cloneNode(true));
  }
  toSel.value='6';
  document.getElementById('genBtn').onclick=function(){
    var pub=pubSel.value,from=parseInt(fromSel.value,10),to=parseInt(toSel.value,10);
    if(from>to){document.getElementById('setupNote').textContent='起訖課次不對，已自動調整。';var t=from;from=to;to=t}
    CURRENT_SCOPE={pub:pub,from:from,to:to};
    generateExam();
  };
}

var CURRENT_SCOPE=null;
var CURRENT_EXAM=null;

/* ---------- 生卷邏輯 ---------- */

function lessonsInRange(scope){var out=[];for(var n=scope.from;n<=scope.to;n++)out.push(n);return out}

function buildVocabQuestions(scope){
  var lessons=lessonsInRange(scope);
  var pool=[]; // {w,zh,pos,lesson}
  lessons.forEach(function(n){(DATA.vocab[scope.pub][n]||[]).forEach(function(w){
    pool.push({w:w.w,zh:w.zh,pos:w.pos,lesson:n})})});
  var wholeBook=[]; // fallback pool：整本 7a（跨範圍）
  for(var n=1;n<=6;n++){(DATA.vocab[scope.pub][n]||[]).forEach(function(w){
    wholeBook.push({w:w.w,zh:w.zh,pos:w.pos,lesson:n})})}

  var picks=sample(pool,Math.min(10,pool.length));
  // 不足 10 個字時（極端情況）從整本補滿
  if(picks.length<10){
    var have={};picks.forEach(function(p){have[p.w]=1});
    var extra=wholeBook.filter(function(w){return !have[w.w]});
    picks=picks.concat(sample(extra,10-picks.length));
  }
  var qs=[];
  picks.forEach(function(target,idx){
    var direction = idx<6 ? 'zh2en' : 'en2zh';
    var candidates=pool.filter(function(w){return w.w!==target.w});
    var samePos=candidates.filter(function(w){return w.pos===target.pos});
    var distractors=sample(samePos,3);
    if(distractors.length<3){
      var others=candidates.filter(function(w){return distractors.indexOf(w)===-1});
      distractors=distractors.concat(sample(others,3-distractors.length));
    }
    if(distractors.length<3){
      var poolWords={};pool.forEach(function(w){poolWords[w.w]=1});
      var bookExtra=wholeBook.filter(function(w){return w.w!==target.w && !poolWords[w.w]});
      distractors=distractors.concat(sample(bookExtra,3-distractors.length));
    }
    // dedupe by displayed text (w for zh2en, zh for en2zh)，避免誘答重複或撞正解
    var seenText={}; var uniq=[];
    var targetText = direction==='zh2en' ? target.w : target.zh;
    seenText[targetText]=1;
    distractors.forEach(function(d){
      var t = direction==='zh2en' ? d.w : d.zh;
      if(!seenText[t]){seenText[t]=1;uniq.push(d)}
    });
    distractors=uniq.slice(0,3);
    // 萬一去重後不足 3，從整本再補
    if(distractors.length<3){
      var more=wholeBook.filter(function(w){
        var t=direction==='zh2en'?w.w:w.zh; return !seenText[t] && w.w!==target.w;
      });
      shuffle(more).forEach(function(m){
        if(distractors.length>=3)return;
        var t=direction==='zh2en'?m.w:m.zh;
        if(!seenText[t]){seenText[t]=1;distractors.push(m)}
      });
    }
    var optObjs=shuffle([target].concat(distractors));
    var options=optObjs.map(function(o){return direction==='zh2en'?o.w:o.zh});
    var answerIndex=optObjs.indexOf(target);
    var stem = direction==='zh2en'
      ? ('中文「'+target.zh+'」的英文是？')
      : ('英文「'+target.w+'」的中文意思是？');
    qs.push({
      section:'vocab',
      stem:stem,
      options:options,
      answerIndex:answerIndex,
      explanation:'正解："'+target.w+'"　'+target.zh+'（'+(target.pos||'')+'）',
      ledger:{word:target.w,zh:target.zh,pos:target.pos,lesson:scope.pub+'-b1-l'+target.lesson,direction:direction}
    });
  });
  return shuffle(qs);
}

function buildGrammarQuestions(scope){
  var lessons=shuffle(lessonsInRange(scope));
  var n=lessons.length;
  var base=Math.floor(10/n), extra=10-base*n;
  var seen=loadSeen();
  var seenSet={};seen.forEach(function(id){seenSet[id]=1});
  var picked=[];
  var newlySeen=[];
  lessons.forEach(function(ln,i){
    var quota=base+(i<extra?1:0);
    var items=(DATA.grammar[scope.pub][ln]||[]).slice();
    var unseen=shuffle(items.filter(function(it){return !seenSet[it.itemId]}));
    var already=shuffle(items.filter(function(it){return seenSet[it.itemId]}));
    var take=unseen.concat(already).slice(0,quota);
    take.forEach(function(it){picked.push(it);newlySeen.push(it.itemId)});
  });
  // 不足 10 題時（極端情況：範圍內題庫太小），從範圍內全部題目池再補
  if(picked.length<10){
    var pickedIds={};picked.forEach(function(it){pickedIds[it.itemId]=1});
    var allInRange=[];
    lessons.forEach(function(ln){(DATA.grammar[scope.pub][ln]||[]).forEach(function(it){
      if(!pickedIds[it.itemId])allInRange.push(it)})});
    var pad=sample(allInRange,10-picked.length);
    pad.forEach(function(it){picked.push(it);newlySeen.push(it.itemId)});
  }
  picked=shuffle(picked).slice(0,10);
  saveSeen(seen.concat(newlySeen));
  return picked.map(function(it){
    var ai=letterIdx(it.answer);
    return {
      section:'grammar',
      stem:it.stem,
      options:it.options,
      answerIndex:ai,
      explanation:it.explanation,
      ledger:{gp:it.grammarPointId}
    };
  });
}

function buildReadingBlock(scope){
  var lessons=lessonsInRange(scope);
  var candidates=[]; // {lesson,article}
  lessons.forEach(function(ln){(DATA.articles[scope.pub][ln]||[]).forEach(function(a){
    candidates.push({lesson:ln,article:a})})});
  if(!candidates.length)return null;
  var recentAll=loadReadRecent();
  var scopeKey=scope.pub+':'+scope.from+'-'+scope.to;
  var recent=recentAll[scopeKey]||[];
  var fresh=candidates.filter(function(c){return recent.indexOf(c.article.id)===-1});
  var chosen=(fresh.length?fresh:candidates)[Math.floor(Math.random()*(fresh.length?fresh.length:candidates.length))];
  recent=recent.concat([chosen.article.id]);
  if(recent.length>Math.max(1,candidates.length-1))recent=recent.slice(recent.length-Math.max(1,candidates.length-1));
  recentAll[scopeKey]=recent;
  saveReadRecent(recentAll);

  var a=chosen.article;
  var qs=a.reading.map(function(r){
    return {
      section:'reading',
      stem:r.q,
      options:r.options,
      answerIndex:r.options.indexOf(r.answer),
      explanation:'正解：'+r.answer,
      ledger:{qtype:r.qtype}
    };
  });
  return {title:a.title,paras:a.paras,questions:qs};
}

function buildListeningQuestions(){
  var qa=sample(DATA.listening.qa,2);
  var talk=sample(DATA.listening.talk,2);
  return shuffle(qa.concat(talk)).map(function(it){
    var noAnswerOpts=[];
    it.options.forEach(function(o,i){if(i!==it.answer)noAnswerOpts.push(i)});
    return {
      section:'listening',
      stem:(it.question?it.question:'請聽音檔，選出最適合的回應。'),
      options:it.options,
      answerIndex:it.answer,
      explanation:'逐字稿：'+it.material.join(' / ')+(it.question?('　❓ '+it.question):''),
      audioSrc:it.audioSrc,
      ledger:{id:it.id,kind:it.kind,subkind:it.subkind,function:it.function,noAnswerOpts:noAnswerOpts,distractorTags:it.distractorTags}
    };
  });
}

function generateExam(){
  var scope=CURRENT_SCOPE;
  var vocab=buildVocabQuestions(scope);
  var grammar=buildGrammarQuestions(scope);
  var reading=buildReadingBlock(scope);
  var listening=buildListeningQuestions();
  CURRENT_EXAM={scope:scope,vocab:vocab,grammar:grammar,reading:reading,listening:listening};
  renderExam();
}

/* ---------- 畫面 ---------- */

function el(id){return document.getElementById(id)}
function show(id){['view-setup','view-exam','view-result'].forEach(function(v){
  el(v).classList.toggle('hidden',v!==id)})}

function questionHtml(q,globalNo,secPrefix){
  var html='<div class="q" data-qkey="'+secPrefix+'-'+globalNo+'">';
  html+='<div class="stem"><span class="qno">'+globalNo+'.</span>'+q.stem+'</div>';
  if(q.audioSrc){
    html+='<div class="playbar"><audio controls preload="none" src="'+q.audioSrc+'"></audio></div>';
  }
  q.options.forEach(function(opt,i){
    html+='<label class="opt"><input type="radio" name="'+secPrefix+'-'+globalNo+'" value="'+i+'"> '+opt+'</label>';
  });
  html+='</div>';
  return html;
}

function renderExam(){
  var ex=CURRENT_EXAM;
  el('examMeta').textContent=PUB_LABELS[ex.scope.pub]+'　L'+ex.scope.from+' ~ L'+ex.scope.to+'　共 29 題';
  var body='';
  body+='<div class="sect"><div class="head">一、單字（10題）</div>';
  ex.vocab.forEach(function(q,i){body+=questionHtml(q,i+1,'vocab')});
  body+='</div>';

  body+='<div class="sect"><div class="head">二、文法（10題）</div>';
  ex.grammar.forEach(function(q,i){body+=questionHtml(q,i+1,'grammar')});
  body+='</div>';

  body+='<div class="sect"><div class="head">三、閱讀（5題）</div>';
  if(ex.reading){
    body+='<div class="article"><h3>'+ex.reading.title+'</h3>'+ex.reading.paras.map(function(p){return '<p>'+p+'</p>'}).join('')+'</div>';
    ex.reading.questions.forEach(function(q,i){body+=questionHtml(q,i+1,'reading')});
  }else{
    body+='<div class="q">此範圍暫無可用文章。</div>';
  }
  body+='</div>';

  body+='<div class="sect"><div class="head">四、聽力（4題）</div>';
  ex.listening.forEach(function(q,i){body+=questionHtml(q,i+1,'listening')});
  body+='</div>';

  el('examBody').innerHTML=body;
  show('view-exam');
}

function collectAnswers(){
  var ex=CURRENT_EXAM;
  function readSec(list,prefix){
    return list.map(function(q,i){
      var sel=document.querySelector('input[name="'+prefix+'-'+(i+1)+'"]:checked');
      var chosen=sel?parseInt(sel.value,10):-1;
      return {q:q,chosen:chosen,ok:chosen===q.answerIndex};
    });
  }
  var vocab=readSec(ex.vocab,'vocab');
  var grammar=readSec(ex.grammar,'grammar');
  var reading=ex.reading?readSec(ex.reading.questions,'reading'):[];
  var listening=readSec(ex.listening,'listening');
  return {vocab:vocab,grammar:grammar,reading:reading,listening:listening};
}

function gradeAndRecord(res){
  res.grammar.forEach(function(r){if(!r.ok)ledgerGram(r.q.ledger.gp)});
  res.reading.forEach(function(r){ledgerRead(r.q.ledger.qtype,r.ok)});
  res.listening.forEach(function(r){
    if(!r.ok && r.chosen>=0){
      var pos=r.q.ledger.noAnswerOpts.indexOf(r.chosen);
      var tag=pos>=0?r.q.ledger.distractorTags[pos]:null;
      ledgerCapWrong(r.q.ledger,tag);
    }
  });
  res.vocab.forEach(function(r){
    if(!r.ok){
      var rec={type:'range-exam-vocab',word:r.q.ledger.word,zh:r.q.ledger.zh,pos:r.q.ledger.pos,
        lesson:r.q.ledger.lesson,direction:r.q.ledger.direction,ts:Date.now()};
      ledgerVocabWrong(rec);
    }
  });
}

function scoreOf(list){var n=0;list.forEach(function(r){if(r.ok)n++});return n}

function reviewHtml(list,label,startNo){
  var html='<div class="sect"><div class="head">'+label+'　'+scoreOf(list)+' / '+list.length+'</div>';
  list.forEach(function(r,i){
    var q=r.q;
    html+='<div class="q"><div class="stem"><span class="qno">'+(startNo+i)+'.</span>'+q.stem+'</div>';
    if(q.audioSrc)html+='<div class="playbar"><audio controls preload="none" src="'+q.audioSrc+'"></audio></div>';
    q.options.forEach(function(opt,oi){
      var cls='opt';
      if(oi===q.answerIndex)cls+=' correct';
      else if(oi===r.chosen)cls+=' wrong';
      html+='<div class="'+cls+'">'+opt+(oi===r.chosen&&oi!==q.answerIndex?'　← 你的答案':'')+'</div>';
    });
    if(r.chosen<0)html+='<div class="expl">（未作答）</div>';
    html+='<div class="expl">'+(q.explanation||'')+'</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function renderResult(res){
  var total=scoreOf(res.vocab)+scoreOf(res.grammar)+scoreOf(res.reading)+scoreOf(res.listening);
  el('resultMeta').textContent=PUB_LABELS[CURRENT_EXAM.scope.pub]+'　L'+CURRENT_EXAM.scope.from+' ~ L'+CURRENT_EXAM.scope.to;
  el('scoreTotal').textContent=total+' / 29';
  el('scoreSubs').innerHTML=
    '<div>單字 '+scoreOf(res.vocab)+'/10</div>'+
    '<div>文法 '+scoreOf(res.grammar)+'/10</div>'+
    '<div>閱讀 '+scoreOf(res.reading)+'/5</div>'+
    '<div>聽力 '+scoreOf(res.listening)+'/4</div>';
  var body='';
  body+=reviewHtml(res.vocab,'一、單字',1);
  body+=reviewHtml(res.grammar,'二、文法',11);
  if(res.reading.length)body+=reviewHtml(res.reading,'三、閱讀',21);
  body+=reviewHtml(res.listening,'四、聽力',26);
  el('resultBody').innerHTML=body;
  show('view-result');
}

function initButtons(){
  el('submitBtn').onclick=function(){
    var res=collectAnswers();
    gradeAndRecord(res);
    renderResult(res);
  };
  el('retryBtn').onclick=function(){
    generateExam();
  };
  el('resetBtn').onclick=function(){
    show('view-setup');
  };
}

initSetup();
initButtons();

</script>
</body>
</html>
