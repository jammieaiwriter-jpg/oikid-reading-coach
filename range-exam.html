"options":["寫功課和吃晚餐","只用來睡覺","只用來放工具"]},{"qtype":"推論","q":"根據文章，作者對小公寓生活的看法最可能是什麼？","answer":"空間雖小，但家人的愛更重要","options":["空間雖小，但家人的愛更重要","小公寓完全不適合居住","只有大房子才算是家"]},{"qtype":"字義猜測","q":"根據上下文，\"empty\" 最接近的意思是？","answer":"空的","options":["空的","溫暖的","昂貴的"]}]}],"4":[{"id":"kang-b1-l4-apps-that-keep-walkers-safe","title":"Apps That Keep Walkers Safe","paras":["Crossing the road can be dangerous. In Taiwan and in the USA, cars and scooters do not always stop at a crosswalk. This is a real problem for people who walk to school or work.","Now, some new apps can help. A user can download this kind of app to their phone. The app can warn a walker before a car or a scooter comes near a crosswalk.","How does this app work? It can listen for the sound of a car on the road. It also uses a special voice to talk to the user.","The app can say, \"A car is coming from your left!\" This voice warning can also work at night.","This app is also useful on a busy lane or a small road without traffic lights. A walker can't always see an oncoming car early. But with a warning voice, they can move to the sidewalk fast.","Some students say this app makes them feel safe on the way to school. Other users say the app's noise is a little too loud, so they can turn down the sound.","Cars, scooters, and people can't always share the road well. But with a smart app, walking to school can also be safe."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"能提醒行人注意來車的手機App","options":["能提醒行人注意來車的手機App","如何設計一台新手機","台灣的交通號誌歷史"]},{"qtype":"細節","q":"這款 App 用什麼方式提醒使用者？","answer":"用特殊的語音","options":["用特殊的語音","用震動","用閃光"]},{"qtype":"細節","q":"文章說這個 App 在什麼樣的道路上特別有用？","answer":"沒有紅綠燈的小路","options":["沒有紅綠燈的小路","高速公路","學校操場"]},{"qtype":"推論","q":"根據文章，為什麼有些學生特別喜歡用這個 App？","answer":"因為走路上學時覺得比較安全","options":["因為走路上學時覺得比較安全","因為 App 是免費的遊戲","因為 App 可以下載歌曲"]},{"qtype":"字義猜測","q":"根據上下文，\"dangerous\" 最接近的意思是？","answer":"危險的","options":["危險的","安全的","有趣的"]}]},{"id":"kang-b1-l4-making-a-kite","title":"Making a Kite Together","paras":["Zoe and her uncle plan to make a kite this afternoon. \"Can you help me with the paper?\" Zoe asks. \"Yes, I can. Let's start with the design,\" her uncle says.","\"What color can we use?\" Zoe asks. \"We can use any color you like,\" her uncle says. Zoe chooses a bright yellow paper with a bird design on it.","\"Can I draw a face on the kite?\" Zoe asks. \"Sure, you can draw anything,\" her uncle says. Zoe draws a happy face and some stars on the paper.","Her uncle cuts two long sticks. \"Can these sticks make the kite strong?\" Zoe asks. \"Yes, they can. We just need to tie them well,\" he says, and he ties the sticks together.","After an hour, the kite is ready. \"Can it really fly?\" Zoe asks. \"We can't know until we try,\" her uncle says with a smile. They walk to the open field near their house.","The wind is strong today. \"Run fast, and the kite can fly!\" her uncle says. Zoe runs, and the kite slowly rises into the sky. \"It can fly! Look at it!\" she shouts.","The yellow kite flies high above the field. \"We can fly it every weekend now,\" Zoe says happily. Her uncle nods. \"You made a really special kite today,\" he says."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"Zoe 和叔叔一起做風箏並成功放飛","options":["Zoe 和叔叔一起做風箏並成功放飛","Zoe 和叔叔去買風箏","Zoe 和叔叔在修理腳踏車"]},{"qtype":"細節","q":"Zoe 在風箏上畫了什麼？","answer":"笑臉和星星","options":["笑臉和星星","小狗","太陽"]},{"qtype":"細節","q":"叔叔用什麼讓風箏變得堅固？","answer":"兩根長棍子","options":["兩根長棍子","膠水","鐵絲"]},{"qtype":"推論","q":"為什麼他們要跑起來才能讓風箏飛起來？","answer":"因為風箏需要風的力量才能升空","options":["因為風箏需要風的力量才能升空","因為場地太小","因為風箏太重"]},{"qtype":"字義猜測","q":"根據上下文，\"design\" 最接近的意思是？","answer":"設計、圖案","options":["設計、圖案","顏色","價格"]}]},{"id":"kang-b1-l4-mountain-hiking","title":"Hiking to the Top","paras":["This Saturday, Nina and her father go hiking on a mountain near their town. \"Can you see the top from here?\" her father asks. \"No, I can't. It is too far,\" Nina says.","They walk on a small road beside the trees. \"Can we take a photo here?\" Nina asks. \"Yes, we can. This place is really beautiful,\" her father says. They stop and take some photos.","After an hour, Nina feels tired. \"Can we rest for a while?\" she asks. \"Sure, we can rest beside this rock,\" her father says. They sit down and drink some water.","A group of hikers walks by. \"Can you tell us the way to the top?\" one hiker asks. \"Yes, I can. Just follow this road,\" Nina's father says with a smile.","Soon, Nina and her father can see the top of the mountain. \"Can you make it, Nina?\" her father asks. \"Yes, I can! Let's go,\" Nina says with new energy.","At the top, the view is amazing. \"We can see the whole city from here!\" Nina says happily. \"You can also see the sea on a clear day,\" her father says.","They sit together and eat lunch. \"I can't believe we did it,\" Nina says. Her father smiles. \"You can do hard things when you don't give up,\" he says. Nina feels really proud today."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"父女一起去爬山健行並成功登頂","options":["父女一起去爬山健行並成功登頂","父女在山上迷路了","父女去山上露營過夜"]},{"qtype":"細節","q":"健行途中他們在哪裡休息？","answer":"在一顆大石頭旁邊","options":["在一顆大石頭旁邊","在一棵大樹下","在小木屋裡"]},{"qtype":"細節","q":"一群健行者向他們問了什麼？","answer":"去山頂的路怎麼走","options":["去山頂的路怎麼走","現在幾點","附近有沒有水"]},{"qtype":"推論","q":"為什麼 Nina 到山頂後感到驕傲？","answer":"因為她堅持完成了辛苦的健行","options":["因為她堅持完成了辛苦的健行","因為她拿到獎品","因為她比別人先到達"]},{"qtype":"字義猜測","q":"根據上下文，\"amazing\" 最接近的意思是？","answer":"驚人的、了不起的","options":["驚人的、了不起的","無聊的","危險的"]}]},{"id":"kang-b1-l4-new-safety-app-talk","title":"A New Safety App","paras":["Kate and Paul are walking home on Riverside Road.","Kate: Paul, can you download this new app? It can warn you about oncoming cars.","Paul: Really? I can't see very well at night. That sounds useful for me.","Kate: Yes! It also has a special voice. It can say, \"A car is coming!\" near a crosswalk.","Paul: Can it work on a small lane without traffic lights, too?","Kate: Yes, it can. My design teacher also uses it on her way to school.","Paul: Can I use it for free, or do I need to pay?","Kate: You can download it for free! But you can't use it without a phone, of course.","Paul: Ha, that's true. Can this app also warn me about noise, like a really loud scooter?","Kate: I think so. It can also talk to you if you are too close to the sidewalk's edge.","Paul: That's a great app design! Can we tell our other classmates about it, too?","Kate: Sure, let's tell them tomorrow. Do you want to walk home together and try it now?","Paul: Yes, let's go! I can't wait to try this app."],"reading":[{"qtype":"主旨","q":"這段對話主要在說什麼？","answer":"Kate 向 Paul 介紹一款新的安全 App","options":["Kate 向 Paul 介紹一款新的安全 App","Kate 和 Paul 在討論功課","Kate 和 Paul 在找公車站"]},{"qtype":"細節","q":"這款 App 可以在什麼樣的路上使用？","answer":"沒有紅綠燈的小路","options":["沒有紅綠燈的小路","只有高速公路","只有學校裡面"]},{"qtype":"細節","q":"Paul 為什麼覺得這個 App 對他有用？","answer":"因為他晚上看不太清楚","options":["因為他晚上看不太清楚","因為他常常遲到","因為他喜歡玩手機遊戲"]},{"qtype":"推論","q":"根據對話，Paul 最後對這款 App 的態度是什麼？","answer":"很期待，想馬上試試看","options":["很期待，想馬上試試看","覺得不需要","覺得太貴不想用"]},{"qtype":"字義猜測","q":"根據上下文，\"edge\" 最接近的意思是？","answer":"邊緣","options":["邊緣","中間","頂端"]}]}],"5":[{"id":"kang-b1-l5-bike-ride-around-lake","title":"A Saturday Bike Ride Around the Lake","paras":["It is Saturday morning, and the sun is warm and bright. Sam and his group of friends are riding their bikes around the big lake near the city.","\"Are you riding fast today?\" Ivy asks Sam. \"No, I'm not riding fast. I like to look around,\" Sam says with a smile. They ride beside the water.","At nine o'clock, they stop and rest. \"What are you looking at, Leo?\" Ivy asks. \"I'm looking at the lake. It is so beautiful today,\" Leo says.","\"Can we ride to the other side of the lake?\" Sam asks. \"Sure, we can. It's not far,\" Ivy says. They start riding again, and everyone is laughing and enjoying the day.","By noon, they are eating lunch near the lake. \"We are enjoying a really good Saturday,\" Leo says. \"Next Saturday, we can ride here again,\" Sam says, and everyone agrees.","After lunch, some ducks are swimming in the water. \"Look, they are swimming so fast!\" Ivy says. The friends are watching the ducks and laughing together.","In the afternoon, they are riding home. \"This is a really great Saturday,\" Sam says. Everyone is tired but happy. They plan to join this bike group again next weekend."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"一群朋友週六一起騎腳踏車環湖","options":["一群朋友週六一起騎腳踏車環湖","一群朋友去參加游泳比賽","一群朋友在湖邊露營過夜"]},{"qtype":"細節","q":"他們幾點停下來休息？","answer":"九點","options":["八點","九點","十點"]},{"qtype":"細節","q":"Leo 停下來時在做什麼？","answer":"拍湖的照片","options":["拍湖的照片","喝水","修腳踏車"]},{"qtype":"推論","q":"為什麼 Sam 說今天是這週最棒的星期六？","answer":"因為和朋友一起騎車玩得很開心","options":["因為和朋友一起騎車玩得很開心","因為他贏得了比賽","因為他買了新腳踏車"]},{"qtype":"字義猜測","q":"根據上下文，\"weekend\" 最接近的意思是？","answer":"週末","options":["週末","假日禮物","早晨"]}]},{"id":"kang-b1-l5-birthday-party-invitation","title":"You Are Invited to My Birthday Party!","paras":["Dear Gina,","My birthday is next Friday! I am preparing a party at my house, and I want to invite you to join us.","The party is on Friday at 6:00 p.m. We are meeting in my garden. My mom is cooking, and my dad is preparing games for everybody.","This year, our group is having a small basketball game before the party, too. It starts at 4:00 p.m., right after school. Are you free that day?","On Saturday, some of my classmates are still talking about the party. We are also preparing a small gift for our teacher for helping us all year.","Everyone at school can come, but I really want my close friend there. The party is not a big one, but it will be a fun evening. Do you want to come and bring your sister, too?","Please tell me by Wednesday so my mom knows how much food to prepare!","Your friend,","Mia"],"reading":[{"qtype":"主旨","q":"這封信主要在說什麼？","answer":"Mia 邀請 Gina 參加她的生日派對","options":["Mia 邀請 Gina 參加她的生日派對","Mia 邀請 Gina 一起打籃球比賽","Mia 想跟 Gina 借東西"]},{"qtype":"細節","q":"誰在幫忙準備派對的遊戲？","answer":"Mia 的爸爸","options":["Mia 的爸爸","Mia 的媽媽","Mia 的老師"]},{"qtype":"細節","q":"Mia 希望 Gina 在星期三之前做什麼？","answer":"回覆是否能參加","options":["回覆是否能參加","帶生日禮物來","打電話給老師"]},{"qtype":"推論","q":"從信的內容看，Mia 和 Gina 的關係最可能是什麼？","answer":"非常要好的朋友","options":["非常要好的朋友","剛認識的同學","老師和學生"]},{"qtype":"字義猜測","q":"根據上下文，\"invite\" 最接近的意思是？","answer":"邀請","options":["邀請","拒絕","忘記"]}]},{"id":"kang-b1-l5-busy-weekends-for-students","title":"Busy Weekends for Students","paras":["For many junior high school students in Taiwan, a weekend is not really a rest day. Many students are busy with classes even on Saturday and Sunday.","On Saturday morning, some students join an English class or a music group. In the afternoon, other students have a basketball meeting with their team. Even Sunday is not always free. Some students are preparing for a test on Monday.","Why are weekends so busy? Parents want their children to have more skills. Some students also join a group because they like it, not because their parents ask them to.","A student named Owen says, \"On a normal week, I have a piano class every Tuesday and Thursday. Then on Saturday, I have basketball. I am also in a chat group with my classmates for our science project.\"","The sun does not rise later on the weekend, but for these students, their day still starts early. Some students say they are tired, but others say they like being busy with fun things.","What a busy life for a student today! Weekdays and weekends can look almost the same."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"台灣國中生忙碌的週末生活","options":["台灣國中生忙碌的週末生活","如何準備生日派對","學生如何打籃球"]},{"qtype":"細節","q":"文章提到有些學生星期天在做什麼？","answer":"準備星期一的考試","options":["準備星期一的考試","去公園玩","在家睡覺"]},{"qtype":"細節","q":"文章提到父母希望孩子週末上課的原因是什麼？","answer":"希望孩子多學一些技能","options":["希望孩子多學一些技能","因為學校要求","因為假日票比較便宜"]},{"qtype":"推論","q":"根據文章最後一段，作者想表達的感想最可能是什麼？","answer":"現在學生的平日和週末幾乎一樣忙","options":["現在學生的平日和週末幾乎一樣忙","學生應該更早起床","太陽週末升起得比較晚"]},{"qtype":"字義猜測","q":"根據上下文，\"tired\" 最接近的意思是？","answer":"累的","options":["累的","開心的","生氣的"]}]},{"id":"kang-b1-l5-planetarium-stargazing","title":"A Night at the Planetarium","paras":["It is Friday night, and the planetarium is open late. Oscar and his aunt are standing in line with many people. The stars tonight are really bright.","\"Are you looking forward to this?\" his aunt asks. \"Yes! I'm waiting to see the big star show,\" Oscar says. They walk inside and find their seats.","The room is dark, and everyone is watching the ceiling. \"Look, that's the Big Dipper,\" a worker says, pointing at seven bright stars. Oscar is listening carefully to every word.","\"What day is the next full moon?\" Oscar asks. \"It's on Sunday,\" the worker says. \"On Sunday night, the moon is really big and bright.\"","After the show, they are learning about planets at a small table. \"This one is enjoying the stars,\" Oscar's aunt says, and Oscar is smiling and nodding at every planet.","\"Can we come back next Saturday?\" Oscar asks. \"Sure, we can,\" his aunt says. \"There is a new show every weekend.\" Oscar is holding a small star map from the gift shop.","On the way home, Oscar is thinking about the planets and stars. \"This was a really great night,\" he says. His aunt agrees, and they plan their next visit together."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"Oscar 和阿姨去天文館看星星和星象秀","options":["Oscar 和阿姨去天文館看星星和星象秀","Oscar 和阿姨去看電影","Oscar 和阿姨在家看星星"]},{"qtype":"細節","q":"工作人員指的第一個星象是什麼？","answer":"北斗七星","options":["北斗七星","月亮","土星"]},{"qtype":"細節","q":"Oscar 從紀念品店拿了什麼？","answer":"一張星圖","options":["一張星圖","一本書","一個望遠鏡"]},{"qtype":"推論","q":"為什麼 Oscar 在回家路上還在想著行星和星星？","answer":"因為他今晚玩得很開心並很喜歡這次的活動","options":["因為他今晚玩得很開心並很喜歡這次的活動","因為他忘了帶作業","因為他要準備考試"]},{"qtype":"字義猜測","q":"根據上下文，\"ceiling\" 最接近的意思是？","answer":"天花板","options":["天花板","地板","牆壁"]}]}],"6":[{"id":"kang-b1-l6-new-gym-building-tour","title":"A Tour of the New Gym Building","paras":["Nora and Hank are walking around the new gym building at school.","Nora: Wow, there is a big basketball court here! And look, there is a swimming pool, too!","Hank: I know! There are also lockers near the restroom. Let's put our bags there.","Nora: Is there a place to rest? I'm a little hungry after class.","Hank: There is a small shop by the gate. There is a sandwich shelf and some drinks there.","Nora: Great! Is there a garden near the building, too? I heard there is one.","Hank: Yes, there is a small garden outside. There are also a slide and a swing for the little kids.","Nora: This building is so large! Is there a playground on this side, too?","Hank: No, there isn't. The playground and the sports field are still outside, near the old building.","Nora: I see. There is so much to find here! Are there classmates from our class here, too?","Hank: Yes, there are! Look, there is Leo, and there is Zoe by the basket of balls.","Nora: Ha, this new building is friendly, but I still can't find the way out!"],"reading":[{"qtype":"主旨","q":"這段對話主要在說什麼？","answer":"Nora 和 Hank 一起參觀學校新的體育館","options":["Nora 和 Hank 一起參觀學校新的體育館","Nora 和 Hank 在討論功課","Nora 和 Hank 在找公車站"]},{"qtype":"細節","q":"小商店裡有賣什麼？","answer":"三明治和飲料","options":["三明治和飲料","書本和文具","球和球拍"]},{"qtype":"細節","q":"新體育館這一側有沒有遊樂場？","answer":"沒有，遊樂場還在舊大樓那邊","options":["沒有，遊樂場還在舊大樓那邊","有，就在花園旁邊","有，在游泳池樓上"]},{"qtype":"推論","q":"從對話最後看，Nora 對這棟新大樓的感覺最可能是什麼？","answer":"覺得新大樓友善但有點容易迷路","options":["覺得新大樓友善但有點容易迷路","覺得新大樓太小又無聊","覺得新大樓應該要拆掉"]},{"qtype":"字義猜測","q":"根據上下文，\"way out\" 最接近的意思是？","answer":"出口","options":["出口","入口","地圖"]}]},{"id":"kang-b1-l6-recess-on-the-playground","title":"Ten Minutes of Recess on the Playground","paras":["In many junior high schools in Taiwan, there is a ten-minute break between classes. Students call this time recess.","There are many things to do at recess. On the playground, there is a basketball court, a slide, and a swing. Some classmates go to the sports field, and there is also a seesaw for younger students.","During recess, there are always students running to the restroom fast. There is not much time, so students move quickly. Some students go to the classmate next to them and just talk for a while.","There is a gym near the garden, but students can't play in it during a short recess. It's too far. However, there is a small basket of balls beside the playground gate for a fast game.","A large group of students likes to find a shelf of books near the library and read for a few minutes. Other students are hungry, so they eat a sandwich by the garden.","Ten minutes is not long, but for students, it is still an important break. There is always something fun to do on the playground."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"學生下課十分鐘在操場上做的事","options":["學生下課十分鐘在操場上做的事","如何蓋一座新體育館","放學後的籃球比賽"]},{"qtype":"細節","q":"文章提到操場大門旁邊有什麼？","answer":"一籃球","options":["一籃球","一張書桌","一個花園"]},{"qtype":"細節","q":"文章說翹翹板是給誰用的？","answer":"比較年幼的學生","options":["比較年幼的學生","老師","校長"]},{"qtype":"推論","q":"根據文章，為什麼下課時常看到學生跑去洗手間？","answer":"因為下課時間很短，大家動作要快","options":["因為下課時間很短，大家動作要快","因為洗手間離教室很遠","因為只有下課才能用洗手間"]},{"qtype":"字義猜測","q":"根據上下文，\"quickly\" 最接近的意思是？","answer":"快速地","options":["快速地","安靜地","慢慢地"]}]},{"id":"kang-b1-l6-rooftop-garden","title":"Our Rooftop Garden","paras":["On the roof of Ruby's apartment building, there is a small garden. Every Sunday, Ruby and her grandmother work there together. \"There are many plants here today,\" Ruby says.","\"There is a new tomato plant near the gate,\" her grandmother says. \"Can you find it?\" Ruby looks around. \"Yes, I can see it! There are three small tomatoes on it,\" she says happily.","\"There are also some carrots beside the wall,\" her grandmother says. \"Please pull one out and wash it,\" she says. Ruby pulls a big carrot and washes it with water.","\"There is a bee near the flowers. Don't worry, it is friendly,\" her grandmother says. Ruby watches the bee for a while. \"There are so many flowers this week,\" she says.","At noon, they rest under a small tree on the roof. \"There is a nice view of the whole city from here,\" Ruby says. \"You can also see the school playground,\" her grandmother says.","\"I'm hungry now,\" Ruby says. \"There are some fresh tomatoes. Let us make a sandwich,\" her grandmother says with a smile. They cut the tomatoes and put them on bread.","\"This is the best part of Sunday,\" Ruby says as she eats. Her grandmother agrees. There is always something new to find in their small rooftop garden every week."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"Ruby 和奶奶在頂樓菜圃一起種菜和採收","options":["Ruby 和奶奶在頂樓菜圃一起種菜和採收","Ruby 和奶奶去市場買菜","Ruby 和奶奶在教室種花"]},{"qtype":"細節","q":"番茄樹上有幾顆番茄？","answer":"三顆","options":["兩顆","三顆","四顆"]},{"qtype":"細節","q":"奶奶請 Ruby 拔什麼菜？","answer":"紅蘿蔔","options":["紅蘿蔔","番茄","花"]},{"qtype":"推論","q":"為什麼奶奶說蜜蜂不用擔心？","answer":"因為那隻蜜蜂很友善不會傷害人","options":["因為那隻蜜蜂很友善不會傷害人","因為蜜蜂已經飛走了","因為蜜蜂被裝進盒子裡"]},{"qtype":"字義猜測","q":"根據上下文，\"rooftop\" 最接近的意思是？","answer":"屋頂","options":["屋頂","地下室","花園門口"]}]},{"id":"kang-b1-l6-swimming-class","title":"Swimming Class with a New Coach","paras":["It is Tuesday, and Kai's class has a swimming class at the school pool. \"There are so many students here today,\" Kai says to his friend Ella.","\"There is a new coach this week,\" Ella says. \"His name is Coach Lin. He is friendly but a little strict.\" Kai nods and puts his bag near the wall.","\"There are four groups today,\" Coach Lin says. \"Please find your group and stand near the pool.\" Kai finds his group beside the big clock.","\"There is a rule in this pool: don't run, and don't push,\" Coach Lin says. \"Walk carefully to the water.\" Everyone listens and walks slowly to the pool.","In the water, Kai tries a new way to swim. \"Can you swim to that line?\" Coach Lin asks. \"Yes, I can!\" Kai says, and he swims fast to the other side.","\"There is a small rest area beside the pool,\" Ella says. After class, they sit there and drink water. \"I'm hungry now,\" Kai says. \"There is a sandwich in my bag,\" Ella says with a smile.","\"This class is hard but really fun,\" Kai says. \"There is another swimming class next Tuesday,\" Coach Lin says. Kai and Ella are excited for the next class already."],"reading":[{"qtype":"主旨","q":"這篇文章主要在說什麼？","answer":"Kai 的班級上游泳課並認識新教練","options":["Kai 的班級上游泳課並認識新教練","Kai 的班級去比賽游泳","Kai 的班級在教室上課"]},{"qtype":"細節","q":"今天總共分成幾組？","answer":"四組","options":["三組","四組","五組"]},{"qtype":"細節","q":"Ella 的包包裡有什麼？","answer":"三明治","options":["三明治","水果","餅乾"]},{"qtype":"推論","q":"為什麼 Coach Lin 要大家慢慢走到水邊？","answer":"因為要遵守規則以避免奔跑推擠受傷","options":["因為要遵守規則以避免奔跑推擠受傷","因為水很冰很冷","因為地板正在打掃"]},{"qtype":"字義猜測","q":"根據上下文，\"coach\" 最接近的意思是？","answer":"教練","options":["教練","學生","醫生"]}]}]},"han":{"1":[{"id":"han-b1-l1-family-game-night","title":"Family Game Night","paras":["Tonight is a special night for Coco's family. It is family game night. Coco is a junior high school student. She is young, but she is really smart. Her cousin Leo is only in elementary school. He is small and very funny.","Who is at family game night? Coco's uncle is there. His name is Ray. He is a police officer. He is tall and handsome. Coco's aunt is there too. Her name is Mia. She is a writer. Her new book is about a young singer.","Where is Coco's mom? She is in the kitchen. Coco's mom is a housewife. She is busy, but she is happy. Coco's dad is an office worker. He is tired after work, but family game night makes him happy too.","What is the first game tonight? It is a family quiz. Each question is about the family. Who is a police officer? Uncle Ray! Who is a writer? Aunt Mia! Coco's baby cousin is quiet in her chair. She is only one year old.","The next game is a word game. Leo is really good at the game. His answer is always funny. Coco's grandma is a big fan of the word game too. She is old, but her mind is quick. Everyone is happy and loud.","Why is family game night so special? It is not about a winner. It is about family time together. Coco's family is small, but it is very dear to her. At the end, everyone is happy. Family game night is really great."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A family's fun game night together","options":["A family's fun game night together","A trip to a museum","A school quiz contest"]},{"qtype":"細節","q":"Where is Coco's mom during the quiz?","answer":"In the kitchen","options":["In the kitchen","At school","In the car"]},{"qtype":"細節","q":"How old is Coco's baby cousin?","answer":"One year old","options":["One year old","Two years old","Ten years old"]},{"qtype":"推論","q":"Why does game night make Coco's dad happy after a tired day?","answer":"Because family time is more important to him than being tired","options":["Because family time is more important to him than being tired","Because he wins every game","Because he doesn't like his job"]},{"qtype":"字義猜測","q":"In the passage, \"fan\" most likely means","answer":"someone who really likes something","options":["someone who really likes something","a machine that blows air","a person who plays music"]}]},{"id":"han-b1-l1-family-portrait-art-class","title":"A Family Portrait in Art Class","paras":["Max: What is your art project about, Ted?","Ted: It is a family portrait. Look, this is my family.","Max: Wow, your family is really big! Who is this man?","Ted: That is my uncle. He is a police officer. He is tall and handsome.","Max: And who is this woman? Is she your aunt?","Ted: Yes! She is my aunt. She is a writer. Her new book is really popular.","Max: Is this cute baby your cousin?","Ted: Yes, she is my baby cousin. She is really young.","Max: Your family is dear to you, huh?","Ted: Yes, it is. My mom is a housewife, and my dad is an office worker. They are busy, but they are happy.","Max: My family is small. It is just my mom, my dad, and me.","Ted: That's nice too! A small family is special as well.","Max: What about your grandma? Is she in the picture?","Ted: Yes, she is right here. She is old, but she is really funny.","Max: Your art project is beautiful, Ted. I really like your family portrait."],"reading":[{"qtype":"主旨","q":"What are Max and Ted mainly talking about?","answer":"Ted's family portrait for art class","options":["Ted's family portrait for art class","A new art teacher","A school art contest"]},{"qtype":"細節","q":"What is Ted's aunt's job?","answer":"A writer","options":["A writer","A singer","A police officer"]},{"qtype":"細節","q":"What are Ted's parents' jobs?","answer":"His mom is a housewife and his dad is an office worker","options":["His mom is a housewife and his dad is an office worker","Both are writers","Both are police officers"]},{"qtype":"推論","q":"Why does Ted say a small family is special too?","answer":"Because he wants to make Max feel good about his small family","options":["Because he wants to make Max feel good about his small family","Because he thinks big families are bad","Because he does not like his own family"]},{"qtype":"字義猜測","q":"In the dialog, \"dear\" most likely means","answer":"loved and important","options":["loved and important","expensive","far away"]}]},{"id":"han-b1-l1-family-reunion-culture","title":"Family Reunion Day","paras":["In Taiwan, one day every year is really special for many families. It is family reunion day. On this day, family members from far away come home.","Grandparents, aunts, uncles, and cousins are all together. The house is full and noisy, but the family is happy.","Who is at a family reunion? A big family has many kinds of people. An uncle can be a police officer, an office worker, or a writer.","An aunt can be a housewife, a singer, or a teacher. A cousin can be a baby, or a young student.","Food is a big part of family reunion day. The table is full of dishes. Grandma's dishes are old family recipes.","They are not fancy, but they are really dear to the family. Children like a new dish, but the old dishes are still the family favorite.","Family reunion day is also a time for stories. Grandpa tells a story about his young days. Dad and his brothers talk about their school days too. A shy young cousin is welcome to sit and listen. Kids learn about their family history this way.","Why is family reunion day so important? It is not just about the food or the new clothes. It is about family time.","A happy family is a family that is together. At the end of the day, every family member is a little tired, but really happy."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Why family reunion day is special in Taiwan","options":["Why family reunion day is special in Taiwan","How to cook a family recipe","A trip to Grandma's new house"]},{"qtype":"細節","q":"According to the passage, who can be a housewife, a singer, or a teacher?","answer":"An aunt","options":["An aunt","An uncle","A cousin"]},{"qtype":"細節","q":"What food do children like at the reunion?","answer":"A new dish","options":["A new dish","Only fruit","Cold rice"]},{"qtype":"推論","q":"Why does the passage say family reunion day is not just about the food?","answer":"Because being together as a family matters more than what people eat","options":["Because being together as a family matters more than what people eat","Because the food is never good","Because no one is hungry that day"]},{"qtype":"字義猜測","q":"In the passage, \"dear\" most likely means","answer":"loved and important","options":["loved and important","expensive to buy","far away"]}]},{"id":"han-b1-l1-library-corner","title":"Saturday at the Library Corner","paras":["Every Saturday morning, the Library Corner is busy. It is a small corner in Ken's town. Many classmates from the elementary school are there. Some students from the junior high school are there too.","Who takes care of the Library Corner? Mrs. Lin is the librarian. She is a kind woman. She is not young, but she is very active. Her daughter Ivy helps her every week. Ivy is a junior high school student.","Who visits the Library Corner today? A special guest is there. She is a young singer. Her name is Nina. She is really friendly. Her new book is about her life as a singer. It is a beautiful story.","Where is Nina's family today? Her husband is there. He is a police officer. He is tall and handsome. Nina's aunt is there too. She is a housewife, and she is very proud of Nina.","What is happening at the Library Corner? Nina is really happy to see so many classmates. She is dear to the town. The kids ask funny questions. Who is your favorite singer? Where is your new book from?","Why is the Library Corner so special? It is a place for family, friends, and neighbors. Every visitor is welcome, from a baby to a grandma. The Library Corner is really a dear place for everyone."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A singer's happy visit to a community library corner","options":["A singer's happy visit to a community library corner","A police officer's busy day","A student's first day at junior high school"]},{"qtype":"細節","q":"Who helps Mrs. Lin at the Library Corner every week?","answer":"Her daughter Ivy","options":["Her daughter Ivy","Her husband","Her aunt"]},{"qtype":"細節","q":"What is Nina's new book about?","answer":"Her life as a singer","options":["Her life as a singer","The Library Corner","Her husband's job"]},{"qtype":"推論","q":"Why is Nina's aunt very proud of her?","answer":"Because Nina is a successful young singer who is kind to her town","options":["Because Nina is a successful young singer who is kind to her town","Because Nina is a librarian","Because Nina is a police officer"]},{"qtype":"字義猜測","q":"In the passage, \"guest\" most likely means","answer":"a visitor who is invited somewhere","options":["a visitor who is invited somewhere","a person who works there every day","a book on the shelf"]}]}],"2":[{"id":"han-b1-l2-house-mice-facts","title":"Where Do House Mice Live?","paras":["Mice are really small animals. A mouse's body is tiny, but its tail is quite long. Its fur can be gray or brown.","House mice like to live near people. This is because a house has warm rooms and enough food. The kitchen is a mouse's favorite room.","Where does a mouse hide inside a house? It can hide behind the sofa, or in a small hole in the wall. It can even hide inside a kitchen cabinet.","A mouse's nose and whiskers are really useful. They help the mouse smell food from far away. A mouse can smell a cookie between two boxes!","Mice are quick and quiet. This helps them stay safe. A cat is a big danger for a mouse, so a mouse always looks for a safe, small space.","Mice are also clever. If a hole above the floor is too small, a mouse can still get inside. Its body is soft and can go through a tiny crack.","House mice are not really dangerous animals, but people do not want them in the house. That is why people check for cracks near the wall and the floor.","House mice are tiny, quick, and clever. What a special animal a house mouse is!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Facts about how house mice live near people","options":["Facts about how house mice live near people","How to draw a mouse","A story about a pet mouse"]},{"qtype":"細節","q":"Why do mice like to live near people?","answer":"Because a house has warm rooms and enough food","options":["Because a house has warm rooms and enough food","Because they like people's clothes","Because houses are always noisy"]},{"qtype":"細節","q":"What body parts help a mouse smell food?","answer":"Its nose and whiskers","options":["Its nose and whiskers","Its tail and feet","Its eyes and ears"]},{"qtype":"推論","q":"Why do people check for cracks near the wall and floor?","answer":"Because mice can get inside through very small spaces","options":["Because mice can get inside through very small spaces","Because they want more sunlight","Because they are painting the wall"]},{"qtype":"字義猜測","q":"In the passage, \"clever\" most likely means","answer":"smart and good at finding a way","options":["smart and good at finding a way","loud and slow","big and strong"]}]},{"id":"han-b1-l2-letter-about-new-house","title":"A Letter About My New House","paras":["Dear Zoe,","How are you? My family has a new house now! I really want to tell you about it.","This is my new bedroom. It is not too big, but it is really special to me. My bed is near the window, and my desk is right behind the door.","My notebook, my pencil case, and my markers are on the desk. My favorite color is purple, so my wall is purple too!","The living room is between the kitchen and my parents' bedroom. There is a big brown sofa in the living room. It is really comfortable.","The kitchen is small, but it has enough space for our table. We eat dinner together at that table every night.","There is one funny thing about this house. Sometimes we hear mice inside the wall! My dad says it is not a big problem.","This new house is a gift from my grandparents. It is really dear to my whole family.","Do you want to visit my new house too? I can show you my purple room and the big sofa!","Your friend,","Nora"],"reading":[{"qtype":"主旨","q":"What is this letter mainly about?","answer":"Nora telling Zoe about her family's new house","options":["Nora telling Zoe about her family's new house","Nora asking Zoe for a gift","Nora describing her school"]},{"qtype":"細節","q":"Where is Nora's desk?","answer":"Right behind the door","options":["Right behind the door","Near the window","Inside the kitchen"]},{"qtype":"細節","q":"Where is the living room?","answer":"Between the kitchen and her parents' bedroom","options":["Between the kitchen and her parents' bedroom","Above the kitchen","Behind the bedroom"]},{"qtype":"推論","q":"Why does Nora's dad say the mice are not a big problem?","answer":"He does not want the family to worry about them","options":["He does not want the family to worry about them","He thinks mice are pets","He wants to sell the house"]},{"qtype":"字義猜測","q":"In the letter, \"comfortable\" most likely means","answer":"nice and relaxing to sit or lie on","options":["nice and relaxing to sit or lie on","very expensive","hard and cold"]}]},{"id":"han-b1-l2-making-sushi","title":"Making Sushi with Ryan's Family","paras":["Every weekend, Ryan's family makes sushi together in the kitchen. This is their favorite weekend activity. Today they need rice, fish, and purple vegetables. \"This rice is enough for four people,\" says Ryan's mom.","\"This bowl is for the rice. That plate is for the fish,\" says Ryan's dad. The chopstick rests look like tiny gray mice. Ryan thinks they are really cute. He puts one near his notebook on the table.","Ryan's parents are between the sink and the table. His favorite job is rolling the sushi. \"Is this roll too big?\" he asks. \"No, that roll is just right,\" says his mom. Ryan is very hungry and wants to eat soon.","The dining room is right behind the kitchen. Ryan's little sister sets the table. She puts brown place mats and purple cups on the table. A small gift box is above the table. It is a special dessert for after dinner.","\"Where are the cookies?\" asks Ryan. \"They are inside the cabinet,\" says his dad. Ryan gets a few cookies. He is too hungry to wait for the sushi!","Finally, the sushi is ready. The family sits at the table in the dining room. \"This sushi roll is my favorite,\" says Ryan. Everyone is happy, and the kitchen smells wonderful. It is a really special Saturday for the whole family."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A family making sushi together on the weekend","options":["A family making sushi together on the weekend","A family shopping for cups and plates","A trip to a Japanese restaurant"]},{"qtype":"細節","q":"What color are the vegetables the family needs?","answer":"Purple","options":["Purple","Brown","Gray"]},{"qtype":"細節","q":"Whose favorite job is rolling the sushi?","answer":"Ryan's","options":["Ryan's","His mom's","His dad's"]},{"qtype":"推論","q":"Why does Ryan eat cookies before dinner?","answer":"Because he is too hungry to wait for the sushi","options":["Because he is too hungry to wait for the sushi","Because he does not like sushi","Because the sushi is not ready yet for his sister"]},{"qtype":"字義猜測","q":"In the passage, \"cabinet\" most likely means","answer":"a piece of furniture with doors for storing things","options":["a piece of furniture with doors for storing things","a kind of Japanese food","a small chair by the table"]}]},{"id":"han-b1-l2-school-movie-night","title":"School Movie Night","paras":["Tonight is a big event at school. It is movie night! Many parents and students are in the gym. This is Mia's favorite night of the year. The wall behind the screen is purple and gray, and it looks great.","\"Where is your seat?\" asks Mia's friend Zoe. \"My seat is right near the door, between the sofa and the snack table,\" says Mia. Mia is really hungry, so she wants a cookie from the snack table first.","The snack table has cookies in many colors, popcorn, and juice. \"This cookie is my favorite,\" says Mia. \"That popcorn smells really good too.\"","Before the movie, the teacher gives a small gift to a lucky person. \"This gift is a poster,\" she says. The name of a student is in a box near the front. The winner is really surprised and happy.","Mia's notebook and pencil case are inside her school bag, above her seat. She uses a marker to write the name of a friend on a card. This card is for a fun game before the movie starts.","The movie starts, and everyone is quiet. The popcorn makes a crack sound in the dark room. Behind Mia, her parents smile. This school movie night is really a special evening for the whole family."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A fun school movie night with snacks and a gift","options":["A fun school movie night with snacks and a gift","A cooking class at school","A test in the school gym"]},{"qtype":"細節","q":"Where is Mia's seat?","answer":"Near the door, between the sofa and the snack table","options":["Near the door, between the sofa and the snack table","Behind the screen","Inside the gift box"]},{"qtype":"細節","q":"What is on the snack table?","answer":"Cookies in many colors, popcorn, and juice","options":["Cookies in many colors, popcorn, and juice","A marker and a notebook","A poster and a box"]},{"qtype":"推論","q":"Why does Mia want a cookie before the movie starts?","answer":"Because she is really hungry","options":["Because she is really hungry","Because she does not like popcorn","Because the gift is a cookie"]},{"qtype":"字義猜測","q":"In the passage, \"poster\" most likely means","answer":"a large printed picture you can put on a wall","options":["a large printed picture you can put on a wall","a kind of snack food","a type of school bag"]}]}],"3":[{"id":"han-b1-l3-museum-dinosaur-bones","title":"How Museums Keep Dinosaur Bones Safe","paras":["A dinosaur skeleton is really old. Some dinosaur bones are millions of years old! That is why museums use many rules to keep them safe.","First, scientists dig up the bones very carefully. They use small brushes, not big tools. This helps them not to break the old bones.","Next, the bones go to a lab. In the lab, workers clean each bone and check it carefully. They use a test tube to test small rock pieces near the bones too.","At the museum, the dinosaur skeleton is inside a big glass case. This keeps the bones safe from dust and from people's hands.","There is always a sign near the skeleton. It says, \"Please do not touch.\" This rule helps protect the old bones.","The light in the room is not too bright. Bright light is not good for old bones. The room's temperature is also carefully controlled.","A museum guide can tell visitors many facts about the dinosaur. Visitors can take a photo, but they must follow the museum's safety rules.","Now you know why a museum dinosaur skeleton looks so amazing. What a lot of careful work it takes to keep it safe!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"The careful rules museums use to protect dinosaur bones","options":["The careful rules museums use to protect dinosaur bones","How to build a museum","A famous dinosaur movie"]},{"qtype":"細節","q":"Where does the dinosaur skeleton stay at the museum?","answer":"Inside a big glass case","options":["Inside a big glass case","On the floor","In a test tube"]},{"qtype":"細節","q":"What can visitors do, but must follow safety rules?","answer":"Take a photo","options":["Take a photo","Touch the bones","Use the lab tools"]},{"qtype":"推論","q":"Why is the light in the museum room not too bright?","answer":"Because bright light is not good for old bones","options":["Because bright light is not good for old bones","Because visitors do not like light","Because the museum wants to save money"]},{"qtype":"字義猜測","q":"In the passage, \"protect\" most likely means","answer":"keep something safe from harm","options":["keep something safe from harm","make something bigger","sell something for money"]}]},{"id":"han-b1-l3-museum-field-trip-rules","title":"Rules at the Museum","paras":["Kate: Look, Sam! A real dinosaur! Can we go see it now?","Sam: Wait, Kate. Please check the museum sign first.","Kate: Okay, what does it say? \"Please do not touch. Please be quiet.\"","Sam: Right. So we can look at the dinosaur, but we can not touch it.","Kate: I see. Can we take a photo, or is that not okay too?","Sam: A photo is fine. Just do not use a flash. It is not safe for the old bones.","Kate: Got it. Let's go to the mummy room next. My class talks about mummies a lot.","Sam: Sure, but do not hurry. There are many guys and girls in that room. Please follow me.","Kate: Okay. Wow, this room is like magic! So many old, safe rocks and test tubes from the lab.","Sam: Yes, and please do not fight for a good spot. We can take turns to see everything.","Kate: You are right. Museum rules are here to keep everything safe.","Sam: Sure! And now we can go see that real dinosaur."],"reading":[{"qtype":"主旨","q":"What are Kate and Sam mainly doing?","answer":"Following the rules on a museum field trip","options":["Following the rules on a museum field trip","Doing a science test in a lab","Fighting about a museum photo"]},{"qtype":"細節","q":"What does the museum sign say?","answer":"Please do not touch. Please be quiet.","options":["Please do not touch. Please be quiet.","Please run and have fun.","Please talk loudly and take photos."]},{"qtype":"細節","q":"What does Sam say they can do to see everything in a busy room?","answer":"Take turns","options":["Take turns","Fight for a spot","Hurry past everyone"]},{"qtype":"推論","q":"Why does Sam keep reminding Kate about the rules?","answer":"Because he wants their visit to be safe and follow the museum's rules","options":["Because he wants their visit to be safe and follow the museum's rules","Because he does not want to see the dinosaur","Because he does not like Kate"]},{"qtype":"字義猜測","q":"In the dialog, \"spot\" most likely means","answer":"a place to stand or look from","options":["a place to stand or look from","a small dot of color","a kind of test tube"]}]},{"id":"han-b1-l3-rainy-day-recess","title":"Rainy Day Lunch Break in the Gym","paras":["The rain is really heavy today, so lunch break is not outside. \"Please go to the gym,\" says the teacher. \"It is not safe to play outside now.\" Everyone follows the teacher to the gym.","The gym has many rules today. \"Please walk. Do not run,\" says the teacher. \"Be careful of the wet floor near the door.\"","\"Can we talk?\" asks Ruby. \"Yes, you can, but please be quiet,\" says the teacher. \"Can we play a game?\" asks Noah. \"Sure, you can, but follow the rules,\" says the teacher.","Ruby and her classmates sit in a quiet place. They use a magic card game. \"Please wait for your turn,\" says Ruby. Noah checks the rules of the game carefully. \"This is a fun way to spend our lunch,\" he says.","In the corner, some students talk about a museum trip. \"I see a dinosaur book over there,\" says a guy called Ken. \"Maybe we can visit the museum next time,\" says his friend.","After a while, the teacher says, \"Please wash your hands before you eat lunch now.\" Everyone follows the rule and lines up. Even on a rainy day, lunch in the gym can be really fun and safe."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Students following rules for an indoor lunch break on a rainy day","options":["Students following rules for an indoor lunch break on a rainy day","A basketball game in the rain","A class trip to a museum"]},{"qtype":"細節","q":"What must students be careful of near the door?","answer":"The wet floor","options":["The wet floor","A dinosaur book","The magic cards"]},{"qtype":"細節","q":"What does Ken see in the corner?","answer":"A dinosaur book","options":["A dinosaur book","A wet floor","A card game"]},{"qtype":"推論","q":"Why does the teacher tell students to walk instead of run in the gym?","answer":"Because running on a wet or crowded floor could be unsafe","options":["Because running on a wet or crowded floor could be unsafe","Because the teacher does not like games","Because there is a test after lunch"]},{"qtype":"字義猜測","q":"In the passage, \"corner\" most likely means","answer":"a small area where two walls or sides meet","options":["a small area where two walls or sides meet","the middle of the gym","a kind of card game"]}]},{"id":"han-b1-l3-slow-train-trip","title":"A Slow Train Trip","paras":["Today, Coco's class takes a slow train trip. \"Please follow me to the platform,\" says the teacher. \"Be careful and stay close to me,\" she says. Everyone is excited, and they are quiet as they wait.","On the train, a sign is near the door. It says, \"Please wash your hands before you eat.\" Coco can see many rocks and a small hill outside the window.","\"Can I open the window?\" asks a boy called Leo. \"Yes, you can, but please be careful,\" says the teacher. The train is slow, so everyone can see the beautiful place outside.","\"Look at that man with the dinosaur bag!\" says Coco. Her friend Ken laughs. \"Maybe that man visits the museum too,\" he says. \"Follow the rules, please,\" the teacher reminds everyone. \"Please talk in a quiet voice on the train.\"","At the next station, everyone can see a big rock mountain. \"Turn your head and look now!\" says the teacher. \"This is a special place.\" Coco takes a picture. She is really happy on this trip.","\"Please check your bag before we get off,\" says the teacher. \"Don't hurry; we have enough time.\" Everyone follows the rule. No one hurries. Coco's slow train trip is a really fun and safe day."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A class following rules on a fun, slow train trip","options":["A class following rules on a fun, slow train trip","A race between two trains","A class visiting a museum by bus"]},{"qtype":"細節","q":"What can Coco see outside the window?","answer":"Many rocks and a small hill","options":["Many rocks and a small hill","A big city","A dinosaur"]},{"qtype":"細節","q":"What does the teacher say before they get off the train?","answer":"Check your bag","options":["Check your bag","Open the window","Take a picture"]},{"qtype":"推論","q":"Why does the teacher keep reminding everyone to follow the rules?","answer":"Because she wants the trip to be safe and enjoyable for everyone","options":["Because she wants the trip to be safe and enjoyable for everyone","Because the students are fighting","Because the train is broken"]},{"qtype":"字義猜測","q":"In the passage, \"platform\" most likely means","answer":"the place where people wait to get on a train","options":["the place where people wait to get on a train","a kind of dinosaur bag","a window on the train"]}]}],"4":[{"id":"han-b1-l4-basketball-game","title":"The Class Basketball Game","paras":["It is three o'clock on Friday afternoon. The whole school is excited today. Class 701 is playing against Class 702 in the class basketball game. Everyone is cheering for their team.","On the court, Leo has the ball and runs fast. He is passing the ball to his friend Ken. Ken is jumping and shooting. \"Great job!\" everyone is shouting. The fans are cheering and shouting for both teams.","Ruby is not playing today. She is watching from a chair near the stage. She checks the score and writes notes for a report about the game.","The game is not free time; it is serious! Everyone is trying hard. \"We can win this game,\" says Leo. His classmates are cheering with all their hearts.","At four o'clock P.M., the game is ending. Class 701 has two more points than Class 702. Everyone is jumping with joy. It is a really great Friday for the whole school.","After the game, the players are talking and laughing. \"Good game,\" they say to each other. The gym is full of happy students. This class basketball game is really a great part of the week."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"An exciting basketball game between two classes","options":["An exciting basketball game between two classes","A school report about sports","A quiet Friday afternoon at school"]},{"qtype":"細節","q":"Who passes the ball to Ken?","answer":"Leo","options":["Leo","Ruby","The teacher"]},{"qtype":"細節","q":"What is Ruby doing near the stage?","answer":"Watching the game and writing a report","options":["Watching the game and writing a report","Playing basketball with Leo","Cheering loudly on the court"]},{"qtype":"推論","q":"Why does the passage say the game is \"not free time; it is serious\"?","answer":"Because both classes are trying hard to win, not just playing for fun","options":["Because both classes are trying hard to win, not just playing for fun","Because the teacher is angry","Because the game is too long"]},{"qtype":"字義猜測","q":"In the passage, \"court\" most likely means","answer":"the marked area where a game like basketball is played","options":["the marked area where a game like basketball is played","a place where people study English","a kind of school report"]}]},{"id":"han-b1-l4-kpop-concert-culture","title":"A Night at a K-pop Concert","paras":["A K-pop concert is a really popular event today. Every week, many fans are checking for concert news. They want to see their favorite band on stage.","On concert day, fans start waiting outside really early. Some fans are standing in line before the morning even starts! They are excited and ready for a great night.","When the doors open, everyone is walking to their seats together. Some fans are waving at the stage. Other fans are talking about the songs in a new music video from the band.","Now the concert is starting! The band members are singing and dancing on the big stage. The fans are singing along too. Everyone knows every word.","During the show, fans are clapping and enjoying every minute. This is not just a concert; it is a special memory for many fans.","After the concert, some lucky fans can join a meet-and-greet. They are so happy to see the band members up close.","By the time the concert ends, it is really late in the evening. But the fans are still smiling. What a great night a K-pop concert can be!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"The exciting experience of going to a K-pop concert","options":["The exciting experience of going to a K-pop concert","How bands write new songs","A report on ticket prices"]},{"qtype":"細節","q":"What are fans doing before the doors open?","answer":"Standing in line and waiting, excited and ready","options":["Standing in line and waiting, excited and ready","Sleeping at home","Studying for a test"]},{"qtype":"細節","q":"What are the band members doing on stage during the show?","answer":"Singing and dancing","options":["Singing and dancing","Studying and reading","Sitting and waiting"]},{"qtype":"推論","q":"Why does the passage say a concert is a special memory, not just a concert?","answer":"Because the experience means a lot more to fans than just music","options":["Because the experience means a lot more to fans than just music","Because concerts are always free","Because the band never performs again"]},{"qtype":"字義猜測","q":"In the passage, \"event\" most likely means","answer":"something special that happens","options":["something special that happens","a kind of song","a type of ticket"]}]},{"id":"han-b1-l4-lantern-festival","title":"A Night at the Lantern Festival","paras":["Tonight is Lantern Festival night. Owen and his family are walking together in the night market. Colorful lanterns are hanging everywhere. The sky is dark, but the market is really bright. Everyone is enjoying the fun and beautiful lights.","A band is playing music near the big stage. K-pop songs are playing too. People are singing along, and the whole market is full of joy.","Owen's friend Nina is standing near a big red lantern. She is looking at a lantern riddle. \"This riddle is really hard,\" she says. Owen is helping her think about the answer.","Many families are walking around the market together. A small booth is selling snacks and drinks. Kids are holding their own small lanterns.","Owen and Nina are trying to guess the answer to the riddle. \"Is it a rabbit?\" asks Nina. \"Yes! You are right!\" says the shop owner. They are really happy and get a small gift.","At the end of the night, Owen's family is standing together under the big lanterns. \"This is a really special night,\" says Owen's mom. Everyone is laughing and feeling thankful for the beautiful festival."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A family enjoying a lively Lantern Festival night together","options":["A family enjoying a lively Lantern Festival night together","A K-pop concert at a stage","A family shopping for snacks"]},{"qtype":"細節","q":"Who helps Nina think about the riddle's answer?","answer":"Owen","options":["Owen","The shop owner","Owen's mom"]},{"qtype":"細節","q":"What does the small booth sell?","answer":"Snacks and drinks","options":["Snacks and drinks","Lanterns and gifts","K-pop music videos"]},{"qtype":"推論","q":"Why does Owen's mom call it a really special night at the end?","answer":"Because the family had a fun and meaningful time together","options":["Because the family had a fun and meaningful time together","Because they won a basketball game","Because the market was closed early"]},{"qtype":"字義猜測","q":"In the passage, \"riddle\" most likely means","answer":"a puzzling question that people try to answer","options":["a puzzling question that people try to answer","a kind of colorful lantern","a type of K-pop song"]}]},{"id":"han-b1-l4-letter-weekend-plans","title":"A Letter About My Busy Week","paras":["Dear Ryan,","How are you? I am writing this letter on a Thursday night, and I am really tired!","This week is so busy. On Monday, I am studying for an English report with my study group. We are meeting after school every day this week.","On Friday, my favorite band is having a free mini concert near my school. I am so excited! My classmates and I are getting ready together.","On Saturday, there is a big weekend party at my cousin's house. Everyone in the family is coming, and we are all bringing food.","On Sunday, I am finally free! I am planning to watch a movie and just relax at home.","My little brother is also excited this week. He is a big fan of a popular music video right now. He is watching it again and again!","This week is really great, but I am ready for a quiet weekend too. Do you want to come to the mini concert with me on Friday?","Write back soon!","Your friend,","Ella"],"reading":[{"qtype":"主旨","q":"What is this letter mainly about?","answer":"Ella telling Ryan about her busy week","options":["Ella telling Ryan about her busy week","Ella asking Ryan for help with a report","Ella planning a trip with Ryan"]},{"qtype":"細節","q":"What is Ella doing on Monday?","answer":"Studying for an English report with her study group","options":["Studying for an English report with her study group","Watching a movie","Going to a concert"]},{"qtype":"細節","q":"What is happening at Ella's cousin's house on Saturday?","answer":"A big weekend party","options":["A big weekend party","A study group meeting","A mini concert"]},{"qtype":"推論","q":"Why does Ella say she is ready for a quiet weekend too?","answer":"Because her week is so busy that she also needs rest","options":["Because her week is so busy that she also needs rest","Because she does not like her friends","Because she does not like music"]},{"qtype":"字義猜測","q":"In the letter, \"relax\" most likely means","answer":"to rest and feel calm","options":["to rest and feel calm","to study very hard","to run quickly"]}]}],"5":[{"id":"han-b1-l5-hot-spring-trip","title":"Grace's Hot Spring Trip","paras":["It is the first week of October. Grace's family has plans for a hot spring trip. \"When is the trip?\" asks Grace. \"The trip starts on October fourth,\" says her dad. Everyone is excited about the trip.","On October fourth, the family arrives at the hot spring hotel. \"This is such an important trip for us,\" says Grace's mom. It is Grace's birthday month, so this trip is also a lucky gift for her.","\"Can we go in the hot spring now?\" asks Eric, Grace's little brother. \"Yes, we can, but please be careful near the water,\" says their dad. The water is warm, and everyone is really happy.","At dinner, the family eats a special meal together. \"This is a really wonderful dinner this month,\" says Grace. Her dad smiles. \"Next year, maybe we can visit again in November,\" he says.","Before bed, Grace and Eric look at the stars outside. \"This place is so quiet and beautiful,\" says Grace. She is really thankful for her family and this trip.","On the last day, everyone is a little sad to leave. \"This was a really special hot spring trip,\" says Grace. \"Let's come back next year,\" says Eric. Everyone agrees, and they promise to return."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A family's happy and relaxing hot spring trip in October","options":["A family's happy and relaxing hot spring trip in October","A family planning a birthday party at home","A family cooking a Thanksgiving dinner"]},{"qtype":"細節","q":"What does the dad tell Eric to be careful of near the water?","answer":"Being safe near the hot spring water","options":["Being safe near the hot spring water","Losing his birthday gift","Missing dinner"]},{"qtype":"細節","q":"What do Grace and Eric do before bed?","answer":"Look at the stars outside","options":["Look at the stars outside","Go in the hot spring again","Eat a special dinner"]},{"qtype":"推論","q":"Why does Grace say she is thankful at the end of the day?","answer":"Because she had a peaceful, happy time with her family","options":["Because she had a peaceful, happy time with her family","Because she got a new phone","Because school is over for the year"]},{"qtype":"字義猜測","q":"In the passage, \"hotel\" most likely means","answer":"a place where travelers pay to stay overnight","options":["a place where travelers pay to stay overnight","a kind of hot spring water","a special birthday gift"]}]},{"id":"han-b1-l5-rice-harvest","title":"A Rice Harvest Experience","paras":["It is the second week of August. Lily's class is visiting a rice field for a harvest experience. \"This is so exciting,\" says Lily. It is also an important lesson about food.","\"Be careful; the mud is everywhere,\" says the farmer. Lily's friend Sam looks a little nervous. \"Can I really do this?\" he asks. \"Yes, you can. It's not hard,\" says the farmer with a smile.","A cow from the farm is standing near the field. \"That cow helps carry things around the farm,\" he explains. Lily and Sam watch the cow with wide eyes. They think it is really cute.","Lily steps into the mud. \"This mud feels strange on my feet,\" she says, laughing. She cuts the rice the same way the farmer shows her. It is hard work, but it is also really fun.","At lunch, everyone eats rice from the field. \"This rice is from the harvest last month,\" says the farmer. \"It tastes wonderful,\" says Sam. Everyone agrees the rice is really delicious.","Before they leave, the farmer gives each student a small bag of rice. \"This is a gift for your family,\" he says. Lily is really thankful. On the bus ride home, she tells everyone, \"August fourth was such a special day.\""],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Students learning about rice through a hands-on harvest experience","options":["Students learning about rice through a hands-on harvest experience","A class visiting a zoo to see cows","A family's trip to a hot spring"]},{"qtype":"細節","q":"What does the cow on the farm help do?","answer":"Carry things around the farm","options":["Carry things around the farm","Cut the rice","Cook the lunch"]},{"qtype":"細節","q":"How does Lily describe the mud on her feet?","answer":"It feels strange","options":["It feels strange","It feels cold","It feels dry"]},{"qtype":"推論","q":"Why does the farmer tell the students to be careful in the field?","answer":"Because the muddy field could be slippery or hard to walk in","options":["Because the muddy field could be slippery or hard to walk in","Because the cow is dangerous","Because the rice is too hot"]},{"qtype":"字義猜測","q":"In the passage, \"harvest\" most likely means","answer":"the time when crops like rice are gathered from the field","options":["the time when crops like rice are gathered from the field","a kind of farm animal","a bag for carrying gifts"]}]},{"id":"han-b1-l5-surprise-party-planning","title":"Planning a Surprise Party","paras":["Sam: Iris, when is Owen's birthday? Is it in July or August?","Iris: It's on the fourth of August. It's only two weeks away!","Sam: A surprise party is a great idea! Do you also think so?","Iris: Yes! Let's plan it for the second Saturday of August. That date is perfect.","Sam: I'm a little nervous. What if Owen finds out before the party?","Iris: Don't worry. We will keep it a secret. It's important to be careful.","Sam: What about food? Should we also get a turkey leg like at Thanksgiving?","Iris: Ha, no! Let's just get a big cake and some snacks. That is enough.","Sam: Okay. Where should we hide the gifts before the party?","Iris: We can hide them at my house. My mom is really lucky; she is good at keeping secrets too.","Sam: This is going to be great. Owen is always thankful for his friends.","Iris: I know! What a fun day it will be for everyone."],"reading":[{"qtype":"主旨","q":"What are Sam and Iris mainly planning?","answer":"A surprise birthday party for Owen","options":["A surprise birthday party for Owen","A Thanksgiving dinner","A New Year's Eve party"]},{"qtype":"細節","q":"When do Sam and Iris plan to have the party?","answer":"The second Saturday of August","options":["The second Saturday of August","The fourth of August","The first Saturday of July"]},{"qtype":"細節","q":"Why is Sam a little nervous?","answer":"He worries Owen will find out about the party before it happens","options":["He worries Owen will find out about the party before it happens","He does not like cake","He does not want to invite Owen"]},{"qtype":"推論","q":"Why does Iris say her mom is good to help hide the gifts?","answer":"Because her mom is good at keeping secrets, so the surprise will stay safe","options":["Because her mom is good at keeping secrets, so the surprise will stay safe","Because her mom does not like Owen","Because her mom has a big house"]},{"qtype":"字義猜測","q":"In the dialog, \"secret\" most likely means","answer":"something not told to everyone","options":["something not told to everyone","a kind of birthday gift","a type of cake"]}]},{"id":"han-b1-l5-year-of-holidays","title":"A Year of Holidays","paras":["A year has twelve months, and many of them have a special holiday. Each holiday has its own story and its own way to celebrate.","January is the first month. On January first, many families are up before midnight on New Year's Eve. When the clock rings, everyone says a wish for a lucky new year.","Some families also celebrate a big holiday around February. It is an important time for family dinner and for giving gifts to children.","Around April, spring is warm, and some families visit family graves before summer comes. It is a quiet, important day for many families.","Around November, some countries celebrate Thanksgiving. Families are thankful, and dinner often has a big turkey leg on the table.","December is the last month. Around Christmas, people decorate a tree with lights. Children are excited, and they are a little nervous too, waiting for a gift.","On New Year's Eve, the last day of December, families gather together again. They count down to midnight and say goodbye to the old year.","From January to December, a year is full of holidays. Each one gives families a reason to be together. A year of holidays is really a year of family time."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Special holidays in different months of the year","options":["Special holidays in different months of the year","How to plan a birthday party","The weather in every season"]},{"qtype":"細節","q":"What do families do when the clock rings on January first?","answer":"Say a wish for a lucky new year","options":["Say a wish for a lucky new year","Give out turkey legs","Decorate a tree"]},{"qtype":"細節","q":"What do some families do around April?","answer":"Visit family graves before summer comes","options":["Visit family graves before summer comes","Watch fireworks at midnight","Give gifts to children"]},{"qtype":"推論","q":"Why does the passage say a year of holidays is really a year of family time?","answer":"Because every holiday gives families a reason to be together","options":["Because every holiday gives families a reason to be together","Because holidays are always in winter","Because families do not like holidays"]},{"qtype":"字義猜測","q":"In the passage, \"thankful\" most likely means","answer":"feeling grateful for something good","options":["feeling grateful for something good","feeling nervous about a test","feeling cold in winter"]}]}],"6":[{"id":"han-b1-l6-letter-zoo-visit-report","title":"A Letter About My Zoo Trip","paras":["Dear Kate,","Guess what? My class went to Green Valley Zoo this week! I want to tell you all about it.","There are so many animals at this zoo. There is a Lion and Tiger House near the front gate. The lion looked like a real king!","There is also a Monkey Forest. Some monkeys there are really funny. One monkey took a hat right off a visitor's head!","My favorite part was the Elephant Area. There is a huge elephant named Rocky. He is really healthy and full of energy.","Our teacher is an animal expert. She told us that oxpeckers help clean a zebra's coat. That is really an interesting example of animal friends.","There is never a boring moment at this zoo. We even saw a King Cobra Show at noon!","Luckily, there was good weather for our trip. The zoo also provides clean water for every visitor.","Do you want to visit Green Valley Zoo with me next time? I think you will really like the Monkey Forest too.","Your friend,","Nora"],"reading":[{"qtype":"主旨","q":"What is this letter mainly about?","answer":"Nora telling Kate about her class trip to the zoo","options":["Nora telling Kate about her class trip to the zoo","Nora asking Kate for a birthday gift","Nora writing about her new pet"]},{"qtype":"細節","q":"What did the teacher tell the class about oxpeckers?","answer":"They help clean a zebra's coat","options":["They help clean a zebra's coat","They live in the Monkey Forest","They are the same as elephants"]},{"qtype":"細節","q":"What happened at noon during the trip?","answer":"A King Cobra Show","options":["A King Cobra Show","A monkey race","Free lunch for everyone"]},{"qtype":"推論","q":"Why does Nora say there is never a boring moment at the zoo?","answer":"Because there are so many different animals and shows to see","options":["Because there are so many different animals and shows to see","Because the zoo is very small","Because visitors are not allowed to look around"]},{"qtype":"字義猜測","q":"In the letter, \"healthy\" most likely means","answer":"strong and well, not sick","options":["strong and well, not sick","very old and tired","loud and funny"]}]},{"id":"han-b1-l6-night-animal-watching","title":"A Night Animal Watching Tour","paras":["Tonight, Nina's family joins a night animal watching tour. \"There are many animals in this forest at night,\" says the guide. He is an animal expert. Everyone is quiet and excited.","\"There is a fox behind that tree,\" says the guide in a quiet voice. Everyone is quiet and careful. The fox has a healthy, clean coat. It looks around and then runs back into the dark forest.","\"Look, there are some monkeys in the tall trees,\" says Nina. The guide explains, \"Luckily, there is enough food in this forest for many animals.\" The monkeys are quiet as they eat in the trees.","Later, the guide shows a picture. \"In Africa, there is an animal called an oxpecker. It helps clean zebras and other animals,\" he says. \"There is no other bird quite like it,\" he adds. Everyone thinks it is wonderful.","\"Are there any bears in this forest?\" asks Nina. \"No, there are not,\" says the guide. \"But there is a family of foxes, and sometimes there is a rat or two near the trash cans!\" Everyone laughs.","At the end of the tour, the guide says, \"There is so much to learn about the animal world.\" Nina agrees. \"This was a really special night,\" she says. She never forgets her first night animal watching tour."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"A family learning about forest animals on a night tour","options":["A family learning about forest animals on a night tour","A family building a fox house","A guide who is lost in the forest"]},{"qtype":"細節","q":"What does the fox behind the tree have?","answer":"A healthy, clean coat","options":["A healthy, clean coat","A herd of babies","A bag of food"]},{"qtype":"細節","q":"Where are the monkeys in the story?","answer":"In the tall trees","options":["In the tall trees","Near the trash cans","Behind the fox"]},{"qtype":"推論","q":"Why does the guide talk in a quiet voice during the tour?","answer":"Because loud noises could scare the animals away","options":["Because loud noises could scare the animals away","Because he does not want to talk","Because it is a rule of the forest park"]},{"qtype":"字義猜測","q":"In the passage, \"tour\" most likely means","answer":"a trip taken to see and learn about a place","options":["a trip taken to see and learn about a place","a kind of forest animal","a bag for carrying food"]}]},{"id":"han-b1-l6-oxpecker-animal-friends","title":"The Oxpecker and Its Animal Friends","paras":["In the wild, there is a small bird called the oxpecker. This bird has a really special job.","There are many bugs living in the coat of a zebra or a horse. These bugs are not healthy for the big animal.","The oxpecker likes to eat these bugs. So, it sits on the back of a zebra and helps clean its coat.","There is also a big herd of animals in the wild, like a group of zebras or horses. The oxpecker can move from one animal to another and help the whole herd.","Experts say this is a great example of two animals helping each other. The zebra gets a clean coat, and the oxpecker gets food.","There is one more example. If danger is near, like a lion or a tiger, the oxpecker makes a loud sound. This sound can help the zebra know to run.","Luckily for the zebra, the oxpecker is always around. It never leaves its animal friend for long.","So, the next time you see a picture of a zebra, look for a small bird on its back. What a great animal friendship it is!"],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"The helpful friendship between the oxpecker and big animals","options":["The helpful friendship between the oxpecker and big animals","How zebras find food in the wild","A story about a lion hunting"]},{"qtype":"細節","q":"Why does the oxpecker sit on a zebra's back?","answer":"To eat bugs and help clean its coat","options":["To eat bugs and help clean its coat","To sleep in the sun","To play with the zebra"]},{"qtype":"細節","q":"What does the zebra get from this friendship?","answer":"A clean coat","options":["A clean coat","More food","A new home"]},{"qtype":"推論","q":"Why do experts call this a great example of animals helping each other?","answer":"Because both the oxpecker and the zebra get something good from it","options":["Because both the oxpecker and the zebra get something good from it","Because oxpeckers are dangerous","Because zebras do not like other animals"]},{"qtype":"字義猜測","q":"In the passage, \"herd\" most likely means","answer":"a large group of animals staying together","options":["a large group of animals staying together","a kind of bird","a type of food"]}]},{"id":"han-b1-l6-zoo-sketch-contest","title":"The Zoo Sketch Contest","paras":["Today is the school sketch contest at the zoo. \"There are so many animals to draw here,\" says Owen. He has his pencil case and paper for drawing. Ivy is excited too.","\"Look, there is a tiger near the rocks,\" says Ivy. The tiger has an orange and black coat. \"There is also a lion in the next area,\" says Owen. He starts to draw the lion first.","\"There are some zebras by the fence,\" says Ivy. The zebra has a coat with black and white lines. \"That's a fun pattern to draw,\" she says. She is careful with every line.","There is an elephant expert near the fence today. \"An elephant needs much food and water every day,\" she explains. \"There is no other animal on land quite as big,\" she says. Everyone listens with interest.","\"There is a monkey right above us!\" says Owen, pointing up. The monkey is really funny. It jumps from branch to branch. \"Luckily, there is enough time to draw it before it moves again,\" says Owen.","At the end of the contest, there is a table full of colorful animal sketch art. \"There is a prize for a really great drawing,\" says the teacher. Owen and Ivy both feel proud of their sketch work."],"reading":[{"qtype":"主旨","q":"What is this passage mainly about?","answer":"Two friends drawing zoo animals at a school sketch contest","options":["Two friends drawing zoo animals at a school sketch contest","A trip to feed elephants at the zoo","A basketball game at school"]},{"qtype":"細節","q":"What pattern does the zebra's coat have?","answer":"Black and white lines","options":["Black and white lines","Orange and black spots","Brown and gray dots"]},{"qtype":"細節","q":"Where is the monkey when Owen sees it?","answer":"Right above them","options":["Right above them","By the fence","Near the rocks"]},{"qtype":"推論","q":"Why does Owen want to draw the monkey quickly?","answer":"Because the monkey moves fast and might not stay still for long","options":["Because the monkey moves fast and might not stay still for long","Because the contest is about to end","Because he does not like monkeys"]},{"qtype":"字義猜測","q":"In the passage, \"contest\" most likely means","answer":"an event where people compete to see who does something best","options":["an event where people compete to see who does something best","a kind of zoo animal","a place to eat lunch"]}]}]}},"listening":{"qa":[{"id":"cap-qa-001","kind":"qa","subkind":"question","function":"道歉","material":["I'm sorry I still have your umbrella. Can I return it tomorrow?"],"question":null,"options":["Sure, that would be nice.","No, I already gave it back.","He needs it today."],"answer":0,"distractorTags":["答非所問-對象","人稱錯置"],"audioSrc":"audio/cap/cap-qa-001.mp3"},{"id":"cap-qa-002","kind":"qa","subkind":"question","function":"抱怨","material":["Why is my soup cold again? This happened last time too."],"question":null,"options":["S
